name: Apply improved V10 title sources

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/apply-title-source-improvements-v10.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-export-title-call-v10-20260817
          fetch-depth: 0
      - name: Preserve Wiki bilingual rows and normalized event prefixes
        run: |
          set -euo pipefail
          python3 scripts/improve-title-sources-v10.py
          python3 -m py_compile scripts/build-story-titles-v10.py
          grep -Fq 'suffix_after_normalized_prefix' scripts/build-story-titles-v10.py
          grep -Fq 'raw_cells' scripts/build-story-titles-v10.py
      - name: Commit source improvement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-story-titles-v10.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use more authoritative Wiki and Reader title prefixes'
            git push origin HEAD:fix/height-export-title-call-v10-20260817
          fi
      - name: Dispatch latest complete gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-complete-v10.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/height-export-title-call-v10-20260817
