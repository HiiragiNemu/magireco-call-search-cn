name: Fast emergency story-search production check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-fast-story-repair-check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for repaired Cloudflare deployment and validate data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, time, urllib.request
          from pathlib import Path

          base = 'https://magireco-call-search-cn.pages.dev'
          deadline = time.time() + 600

          def fetch(path, nonce):
              url = f'{base}/{path.lstrip("/")}'
              sep = '&' if '?' in url else '?'
              request = urllib.request.Request(
                  f'{url}{sep}repair={nonce}',
                  headers={'Cache-Control': 'no-cache, no-store', 'User-Agent': 'EmergencyFastVerifier'}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
              return raw

          while True:
              nonce = str(time.time_ns())
              try:
                  story = fetch('story.html', nonce).decode('utf-8')
                  runtime = fetch('myfile/story-title-runtime-v2.js', nonce).decode('utf-8')
                  if '20260822-emergency1' in story and 'story-title-runtime-v25-emergency-20260822' in runtime and 'PARENTS_URL' not in runtime:
                      break
              except Exception:
                  pass
              if time.time() >= deadline:
                  raise SystemExit('repaired production deployment did not appear within 10 minutes')
              time.sleep(5)

          def get_json(path):
              raw = fetch(path, str(time.time_ns()))
              if raw.lstrip().startswith(b'<'):
                  raise RuntimeError(f'{path} returned HTML')
              return json.loads(raw.decode('utf-8'))

          catalog = get_json('data/character-catalog.json')
          manifest = get_json('data/story-v6/manifest.json')
          localization = get_json('data/story-v7/localization.json')
          variants = get_json('data/story-v6/variant-map.json')
          groups = get_json('data/story-title-groups-v1.json')
          assert isinstance(catalog, list) and len(catalog) >= 180
          assert manifest['totalRows'] == 14466
          assert len(manifest['categories']) == 19
          assert isinstance(localization.get('characters'), dict)
          assert isinstance(variants.get('families'), dict)
          assert len(groups.get('groups', [])) == 2166

          total = 0
          for category in manifest['categories']:
              payload = get_json(f'data/story-v6/{category["file"]}')
              assert payload['key'] == category['key']
              assert len(payload['rows']) == category['count']
              total += len(payload['rows'])
          assert total == 14466

          parts = []
          for index in range(4):
              raw = fetch(f'data/v25-title-delta.part-{index:02d}.txt', str(time.time_ns()))
              if raw.lstrip().startswith(b'<'):
                  raise RuntimeError(f'V25 title part {index} returned HTML')
              parts.append(raw.decode('utf-8').strip())
          delta = json.loads(gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8'))
          assert delta['r'] == 'v25-live-cn-20260821'

          proof = {
              'schemaVersion': 1,
              'state': 'pass',
              'repair': 'V25 emergency runtime restored',
              'characterCount': len(catalog),
              'categoryCount': len(manifest['categories']),
              'storyRowCount': total,
              'titleGroupCount': len(groups['groups']),
              'titlePayloadRelease': delta['r'],
              'runtimeRelease': 'story-title-runtime-v25-emergency-20260822',
              'allCoreResponsesParsedAsData': True,
          }
          Path('/tmp/emergency-fast-proof.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY

      - name: Commit fast production proof and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p reports
          cp /tmp/emergency-fast-proof.json reports/emergency-story-search-fast-proof.json
          rm -f .github/workflows/emergency-fast-story-repair-check.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record passing fast story-search production repair check'
          git push origin HEAD:main
