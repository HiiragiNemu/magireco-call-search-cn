name: Refresh final V16 parent-story data

on:
  push:
    branches: [main]
    paths:
      - .automation/v16-refresh-trigger.txt

permissions:
  contents: write

concurrency:
  group: refresh-final-v16-story-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate authoritative parent-story outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-story-title-groups-v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          groups = json.loads(Path('public/data/story-title-groups-v1.json').read_text(encoding='utf-8'))
          report = json.loads(Path('public/data/story-title-build-report-v1.json').read_text(encoding='utf-8'))
          summary = groups['summary']
          assert report['state'] == 'pass'
          assert summary['totalRows'] == 14466
          assert summary['categoryCount'] == 19
          assert summary['parentGroups'] > 1000
          assert summary['childTitles'] == 5710
          aquarium = next(g for g in groups['groups'] if g['category'] == 'イベント' and g['source_base'] == 'ウワサアクアリウムへようこそ')
          assert aquarium['child_count'] >= 20
          assert any(c['source_title'].endswith('5話') for c in aquarium['children'])
          assert Path('public/downloads/story-title-groups.json').read_bytes().startswith(b'{')
          assert Path('public/downloads/story-title-groups.csv').read_bytes().startswith(b'\xef\xbb\xbf')
          assert Path('public/downloads/story-title-groups.xlsx').read_bytes().startswith(b'PK')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Confirm second build is byte-stable
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            public/data/story-title-groups-v1.json \
            public/data/story-title-map.generated.json \
            public/data/story-title-build-report-v1.json \
            public/downloads/story-title-groups.json \
            public/downloads/story-title-groups.csv \
            public/downloads/story-title-overrides-template.json \
            docs/story-title-groups-v1.md > /tmp/before.sha256
          python3 scripts/build-story-title-groups-v1.py
          sha256sum \
            public/data/story-title-groups-v1.json \
            public/data/story-title-map.generated.json \
            public/data/story-title-build-report-v1.json \
            public/downloads/story-title-groups.json \
            public/downloads/story-title-groups.csv \
            public/downloads/story-title-overrides-template.json \
            docs/story-title-groups-v1.md > /tmp/after.sha256
          diff -u /tmp/before.sha256 /tmp/after.sha256

      - name: Commit regenerated outputs and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/v16-refresh-trigger.txt
          rm -f .github/workflows/refresh-v16-story-data.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh deterministic V16 parent-story data'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload refreshed data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-v16-story-data-${{ github.run_id }}
          path: |
            /tmp/before.sha256
            /tmp/after.sha256
            public/data/story-title-groups-v1.json
            public/data/story-title-map.generated.json
            public/data/story-title-build-report-v1.json
            public/downloads/story-title-groups.json
            public/downloads/story-title-groups.csv
            public/downloads/story-title-groups.xlsx
            docs/story-title-groups-v1.md
          if-no-files-found: warn
          retention-days: 30
