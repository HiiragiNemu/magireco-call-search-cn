name: Emergency story-search repair verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-story-search-repair-verify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-story-search-repair
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository-side repair inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          root = Path('.')
          required_json = [
              'public/data/character-catalog.json',
              'public/data/story-v6/manifest.json',
              'public/data/story-v6/variant-map.json',
              'public/data/story-v7/localization.json',
              'public/data/story-title-groups-v1.json',
          ]
          for rel in required_json:
              raw = (root / rel).read_bytes()
              if raw.lstrip().startswith(b'<'):
                  raise SystemExit(f'{rel} contains HTML')
              json.loads(raw.decode('utf-8'))

          manifest = json.loads((root / 'public/data/story-v6/manifest.json').read_text(encoding='utf-8'))
          assert manifest['totalRows'] == 14466
          assert len(manifest['categories']) == 19
          for category in manifest['categories']:
              rel = root / 'public/data/story-v6' / category['file']
              payload = json.loads(rel.read_text(encoding='utf-8'))
              assert payload['key'] == category['key']
              assert isinstance(payload['rows'], list)
              assert len(payload['rows']) == category['count']

          chunks = []
          for index in range(4):
              rel = root / f'public/data/v25-title-delta.part-{index:02d}.txt'
              assert rel.is_file(), rel
              chunks.append(rel.read_text(encoding='utf-8').strip())
          delta = json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8'))
          assert delta['r'] == 'v25-live-cn-20260821'
          assert isinstance(delta['p'], dict) and isinstance(delta['s'], dict) and isinstance(delta['e'], dict)

          runtime = (root / 'public/myfile/story-title-runtime-v2.js').read_text(encoding='utf-8')
          story = (root / 'public/story.html').read_text(encoding='utf-8')
          editor = (root / 'public/story-title-editor.html').read_text(encoding='utf-8')
          assert 'story-title-runtime-v25-emergency-20260822' in runtime
          assert 'PARENTS_URL' not in runtime
          assert '20260822-emergency1' in story
          assert '20260822-emergency1' in editor
          print('Repository-side repair inputs are valid.')
          PY

      - name: Wait for Cloudflare Pages emergency repair
        shell: bash
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            story="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/story.html?repair=$nonce" 2>/dev/null || true)"
            runtime="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/myfile/story-title-runtime-v2.js?repair=$nonce" 2>/dev/null || true)"
            if grep -Fq '20260822-emergency1' <<< "$story" \
              && grep -Fq 'story-title-runtime-v25-emergency-20260822' <<< "$runtime" \
              && ! grep -Fq 'PARENTS_URL' <<< "$runtime"; then
              echo "Cloudflare Pages serves the repaired runtime after attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for repaired production deployment.' >&2
          exit 1

      - name: Verify every production story-data response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, time, urllib.request

          base = 'https://magireco-call-search-cn.pages.dev'
          nonce = str(time.time_ns())

          def get(path):
              url = f'{base}/{path.lstrip("/")}'
              sep = '&' if '?' in url else '?'
              req = urllib.request.Request(
                  f'{url}{sep}repair={nonce}',
                  headers={'Cache-Control': 'no-cache, no-store', 'User-Agent': 'V25-emergency-verifier'}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  status = response.status
                  content_type = response.headers.get('content-type', '')
              if status != 200:
                  raise RuntimeError(f'{path}: HTTP {status}')
              if raw.lstrip().startswith(b'<!DOCTYPE') or raw.lstrip().startswith(b'<html'):
                  raise RuntimeError(f'{path}: returned HTML instead of data')
              return raw, content_type

          def get_json(path):
              raw, _ = get(path)
              try:
                  return json.loads(raw.decode('utf-8'))
              except Exception as error:
                  raise RuntimeError(f'{path}: invalid JSON: {error}') from error

          catalog = get_json('data/character-catalog.json')
          assert isinstance(catalog, list) and len(catalog) >= 180
          manifest = get_json('data/story-v6/manifest.json')
          assert manifest['totalRows'] == 14466
          assert len(manifest['categories']) == 19
          variants = get_json('data/story-v6/variant-map.json')
          assert isinstance(variants.get('families'), dict)
          localization = get_json('data/story-v7/localization.json')
          assert isinstance(localization.get('characters'), dict)
          groups = get_json('data/story-title-groups-v1.json')
          assert len(groups.get('groups', [])) == 2166

          total_rows = 0
          checked_categories = []
          for category in manifest['categories']:
              payload = get_json(f'data/story-v6/{category["file"]}')
              assert payload['key'] == category['key']
              assert len(payload['rows']) == category['count']
              total_rows += len(payload['rows'])
              checked_categories.append(category['key'])
          assert total_rows == 14466

          chunks = []
          for index in range(4):
              raw, _ = get(f'data/v25-title-delta.part-{index:02d}.txt')
              chunks.append(raw.decode('utf-8').strip())
          delta = json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8'))
          assert delta['r'] == 'v25-live-cn-20260821'
          assert isinstance(delta['p'], dict) and isinstance(delta['s'], dict) and isinstance(delta['e'], dict)

          proof = {
              'state': 'pass',
              'checkedAtEpochNs': nonce,
              'catalogCount': len(catalog),
              'categoryCount': len(checked_categories),
              'totalRows': total_rows,
              'titleGroupCount': len(groups['groups']),
              'titlePayloadRelease': delta['r'],
              'allResponsesWereNonHtml': True,
              'allJsonParsed': True,
          }
          with open('/tmp/emergency-endpoint-proof.json', 'w', encoding='utf-8') as handle:
              json.dump(proof, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY

      - name: Install Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise repaired production UI in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = 'https://magireco-call-search-cn.pages.dev'
          nonce = str(time.time_ns())
          console_errors = []
          page_errors = []
          failed_requests = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 1440, 'height': 1100})
              page.on('console', lambda msg: console_errors.append(msg.text) if msg.type == 'error' else None)
              page.on('pageerror', lambda error: page_errors.append(str(error)))
              page.on('requestfailed', lambda request: failed_requests.append(f'{request.method} {request.url}: {request.failure}'))
              response = page.goto(f'{base}/story.html?repair={nonce}', wait_until='domcontentloaded', timeout=120000)
              assert response and response.ok, response.status if response else None
              page.wait_for_function("document.querySelectorAll('.suite-character-card').length >= 180", timeout=120000)
              page.wait_for_function("!document.querySelector('#storyStatus').textContent.includes('初始化失败')", timeout=120000)
              assert page.locator('#storySearchButton').is_enabled()
              count_text = page.locator('#storyCharacterCount').inner_text()
              assert '显示' in count_text and '已选' in count_text, count_text

              page.locator('input[name="storyType"]').evaluate_all("nodes => nodes.forEach(node => { node.checked = false; node.dispatchEvent(new Event('change', {bubbles:true})); })")
              page.locator('input[name="storyType"][value="魔法少女"]').check()
              page.locator('.suite-character-card[data-jp="環いろは"]').click()
              page.locator('#storySearchButton').click()
              page.wait_for_function("document.querySelectorAll('#storyResultsBody .story-row-v7').length > 0", timeout=120000)
              result_count = page.locator('#storyResultsBody .story-row-v7').count()
              status = page.locator('#storyStatus').inner_text()
              assert '失败' not in status and '错误' not in status, status
              page.screenshot(path='/tmp/emergency-story-search-repaired.png', full_page=False)

              page.goto(f'{base}/story-title-editor.html?repair={nonce}', wait_until='domcontentloaded', timeout=120000)
              page.wait_for_function("document.querySelectorAll('#titleEditorList tr[data-group-id]').length >= 2000", timeout=120000)
              editor_status = page.locator('#titleEditorStatus').inner_text()
              assert '失败' not in editor_status, editor_status

              # Main navigation destinations must still return usable documents.
              for path in ('/', '/attendance.html', '/runes.html'):
                  response = page.goto(f'{base}{path}?repair={nonce}', wait_until='domcontentloaded', timeout=120000)
                  assert response and response.ok, (path, response.status if response else None)
                  assert '<!DOCTYPE' not in page.locator('body').inner_text()[:100]

              browser.close()

          fatal_console = [item for item in console_errors if 'favicon' not in item.lower()]
          proof = {
              'state': 'pass',
              'characterCountText': count_text,
              'storyResultRows': result_count,
              'storyStatus': status,
              'editorStatus': editor_status,
              'pageErrors': page_errors,
              'failedRequests': failed_requests,
              'consoleErrors': fatal_console,
          }
          if page_errors or failed_requests or fatal_console:
              raise SystemExit(json.dumps(proof, ensure_ascii=False, indent=2))
          Path('/tmp/emergency-browser-proof.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY

      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: emergency-story-search-repair-proof
          path: |
            /tmp/emergency-endpoint-proof.json
            /tmp/emergency-browser-proof.json
            /tmp/emergency-story-search-repaired.png
          retention-days: 30

      - name: Record passing repair proof and remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p reports
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          endpoint = json.loads(Path('/tmp/emergency-endpoint-proof.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('/tmp/emergency-browser-proof.json').read_text(encoding='utf-8'))
          proof = {
              'schemaVersion': 1,
              'state': 'pass',
              'repair': 'restore-known-good-v25-title-runtime',
              'verifiedAt': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'production': 'https://magireco-call-search-cn.pages.dev/story.html',
              'endpointChecks': endpoint,
              'browserChecks': browser,
          }
          Path('reports/emergency-story-search-repair.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          rm -f .github/workflows/emergency-story-search-repair-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record verified story-search emergency repair'
          git push origin HEAD:main
