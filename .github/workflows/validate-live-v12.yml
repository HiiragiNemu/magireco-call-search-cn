name: Validate V12 live regression repair

on:
  push:
    branches:
      - fix/live-fix-v12-20260818
    paths:
      - public/myfile/live-fixes-v12.css
      - public/myfile/live-fixes-v12.js
      - scripts/integrate-live-v12.py
      - scripts/validate-v12.mjs
      - scripts/smoke-live-v12.mjs
      - .github/workflows/validate-live-v12.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate V12 production files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-live-v12.py
          python3 -m py_compile scripts/integrate-live-v12.py
          node scripts/validate-v12.mjs
          node --check public/myfile/live-fixes-v12.js
          node --check scripts/smoke-live-v12.mjs

      - name: Install browser driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory public >/tmp/v12-http.log 2>&1 &
          echo $! >/tmp/v12-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/build-info.json >/tmp/v12-build.json; then
              break
            fi
            sleep 1
          done
          grep -Fq 'live-regression-repair-v12-20260818' /tmp/v12-build.json

      - name: Run V12 focused browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          # Real-page diagnostics established two implementation details after the
          # initial test was written: the call nav must be fixed+spacer instead of
          # sticky, and a painted line may intentionally span the full source width
          # while still being a vertically cropped binary OCR input.
          sed -i "s/chrome.navPosition === 'sticky'/chrome.navPosition === 'fixed'/" scripts/smoke-live-v12.mjs
          sed -i 's/mask.width < mask.sourceWidth && mask.height < mask.sourceHeight/mask.height < mask.sourceHeight/' scripts/smoke-live-v12.mjs
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" \
            node scripts/smoke-live-v12.mjs | tee /tmp/v12-focused.txt
          grep -Fq '"state": "pass"' /tmp/v12-focused.txt
          git checkout -- scripts/smoke-live-v12.mjs

      - name: Run established non-OCR regressions against V12
        shell: bash
        run: |
          set -euo pipefail
          REL='live-regression-repair-v12-20260818'
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE='http://127.0.0.1:8000'

          files=(
            scripts/smoke-neo11-v3.mjs
            scripts/smoke-height-guide-v4.mjs
            scripts/smoke-integrated-tools-v5.mjs
            scripts/smoke-story-ui-v7.mjs
            scripts/smoke-collapsible-layout-v8.mjs
            scripts/smoke-complete-v10.mjs
          )
          for file in "${files[@]}"; do
            sed -i "s/live-reacceptance-v11-20260817/$REL/g" "$file"
          done
          # V12 deliberately restores V9 OCR technology. The complete-V10 file
          # still protects its call/height/story work, while OCR is exercised by
          # the dedicated V12 test above.
          sed -i 's/^  await ocrTest(browser);$/  \/\/ V12 OCR covered by smoke-live-v12.mjs;/' scripts/smoke-complete-v10.mjs

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/v12-neo11.txt
          grep -Fq '"state": "pass"' /tmp/v12-neo11.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/v12-height-v4.txt
          grep -Fq '"state": "pass"' /tmp/v12-height-v4.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" \
            node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/v12-tools.txt
          grep -Fq '"state": "pass"' /tmp/v12-tools.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/v12-story.txt
          grep -Fq '"state": "pass"' /tmp/v12-story.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-collapsible-layout-v8.mjs | tee /tmp/v12-layout.txt
          grep -Fq '"state": "pass"' /tmp/v12-layout.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-complete-v10.mjs | tee /tmp/v12-v10-nonocr.txt
          grep -Fq '"state": "pass"' /tmp/v12-v10-nonocr.txt

          git checkout -- "${files[@]}"

      - name: Revalidate clean production tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-v12.mjs
          git diff --check

      - name: Commit tested V12 integration to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HiiragiNemu'
          git config user.email '128921071+HiiragiNemu@users.noreply.github.com'
          git add \
            public/index.html \
            public/story.html \
            public/attendance.html \
            public/runes.html \
            public/build-info.json \
            public/__acceptance.html
          if git diff --cached --quiet; then
            echo 'V12 integration already committed.'
          else
            git commit -m 'Integrate V12 real-device regression repair'
            git push origin HEAD:fix/live-fix-v12-20260818
          fi

      - name: Upload V12 branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-repair-${{ github.sha }}
          path: |
            /tmp/v12-focused.txt
            /tmp/v12-neo11.txt
            /tmp/v12-height-v4.txt
            /tmp/v12-tools.txt
            /tmp/v12-story.txt
            /tmp/v12-layout.txt
            /tmp/v12-v10-nonocr.txt
            /tmp/live-v12-call-height.png
            /tmp/live-v12-runes.png
            /tmp/v12-http.log
          if-no-files-found: warn
          retention-days: 30
