name: Dispatch final V7 publication
# Category order, cast mapping, swipe-safe rail, root quick rail, and border-aware OCR repairs applied.

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/dispatch-v7-integration.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the final source-only publication gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-v7-final.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/story-ui-translation-ocr-v7-20260816
