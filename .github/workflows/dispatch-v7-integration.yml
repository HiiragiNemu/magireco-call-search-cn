name: Dispatch corrected V7 integration
# Cast localization and swipe-safe quick-rail repair applied.

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/dispatch-v7-integration.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the gated integration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run integrate-story-ui-v7.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/story-ui-translation-ocr-v7-20260816
