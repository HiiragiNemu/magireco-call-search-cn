name: Integrate rune mask V9

on:
  push:
    branches:
      - fix/rune-mask-v9-20260816
    paths:
      - .github/workflows/integrate-rune-mask-v9.yml
      - public/myfile/runes-mask-v9.js
      - public/myfile/runes-mask-v9.css
      - scripts/integrate-rune-mask-v9.py
      - scripts/smoke-rune-mask-v9.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-rune-mask-v9
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out V9 branch
        uses: actions/checkout@v4
        with:
          ref: fix/rune-mask-v9-20260816
          fetch-depth: 0

      - name: Integrate V9 into production pages and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-rune-mask-v9.py
          git diff --check

      - name: Validate static structure, bridges and syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          for file in \
            public/myfile/runes-mask-v9.js \
            public/myfile/runes-template-v7.js \
            public/myfile/runes-app.js \
            scripts/smoke-rune-mask-v9.mjs \
            scripts/smoke-rune-v7.mjs \
            scripts/smoke-collapsible-layout-v8.mjs \
            scripts/smoke-story-ui-v7.mjs \
            scripts/smoke-integrated-tools-v5.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-neo11-v3.mjs; do
            node --check "$file"
          done
          python3 -m py_compile scripts/integrate-rune-mask-v9.py
          grep -Fq 'global.__RUNE_INPUT_OVERRIDE_V9__ || fileInput.files?.[0]' public/myfile/runes-template-v7.js
          grep -Fq 'const recognitionFile = global.__RUNE_INPUT_OVERRIDE_V9__ || file;' public/myfile/runes-app.js

      - name: Install browser driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8000 --directory public >/tmp/v9-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:8000/build-info.json >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/v9-http.log
          exit 1

      - name: Run all established non-OCR regressions
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/v9-neo11.txt
          grep -Fq '"state": "pass"' /tmp/v9-neo11.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/v9-height.txt
          grep -Fq '"state": "pass"' /tmp/v9-height.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/v9-tools.txt
          grep -Fq '"state": "pass"' /tmp/v9-tools.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/v9-story.txt
          grep -Fq '"state": "pass"' /tmp/v9-story.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-collapsible-layout-v8.mjs | tee /tmp/v9-layout.txt
          grep -Fq '"state": "pass"' /tmp/v9-layout.txt

      - name: Run classic, ordered and paint-mask OCR acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-rune-v7.mjs | tee /tmp/v9-rune-regression.txt
          grep -Fq '"state": "pass"' /tmp/v9-rune-regression.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-rune-mask-v9.mjs | tee /tmp/v9-mask.txt
          grep -Fq '"state": "pass"' /tmp/v9-mask.txt

      - name: Commit only fully tested V9 production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts
          if git diff --cached --quiet; then
            echo 'V9 production source is already integrated.'
          else
            git commit -m 'Integrate and validate paint-to-keep rune OCR mask V9'
            git push origin HEAD:fix/rune-mask-v9-20260816
          fi

      - name: Upload V9 pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-mask-v9-prepublication-${{ github.sha }}
          path: |
            /tmp/v9-http.log
            /tmp/v9-neo11.txt
            /tmp/v9-height.txt
            /tmp/v9-tools.txt
            /tmp/v9-story.txt
            /tmp/v9-layout.txt
            /tmp/v9-rune-regression.txt
            /tmp/v9-mask.txt
            /tmp/rune-mask-v9-desktop.png
            /tmp/rune-mask-v9-mobile.png
            /tmp/rune-v7-desktop.png
            /tmp/story-ui-v7-mobile.png
            /tmp/collapsible-v8-story-mobile.png
            /tmp/collapsible-v8-attendance-desktop.png
            /tmp/collapsible-v8-call-mobile.png
          if-no-files-found: warn
          retention-days: 30
