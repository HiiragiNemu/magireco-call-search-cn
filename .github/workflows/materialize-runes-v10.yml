name: Materialize assembled V10 rune source

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/materialize-runes-v10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-export-title-call-v10-20260817
          fetch-depth: 0
      - name: Assemble and verify source
        run: |
          set -euo pipefail
          python3 scripts/assemble-runes-v10.py
          node --check public/myfile/runes-v10.js
      - name: Commit generated branch-only source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-v10.js
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize assembled V10 rune recognizer for focused repair'
            git push origin HEAD:fix/height-export-title-call-v10-20260817
          fi
