name: Repair V8 browser acceptance timeouts

on:
  push:
    branches:
      - fix/collapsible-layout-v8-20260816
    paths:
      - .github/workflows/repair-v8-browser-evidence-timeouts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collapsible-layout-v8-20260816
          fetch-depth: 0

      - name: Avoid huge full-document screenshots and extend CDP timeout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('scripts/smoke-neo11-v3.mjs'),
              Path('scripts/smoke-height-guide-v4.mjs'),
              Path('scripts/smoke-integrated-tools-v5.mjs'),
              Path('scripts/smoke-story-layout-v6.mjs'),
              Path('scripts/smoke-ocr-v6.mjs'),
              Path('scripts/smoke-story-ui-v7.mjs'),
              Path('scripts/smoke-rune-v7.mjs'),
              Path('scripts/smoke-collapsible-layout-v8.mjs'),
          ]
          changed = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('fullPage: true', 'fullPage: false')
              launch = 'const browser = await puppeteer.launch({\n'
              if launch in text and 'protocolTimeout:' not in text[text.index(launch):text.index(launch)+220]:
                  text = text.replace(launch, launch + '  protocolTimeout: 600000,\n', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No smoke-test timeout patch was applied.')
          print('\n'.join(changed))
          PY

          for file in \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-integrated-tools-v5.mjs \
            scripts/smoke-story-layout-v6.mjs \
            scripts/smoke-ocr-v6.mjs \
            scripts/smoke-story-ui-v7.mjs \
            scripts/smoke-rune-v7.mjs \
            scripts/smoke-collapsible-layout-v8.mjs; do
            test -f "$file" && node --check "$file"
          done

      - name: Commit timeout-safe acceptance evidence settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-*.mjs
          git commit -m 'Keep expanded V8 browser acceptance within CDP limits'
          git push origin HEAD:fix/collapsible-layout-v8-20260816
