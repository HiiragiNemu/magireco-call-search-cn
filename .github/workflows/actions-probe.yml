name: Complete V26 atomically without breaking production

on:
  push:
    branches: [main]
    paths:
      - .actions-probe-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v26-complete-atomic
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current working V25 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify remote branch state before modifying files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          printf 'Remote branches before V26: %s\n' "${branches[*]}"
          [ "${#branches[@]}" -eq 1 ]
          [ "${branches[0]}" = "main" ]

      - name: Build complete V26 in the runner workspace
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/.v26-complete-atomic.py.gz.b64 | gzip -d > /tmp/v26-complete-atomic.py
          python /tmp/v26-complete-atomic.py --root .
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise the complete V26 locally before any production commit
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public >/tmp/v26-local-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/v26-build-marker.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/v26-build-marker.json >/dev/null
          python scripts/browser-smoke.py \
            --base http://127.0.0.1:4173 \
            --output /tmp/v26-local-browser-proof.json

      - name: Commit the fully validated V26 product atomically
        id: product
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'The complete V26 build produced no product changes.' >&2
            exit 1
          fi
          git commit -m 'Complete V26 plain-JSON architecture and repository convergence'
          product_sha="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$base_sha" ]; then
            git rebase origin/main
            product_sha="$(git rev-parse HEAD)"
          fi
          git push origin HEAD:main
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for and verify all V26 production data
        id: live
        shell: bash
        run: |
          set +e
          python scripts/verify-live-v26.py \
            --base https://magireco-call-search-cn.pages.dev \
            --wait-seconds 1200 \
            --output /tmp/v26-live-proof.json \
            >/tmp/v26-live.log 2>&1
          rc=$?
          cat /tmp/v26-live.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exercise the deployed V26 in Chromium
        id: browser
        if: steps.live.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python scripts/browser-smoke.py \
            --base https://magireco-call-search-cn.pages.dev \
            --output /tmp/v26-production-browser-proof.json \
            >/tmp/v26-browser.log 2>&1
          rc=$?
          cat /tmp/v26-browser.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Automatically restore the known-good V25 site if production verification fails
        if: steps.live.outputs.rc != '0' || steps.browser.outputs.rc != '0'
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git revert --no-edit "$PRODUCT_SHA"
          git push origin HEAD:main
          mkdir -p reports
          {
            echo 'Complete V26 production verification failed; the product commit was automatically reverted.'
            echo "product_sha=$PRODUCT_SHA"
            echo "live_rc=${{ steps.live.outputs.rc }}"
            echo "browser_rc=${{ steps.browser.outputs.rc }}"
            echo
            cat /tmp/v26-live.log 2>/dev/null || true
            cat /tmp/v26-browser.log 2>/dev/null || true
          } > reports/v26-complete-production-failure.txt
          git add reports/v26-complete-production-failure.txt
          git commit -m 'Record failed complete V26 production verification'
          git push origin HEAD:main
          exit 1

      - name: Record final proof and remove the one-shot migration machinery
        if: steps.live.outputs.rc == '0' && steps.browser.outputs.rc == '0'
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/v26-complete-atomic.yml
          rm -f scripts/.v26-complete-atomic.py.gz.b64
          rm -f .v26-complete-trigger
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path

          live = json.loads(Path('/tmp/v26-live-proof.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('/tmp/v26-production-browser-proof.json').read_text(encoding='utf-8'))
          branches = subprocess.check_output(
              "git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort",
              shell=True,
              text=True,
          ).splitlines()
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          expected_workflows = ['ci.yml', 'production-verify.yml', 'update-authoritative-titles.yml']
          assert branches == ['main'], branches
          assert workflows == expected_workflows, workflows
          proof = {
              'schemaVersion': 1,
              'state': 'pass',
              'release': 'v26-converged-20260822',
              'verifiedAt': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              'productSha': os.environ['PRODUCT_SHA'],
              'remoteBranches': branches,
              'workflows': workflows,
              'priorities': {
                  '1_repository_convergence': 'complete',
                  '2_versioned_local_overrides_and_production_closure': 'complete',
                  '3_plain_json_title_architecture': 'complete',
                  '9_public_directory_cleanup': 'complete',
              },
              'liveDataVerification': live,
              'productionBrowserVerification': browser,
          }
          Path('reports').mkdir(parents=True, exist_ok=True)
          Path('reports/v26-convergence.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('reports/v26-production-proof.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record completed V26 production closure'
          git push origin HEAD:main

      - name: Preserve the completed V26 release with a tag
        if: steps.live.outputs.rc == '0' && steps.browser.outputs.rc == '0'
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v26-converged-20260822 >/dev/null 2>&1; then
            echo 'V26 completion tag already exists.'
          else
            git tag -a v26-converged-20260822 "$PRODUCT_SHA" -m 'Completed V26 production release'
            git push origin refs/tags/v26-converged-20260822
          fi

      - name: Upload complete V26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-complete-atomic-evidence
          path: |
            /tmp/v26-local-browser-proof.json
            /tmp/v26-live-proof.json
            /tmp/v26-production-browser-proof.json
            /tmp/v26-live.log
            /tmp/v26-browser.log
          if-no-files-found: ignore
          retention-days: 30
