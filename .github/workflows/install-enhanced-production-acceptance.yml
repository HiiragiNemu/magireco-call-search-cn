name: Install enhanced production acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-enhanced-production-acceptance.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate enhanced acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > public/__acceptance.html
          test "$(sha256sum public/__acceptance.html | awk '{print $1}')" = '1b61d6e225f1baf6e76306c41c5e943fb1566f60ece73e7aae27a28f4ed857c3'
          python3 <<'PY'
          from pathlib import Path
          import re
          html = Path('public/__acceptance.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html, flags=re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}.')
          Path('/tmp/enhanced-acceptance.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/enhanced-acceptance.js
          grep -Fq '片假名搜索与平假名统一' public/__acceptance.html
          grep -Fq '五种双击筛选模式完整' public/__acceptance.html
          grep -Fq '右侧底部浮动按钮可以滚动到页面下方' public/__acceptance.html

      - name: Commit the enhanced acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HiiragiNemu'
          git config user.email '128921071+HiiragiNemu@users.noreply.github.com'
          git add public/__acceptance.html
          if git diff --cached --quiet; then
            echo 'Enhanced acceptance harness is already current.'
            exit 0
          fi
          git commit -m 'Expand production acceptance coverage'
          git push origin HEAD:main
