name: Finalize V7 cast map and rail V3

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/repair-v7-mobile-rail-cast-map-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0

      - name: Apply complete cast map and mobile rail patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/build-story-localization-v7.py')
          text = path.read_text(encoding='utf-8')
          alias_block = '''MANUAL_CHARACTER_ALIASES = {
              "いろはちゃん": "小彩羽", "まどか先輩": "小圆前辈", "フェリシアちゃん": "小菲莉希亚",
              "ほむらちゃん": "小焰", "悪魔ほむらちゃん": "恶魔小焰", "やちよ師匠": "八千代师父",
              "小さなキュゥべえ": "小丘比", "小さいキュウベェ": "小丘比", "キュゥべえ": "丘比",
              "ピンクのキュゥべえ": "粉色丘比", "ジュゥべえ": "朱比", "ウワサさん": "谣先生",
              "まばゆの母": "眩的母亲", "鹿目詢子": "鹿目询子", "早乙女先生": "早乙女和子",
              "上条恭介": "上条恭介", "灯花の父": "灯花的父亲", "里見太助": "里见太助",
              "夏希の兄": "夏希的哥哥", "まどか先輩・いろはちゃん": "小圆前辈·小彩羽",
              "まどか先輩＆いろはちゃん": "小圆前辈与小彩羽",
              "いろは・うい(巫女ver)": "环彩羽·环忧（巫女ver.）",
              "いろは・やちよ": "环彩羽·七海八千代", "いろは・やちよ(決戦ver)": "环彩羽·七海八千代（决战ver.）",
              "おネェさま": "姐姐大人", "オネェさま": "姐姐大人",
              "かりん・アリナ(ハロウィンver)": "御园花凛·阿莉娜·格雷（万圣节ver.）", "ちはるの母": "千春的母亲",
              "まさら・こころ(花嫁ver)": "加贺见真良·粟根心（新娘ver.）",
              "ももこ・みたま(人魚ver)": "十咎桃子·八云御魂（人鱼ver.）",
              "やちよ・みふゆ(始まりver)": "七海八千代·梓美冬（初始ver.）",
              "アイ": "爱", "エッべ": "埃贝", "タケさん": "阿武", "トルテ": "托尔特", "ニコラ": "尼古拉",
              "ユリア": "尤莉娅", "ラマ": "拉玛", "レナ・かえで(水着ver)": "水波玲奈·秋野枫（泳装ver.）",
              "伊津見尹縫": "伊津见尹缝", "八九寺真宵": "八九寺真宵", "出涸嵐マナ": "出涸岚玛娜",
              "千石撫子": "千石抚子", "天音姉妹(水着ver)": "天音姐妹（泳装ver.）", "忍野忍": "忍野忍",
              "戦場ヶ原ひたぎ": "战场原黑仪", "未完成いろは": "未完成彩羽",
              "梨花・れん(クリスマスver)": "绫野梨花·五十铃怜（圣诞ver.）", "水名の先輩": "水名前辈",
              "波レナ": "波玲奈", "灯花・ねむ(聖夜ver)": "里见灯花·柊音梦（圣夜ver.）", "神原駿河": "神原骏河",
              "結菜・樹里(ヴァンパイアver)": "红晴结菜·大庭树里（吸血鬼ver.）", "羽川翼": "羽川翼",
              "那由他・みかげ(クリスマスver)": "里见那由他·八云御影（圣诞ver.）", "静香の母": "静香的母亲",
              "鶴乃・フェリシア(宅配ver)": "由比鹤乃·深月菲莉希亚（配送ver.）",
          }

          MANUAL_CHARACTER_IMAGE_SOURCE = {
              "いろは・うい(巫女ver)": "環いろは", "いろは・やちよ": "環いろは", "いろは・やちよ(決戦ver)": "環いろは",
              "かりん・アリナ(ハロウィンver)": "御園かりん", "ちはるの母": "広江ちはる",
              "まさら・こころ(花嫁ver)": "加賀見まさら", "ももこ・みたま(人魚ver)": "十咎ももこ",
              "やちよ・みふゆ(始まりver)": "七海やちよ", "レナ・かえで(水着ver)": "水波レナ",
              "天音姉妹(水着ver)": "天音月夜", "未完成いろは": "環いろは", "梨花・れん(クリスマスver)": "綾野梨花",
              "波レナ": "水波レナ", "灯花・ねむ(聖夜ver)": "里見灯花", "結菜・樹里(ヴァンパイアver)": "紅晴結菜",
              "那由他・みかげ(クリスマスver)": "里見那由他", "静香の母": "時女静香",
              "鶴乃・フェリシア(宅配ver)": "由比鶴乃",
          }

          VARIANT_REPLACEMENTS'''
          text, count = re.subn(
              r'MANUAL_CHARACTER_ALIASES = \{[\s\S]*?\n\}\n\nVARIANT_REPLACEMENTS',
              alias_block,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Alias section replacement failed.')

          loop_pattern = re.compile(
              r'    for raw, zh in MANUAL_CHARACTER_ALIASES\.items\(\):\n'
              r'        base_raw, _ = variant_parts\(raw\)\n'
              r'        base = characters\.get\(base_raw\) or normalized\.get\(norm\(base_raw\)\)\n'
              r'        register\(raw, zh, base\.get\("image", ""\) if base else "", "audited-alias"\)'
          )
          loop_replacement = (
              '    for raw, zh in MANUAL_CHARACTER_ALIASES.items():\n'
              '        base_raw, _ = variant_parts(raw)\n'
              '        image_source = MANUAL_CHARACTER_IMAGE_SOURCE.get(raw, base_raw)\n'
              '        base = characters.get(image_source) or normalized.get(norm(image_source))\n'
              '        register(raw, zh, base.get("image", "") if base else "", "audited-alias")'
          )
          text, count = loop_pattern.subn(lambda _: loop_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Alias registration loop replacement failed.')
          path.write_text(text, encoding='utf-8')

          path = Path('public/myfile/suite-v7.css')
          css = path.read_text(encoding='utf-8')
          if '.suite-quick-rail-v7 {\n  position: fixed;\n  pointer-events: none;' not in css:
              css = css.replace(
                  '.suite-quick-rail-v7 {\n  position: fixed;',
                  '.suite-quick-rail-v7 {\n  position: fixed;\n  pointer-events: none;',
                  1,
              )
          if '.suite-quick-rail-v7 button {\n  display: grid;\n  pointer-events: auto;' not in css:
              css = css.replace(
                  '.suite-quick-rail-v7 button {\n  display: grid;',
                  '.suite-quick-rail-v7 button {\n  display: grid;\n  pointer-events: auto;',
                  1,
              )
          css = css.replace(
              '.suite-quick-rail-v7 { right: 1px; gap: 3px; }\n  .suite-quick-rail-v7 button { width: 39px; height: 39px; border-radius: 10px; font-size: 1rem; opacity: .86; }',
              '.suite-quick-rail-v7 { right: 1px; gap: 2px; }\n  .suite-quick-rail-v7 button { width: 32px; height: 32px; border-radius: 9px; font-size: .86rem; opacity: .82; }',
              1,
          )
          if 'width: 32px; height: 32px' not in css:
              raise SystemExit('Mobile rail size patch failed.')
          path.write_text(css, encoding='utf-8')
          PY
          python3 -m py_compile scripts/build-story-localization-v7.py

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-story-localization-v7.py public/myfile/suite-v7.css
          git commit -m 'Finalize cast localization and swipe-safe mobile quick rail'
          git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
