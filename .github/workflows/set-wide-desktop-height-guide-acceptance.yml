name: Set wide desktop height-guide acceptance

on:
  push:
    branches:
      - fix/height-guide-v4-20260816
    paths:
      - .github/workflows/set-wide-desktop-height-guide-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-guide-v4-20260816
          fetch-depth: 0
      - name: Patch the desktop all-visible test
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch-wide-v4.py
          python3 /tmp/patch-wide-v4.py
          node --check scripts/smoke-height-guide-v4.mjs
      - name: Commit wide desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-height-guide-v4.mjs
          git commit -m 'Verify all height lines in an all-visible desktop viewport'
          git push origin HEAD:fix/height-guide-v4-20260816
