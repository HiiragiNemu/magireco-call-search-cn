name: Final V26 convergence recovery

on:
  push:
    branches: [main]
    paths:
      - .v26-final-recovery-r2-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v26-final-recovery-r2
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch non-idempotent legacy preparation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/v26-converge.py')
          text = path.read_text(encoding='utf-8')
          patched, count = re.subn(
              r'^\s*prepare_permanent_updater\(\)\s*$',
              '',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('prepare_permanent_updater call not found exactly once')
          path.write_text(patched, encoding='utf-8')
          PY
          python -m py_compile scripts/v26-converge.py

      - name: Execute one-shot convergence
        id: product
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v26-converge.py

          # Enforce the accepted cleanup scope even if the older script omitted an item.
          rm -rf node_modules .automation NEW public/oldfile
          rm -f public/__acceptance.html public/json_open_old.html
          find public/data -maxdepth 1 -type f -name 'v25-title-delta.part-*.txt' -delete
          find . -maxdepth 1 -type f \( -name '.deploy-*' -o -name '.v22-*' -o -name '.v23-*' -o -name '.v24-*' -o -name '.v25-*' -o -name '.v26-*' \) -delete
          find scripts -maxdepth 1 -type f \( -name '*v22*' -o -name '*v23*' -o -name '*v24*' -o -name 'v26-converge*' -o -name 'v26-final*' \) -delete
          find tests -maxdepth 1 -type f \( -name '*v22*' -o -name '*v23*' -o -name '*v24*' -o -name '*v25*' -o -name '*v26*' \) -delete 2>/dev/null || true
          rm -f reports/v26-convergence-failure.txt reports/v26-final-failure.txt
          rm -f .github/workflows/v26-final-recovery-r2.yml

          cat >> .gitignore <<'EOF'

# Generated/development-only material
node_modules/
_sources/
.cache/
.pytest_cache/
coverage/
dist/
build/
*.log
.env
.env.*
EOF
          awk '!seen[$0]++' .gitignore > .gitignore.tmp
          mv .gitignore.tmp .gitignore

          test -f data/titles/authority.json
          test -f public/data/titles/manifest.json
          test -f public/data/titles/parents.json
          test -f public/data/titles/suffixes.json
          test -f public/data/titles/titles.json
          test -f public/data/titles/provenance.json
          test -f public/v26-build-marker.json
          test -f scripts/build-title-data.py
          test -f scripts/validate-production.py
          test ! -d node_modules
          test ! -d .automation
          test ! -d NEW
          test ! -e public/__acceptance.html
          test ! -e public/json_open_old.html
          test ! -d public/oldfile
          test -z "$(find public/data -maxdepth 1 -type f -name 'v25-title-delta.part-*.txt' -print -quit)"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 3
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          ! grep -Fq 'DecompressionStream' public/myfile/story-title-runtime-v2.js
          ! grep -Fq 'v25-title-delta.part' public/myfile/story-title-runtime-v2.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Converge V26 production repository'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages V26
        shell: bash
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          for attempt in $(seq 1 150); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            marker="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/v26-build-marker.json?v26=$nonce" 2>/dev/null || true)"
            if python - "$marker" <<'PY'
          import json, sys
          try:
              value = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          ok = (
              value.get('release') == 'v26-converged-20260821'
              and value.get('groupCount') == 2166
              and value.get('childTitleCount') == 5826
              and value.get('formalJsonArchitecture') is True
              and value.get('legacySplitPayloads') is False
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "Cloudflare Pages serves V26 after attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for V26 production.' >&2
          exit 1

      - name: Verify live formal JSON architecture
        shell: bash
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          nonce="${GITHUB_RUN_ID}-verify-$(date +%s%N)"
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/titles/manifest.json?v26=$nonce" -o /tmp/manifest.json
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/titles/parents.json?v26=$nonce" -o /tmp/parents.json
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/titles/titles.json?v26=$nonce" -o /tmp/titles.json
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/myfile/story-title-runtime-v2.js?v26=$nonce" -o /tmp/runtime.js
          python - <<'PY'
          import json, re
          from pathlib import Path
          kana = re.compile(r'[\u3040-\u30ff\u31f0-\u31ffー]')
          manifest = json.loads(Path('/tmp/manifest.json').read_text())
          parents = json.loads(Path('/tmp/parents.json').read_text())['parentByCategory']
          titles = json.loads(Path('/tmp/titles.json').read_text())['titleByCategory']
          assert manifest['release'] == 'v26-converged-20260821'
          assert manifest['groupCount'] == 2166
          assert manifest['childTitleCount'] == 5826
          assert sum(len(items) for items in parents.values()) == 2166
          assert sum(len(items) for items in titles.values()) == 5826
          for mappings in (parents, titles):
              for items in mappings.values():
                  for target in items.values():
                      assert not kana.search(str(target)), target
          assert parents['scene0']['サイドストーリー Film.0'] == '支线故事 Film.0'
          assert titles['scene0']['サイドストーリー Film.0 1 (紫)'] == '支线故事 Film.0 1 （紫色）'
          assert titles['メモリア']['No.888 夢を追う妹'] == 'No.888 追梦的妹妹'
          assert titles['メモリア']['No.901 記憶の中の温もりは蘇り'] == 'No.901 记忆中的温暖复苏了'
          runtime = Path('/tmp/runtime.js').read_text()
          assert 'story-title-runtime-v26-20260821' in runtime
          assert 'DecompressionStream' not in runtime
          assert 'v25-title-delta.part' not in runtime
          assert 'parsed.release !== DATA_RELEASE' in runtime
          PY

      - name: Delete every non-main remote branch
        id: branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          if ! git rev-parse -q --verify refs/tags/v25-live-cn-20260821 >/dev/null; then
            git tag v25-live-cn-20260821 61412dd507ce676b77e93c96b0a872bdb89c2bf8
            git push origin refs/tags/v25-live-cn-20260821
          fi
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          deleted=0
          for branch in "${branches[@]}"; do
            [[ "$branch" == 'main' ]] && continue
            echo "Deleting $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          printf '%s\n' "${remaining[@]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = 'main'
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"

      - name: Record final proof and V26 tag
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          DELETED_BRANCHES: ${{ steps.branches.outputs.deleted }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          path = Path('reports/v26-convergence.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.update({
              'state': 'pass',
              'verifiedAt': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              'production': 'https://magireco-call-search-cn.pages.dev',
              'productionVerified': True,
              'productSha': os.environ['PRODUCT_SHA'],
              'deletedBranchCount': int(os.environ['DELETED_BRANCHES']),
              'remainingBranches': ['main'],
              'branchCleanup': 'complete',
              'workflowCount': 3,
              'activeBuildBranch': 'main'
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-convergence.json
          git commit -m 'Record passing V26 convergence'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          git tag -f v26-converged-20260821 "$final_sha"
          git push --force origin refs/tags/v26-converged-20260821

      - name: Final assertions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = 'main'
          git fetch origin main
          git reset --hard origin/main
          python scripts/build-title-data.py --check
          python scripts/validate-production.py

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          {
            echo 'V26 final recovery failed.'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_sha=${GITHUB_SHA}"
            echo
            echo '=== remote branches ==='
            git ls-remote --heads origin
            echo
            echo '=== git status ==='
            git status --short
          } > reports/v26-final-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-final-failure.txt
          git commit -m 'Record V26 final recovery failure' || true
          git push origin HEAD:main || true
