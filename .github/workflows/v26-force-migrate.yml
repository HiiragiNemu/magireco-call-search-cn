name: Force corrected V26 migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v26-force-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-corrected-v26-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch and run migration with all diagnostics captured
        id: run
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/v26-force-migrate.log 2>&1
          from pathlib import Path
          import re
          import subprocess
          import sys

          path = Path('scripts/migrate-v26-repository.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    parents = payload\["p"\]\n'
              r'    suffixes = payload\["s"\]\n'
              r'    exact = payload\["e"\]\n'
              r'    parent_count = sum\(len\(value\) for value in parents\.values\(\)\)\n'
              r'    if parent_count != 2166:\n'
              r'        raise RuntimeError\(f"unexpected parent count: \{parent_count\}"\)\n'
          )
          replacement = '''    parent_delta = payload["p"]
          suffixes = payload["s"]
          exact = payload["e"]
          groups_data = json.loads((ROOT / "public/data/story-title-groups-v1.json").read_text(encoding="utf-8"))
          parents: dict[str, dict[str, str]] = {}
          for group in groups_data.get("groups") or []:
              category = str(group.get("category") or "")
              source_base = str(group.get("source_base") or "")
              target = str(
                  (parent_delta.get(category) or {}).get(source_base)
                  or group.get("approved_translation")
                  or group.get("current_translation")
                  or source_base
              ).strip()
              if not category or not source_base or not target:
                  raise RuntimeError(f"invalid parent group: {group!r}")
              parents.setdefault(category, {})[source_base] = target
          parent_count = sum(len(value) for value in parents.values())
          if parent_count != 2166:
              raise RuntimeError(f"unexpected complete parent count: {parent_count}")
          '''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one parent-count block, replaced {count}')
          path.write_text(updated, encoding='utf-8')
          subprocess.run([sys.executable, str(path)], check=True)
          PY
          rc=$?
          cat /tmp/v26-force-migrate.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated JavaScript
        id: js
        if: steps.run.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          {
            node --check public/myfile/story-title-runtime-v2.js
            node --check public/myfile/story-title-editor-v2.js
          } >> /tmp/v26-force-migrate.log 2>&1
          rc=$?
          cat /tmp/v26-force-migrate.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record forced migration failure
        if: steps.run.outputs.rc != '0' || steps.js.outputs.rc != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p reports
          {
            echo 'Forced corrected V26 migration failed.'
            echo "migration_rc=${{ steps.run.outputs.rc }}"
            echo "js_rc=${{ steps.js.outputs.rc }}"
            echo "source_sha=$GITHUB_SHA"
            echo
            cat /tmp/v26-force-migrate.log
          } > reports/v26-forced-migration-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-forced-migration-failure.txt
          git commit -m 'Record forced V26 migration failure'
          git push origin HEAD:main
          exit 1

      - name: Commit completed V26 convergence
        if: steps.run.outputs.rc == '0' && steps.js.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete V26 formal data and repository cleanup'
          git push origin HEAD:main
