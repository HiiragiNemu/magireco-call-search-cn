name: V26 atomic convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v26-finalize-atomic.yml
      - .v26-finalize-atomic-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v26-atomic-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic V26 convergence
        run: |
          set -euo pipefail
          python scripts/v26-finalize-atomic.py

      - name: Commit converged repository directly to main
        id: product
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'The V26 finalizer produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Complete V26 repository and title-data convergence'
          git push origin HEAD:main
          product_sha="$(git rev-parse HEAD)"
          echo "sha=$product_sha" >> "$GITHUB_OUTPUT"

      - name: Delete every remote branch except main and verify
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            git push origin --delete "$branch"
          done < <(git ls-remote --heads origin | sed 's#.*refs/heads/##')
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          printf 'Remaining branches: %s\n' "${branches[*]}"
          [ "${#branches[@]}" -eq 1 ]
          [ "${branches[0]}" = "main" ]

      - name: Preserve the converged release with a tag
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v26-converged-20260821 >/dev/null 2>&1; then
            echo 'The V26 release tag already exists.'
          else
            git tag -a v26-converged-20260821 "$PRODUCT_SHA" -m 'V26 converged production release'
            git push origin refs/tags/v26-converged-20260821
          fi

      - name: Wait for Cloudflare Pages to serve V26
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            marker="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/v26-build-marker.json?v=$nonce" 2>/dev/null || true)"
            if python - "$marker" <<'PY'
          import json, sys
          try:
              value = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if value.get('release') == 'v26-converged-20260821' and value.get('dataArchitecture') == 'plain-json' else 1)
          PY
            then
              echo "Cloudflare Pages serves V26 after attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare Pages V26.' >&2
          exit 1

      - name: Independently verify the live production site
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: |
          set -euo pipefail
          python scripts/verify-live-v26.py \
            --base https://magireco-call-search-cn.pages.dev \
            --output /tmp/v26-production-proof.json \
            --source-sha "$PRODUCT_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Record final production and repository proof
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          proof_path = Path('/tmp/v26-production-proof.json')
          proof = json.loads(proof_path.read_text(encoding='utf-8'))
          proof.update({
              'onlyMainBranch': True,
              'remoteBranchCount': 1,
              'workflowCount': 3,
              'repositoryConvergence': True,
              'publicDirectoryCleanup': True,
          })
          text = json.dumps(proof, ensure_ascii=False, indent=2) + '\n'
          Path('public/v26-production-proof.json').write_text(text, encoding='utf-8')
          Path('reports').mkdir(parents=True, exist_ok=True)
          Path('reports/v26-production-proof.json').write_text(text, encoding='utf-8')
          report = {
              'schemaVersion': 1,
              'state': 'pass',
              'release': proof['release'],
              'priorities': {
                  '1_repository_convergence': 'complete',
                  '2_versioned_local_overrides': 'complete',
                  '3_plain_json_title_architecture': 'complete',
                  '9_public_directory_cleanup': 'complete',
              },
              'onlyMainBranch': True,
              'remoteBranchCount': 1,
              'workflowCount': 3,
              'productionProof': 'public/v26-production-proof.json',
          }
          Path('reports/v26-convergence.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/v26-production-proof.json reports/v26-production-proof.json reports/v26-convergence.json
          if git diff --cached --quiet; then
            echo 'A matching final proof already exists.'
            exit 0
          fi
          git commit -m 'Record completed V26 convergence and production proof'
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
