name: Prevent duplicate V7 quick rail on root

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/repair-v7-root-rail-duplication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0

      - name: Reuse the established root controls instead of adding a second rail
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('public/myfile/suite-v7.js')
          text=path.read_text(encoding='utf-8')
          old="""  function installQuickRailV7() {
              if (document.body?.dataset.suiteTool === 'runes' || document.querySelector('.suite-quick-rail-v7')) return;
              const tool = document.body?.dataset.suiteTool || 'call';"""
          new="""  function installQuickRailV7() {
              if (document.body?.dataset.suiteTool === 'runes' || document.querySelector('.suite-quick-rail-v7')) return;
              const tool = document.body?.dataset.suiteTool || 'call';
              if (tool === 'call' && ['pagetop', 'pagemdl', 'pagebtm'].every((id) => document.getElementById(id))) return;"""
          if old not in text:
              raise SystemExit('Quick-rail function anchor not found.')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check public/myfile/suite-v7.js

      - name: Commit the root rail compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/suite-v7.js
          git commit -m 'Reuse established root shortcuts without a duplicate V7 rail'
          git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
