                  manifest = json.loads(manifest_raw.decode('utf-8'))
                  if release not in story or '20260822-v26-final' not in story:
                      raise RuntimeError('story page is still an old deployment')
                  if 'story-title-runtime-v26-20260822' not in runtime:
                      raise RuntimeError('runtime is still an old deployment')
                  if 'DecompressionStream' in runtime or 'v25-title-delta' in runtime:
                      raise RuntimeError('runtime still contains V25 transport')
                  if manifest.get('release') != release or manifest.get('dataArchitecture') != 'plain-json':
