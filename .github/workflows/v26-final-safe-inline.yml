name: Complete V26 safely without breaking production

on:
  push:
    branches: [main]
    paths:
      - .v26-final-safe-inline-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v26-final-safe-inline-corrected
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current production is healthy before migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request

          base = 'https://magireco-call-search-cn.pages.dev'
          nonce = str(time.time_ns())

          def get(path):
              sep = '&' if '?' in path else '?'
              request = urllib.request.Request(
                  f'{base}/{path.lstrip("/")}{sep}preflight={nonce}',
                  headers={'Cache-Control': 'no-cache, no-store', 'User-Agent': 'V26-final-preflight'}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  status = response.status
              if status != 200:
                  raise RuntimeError(f'{path}: HTTP {status}')
              return raw

          story = get('story.html').decode('utf-8', 'replace')
          if 'v25-emergency-restored-20260822' not in story and 'v26-converged-20260822' not in story:
              raise RuntimeError('production story page is not a known healthy release')

          for path in (
              'data/character-catalog.json',
              'data/story-v6/manifest.json',
              'data/story-v6/variant-map.json',
              'data/story-v7/localization.json',
              'data/story-title-groups-v1.json',
          ):
              raw = get(path)
              if raw.lstrip().startswith((b'<!DOCTYPE', b'<html')):
                  raise RuntimeError(f'{path}: returned HTML')
              json.loads(raw.decode('utf-8'))

          print('Production preflight passed.')
          PY

      - name: Verify branch state
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          printf 'Remote branches: %s\n' "${branches[*]}"
          [ "${#branches[@]}" -eq 1 ]
          [ "${branches[0]}" = "main" ]

      - name: Build complete V26 candidate in the runner workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "a6ef018cac364f5a50ab29f35889476c2930a84ec60496b0fa1d53f6d49043c3  scripts/.v26-final-correct.py.gz.b64" | sha256sum -c -
          base64 -d scripts/.v26-final-correct.py.gz.b64 | gzip -d > scripts/v26-final-correct.py
          echo "322305fbcbaeaaf6ba0a839202abf4ac80ecbd19dae1baee3f4a17f090848f2f  scripts/v26-final-correct.py" | sha256sum -c -
          python scripts/v26-final-correct.py
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Install Chromium for regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exercise complete V26 locally, including fail-open isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory public >/tmp/v26-local-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8765/story.html', timeout=2).read(64)
          PY
            then
              break
            fi
            sleep 1
          done
          python scripts/site-smoke.py --base http://127.0.0.1:8765
          python scripts/site-smoke.py --base http://127.0.0.1:8765 --fail-open

      - name: Commit the fully validated V26 product atomically
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "main changed during candidate validation: $GITHUB_SHA -> $remote_sha" >&2
            exit 1
          fi
          git add -A
          git commit -m 'Complete V26 plain-JSON migration and repository convergence'
          product_sha=$(git rev-parse HEAD)
          echo "sha=$product_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$product_sha" >/tmp/v26-product-sha.txt
          git push origin HEAD:main

      - name: Wait for and verify deployed V26 data
        id: live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.error, urllib.request

          base = 'https://magireco-call-search-cn.pages.dev'

          def get(path, nonce):
              sep = '&' if '?' in path else '?'
              request = urllib.request.Request(
                  f'{base}/{path.lstrip("/")}{sep}verify={nonce}',
                  headers={'Cache-Control': 'no-cache, no-store', 'User-Agent': 'V26-final-live'}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  status = response.status
              if status != 200:
                  raise RuntimeError(f'{path}: HTTP {status}')
              if raw.lstrip().startswith((b'<!DOCTYPE', b'<html')):
                  raise RuntimeError(f'{path}: HTML instead of data')
              return raw

          def is_404(path, nonce):
              request = urllib.request.Request(
                  f'{base}/{path}?verify={nonce}',
                  headers={'Cache-Control': 'no-cache, no-store', 'User-Agent': 'V26-final-live'}
              )
              try:
                  urllib.request.urlopen(request, timeout=60).read(32)
              except urllib.error.HTTPError as error:
                  return error.code == 404
              return False

          last_error = None
          for attempt in range(150):
              nonce = str(time.time_ns())
              try:
                  manifest = json.loads(get('data/titles/manifest.json', nonce))
                  parents = json.loads(get('data/titles/parents.json', nonce))
                  titles = json.loads(get('data/titles/titles.json', nonce))
                  story_manifest = json.loads(get('data/story-v6/manifest.json', nonce))
                  catalog = json.loads(get('data/character-catalog.json', nonce))
                  marker = json.loads(get('v26-build-marker.json', nonce))
                  runtime = get('myfile/story-title-runtime-v2.js', nonce).decode('utf-8')
                  story = get('story.html', nonce).decode('utf-8')
                  editor = get('story-title-editor.html', nonce).decode('utf-8')

                  assert manifest['release'] == 'v26-converged-20260822'
                  assert manifest['dataArchitecture'] == 'plain-json'
                  assert sum(len(v) for v in parents['parentByCategory'].values()) == 2166
                  assert sum(len(v) for v in titles['titleByCategory'].values()) == 5826
                  assert story_manifest['totalRows'] == 14466
                  assert len(story_manifest['categories']) == 19
                  assert len(catalog) >= 180
                  assert marker['release'] == 'v26-converged-20260822'
                  assert 'story-title-runtime-v26-20260822' in runtime
                  assert 'DecompressionStream' not in runtime
                  assert 'v25-title-delta' not in runtime
                  assert '20260822-v26-final2' in story
                  assert '20260822-v26-final2' in editor
                  assert is_404('data/v25-title-delta.part-00.txt', nonce)
                  assert is_404('__acceptance.html', nonce)
                  assert is_404('json_open_old.html', nonce)
                  print('Production V26 data endpoints passed.')
                  break
              except Exception as error:
                  last_error = error
                  if attempt == 149:
                      raise
                  time.sleep(5)
          else:
              raise last_error or RuntimeError('deployment did not converge')
          PY

      - name: Exercise deployed V26 in Chromium
        shell: bash
        run: python scripts/site-smoke.py --base https://magireco-call-search-cn.pages.dev

      - name: Restore known-good V25 automatically if deployed V26 fails
        if: failure() && steps.product.outputs.sha != ''
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" = "$PRODUCT_SHA" ]; then
            git checkout -B main origin/main
            git revert --no-edit "$PRODUCT_SHA"
            git push origin HEAD:main
            echo 'Deployed candidate failed verification; V25 was restored.'
          else
            echo "Not reverting because main advanced independently: $remote_sha" >&2
          fi

      - name: Record final proof and tag the converged release
        if: success()
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --tags
          git checkout -B main origin/main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          proof = {
              'schemaVersion': 1,
              'state': 'pass',
              'release': 'v26-converged-20260822',
              'runtime': 'story-title-runtime-v26-20260822',
              'dataArchitecture': 'plain-json',
              'productSha': os.environ['PRODUCT_SHA'],
              'runId': os.environ['RUN_ID'],
              'verifiedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'production': 'https://magireco-call-search-cn.pages.dev',
              'remoteBranches': ['main'],
              'workflowCount': 3,
              'groupCount': 2166,
              'mappedTitleCount': 5826,
              'storyRowCount': 14466,
              'storyCategoryCount': 19,
              'checks': {
                  'repositoryValidation': True,
                  'localBrowserRegression': True,
                  'titleFailureDoesNotDisableStorySearch': True,
                  'productionDataEndpoints': True,
                  'productionBrowserRegression': True,
                  'oldPublicFilesReturn404': True,
              },
          }
          text = json.dumps(proof, ensure_ascii=False, indent=2) + '\n'
          Path('public/v26-production-proof.json').write_text(text, encoding='utf-8')
          Path('reports').mkdir(exist_ok=True)
          Path('reports/v26-final-production-proof.json').write_text(text, encoding='utf-8')
          marker_path = Path('public/v26-build-marker.json')
          marker = json.loads(marker_path.read_text(encoding='utf-8'))
          marker['status'] = 'deployed-and-verified'
          marker['productSha'] = os.environ['PRODUCT_SHA']
          marker['verificationRunId'] = os.environ['RUN_ID']
          marker_path.write_text(json.dumps(marker, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git add public/v26-production-proof.json public/v26-build-marker.json reports/v26-final-production-proof.json
          git commit -m 'Record passing V26 production verification'
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin refs/tags/v26-converged-20260822 >/dev/null 2>&1; then
            git tag -a v26-converged-20260822 -m 'V26 converged production release'
            git push origin refs/tags/v26-converged-20260822
          fi
