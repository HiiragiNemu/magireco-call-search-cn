name: V22 independent verifier and final retry

on:
  push:
    branches:
      - main
    paths:
      - .deploy-v22-independent-verifier-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v22-authoritative-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WIKI_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retry supervised release only when proof is absent
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          if [[ -f public/data/v22-final-acceptance.json ]]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('public/data/v22-final-acceptance.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if p.get('release') == 'v22-authoritative-localization-20260820' and p.get('state') == 'pass' else 1)
          PY
            then
              token="precheck-$(date +%s%N)"
              if curl -LfsS -H 'Cache-Control: no-cache, no-store' \
                "https://magireco-call-search-cn.pages.dev/?v22verify=$token" | \
                grep -Fq 'v22-authoritative-localization-20260820'; then
                accepted=true
              fi
            fi
          fi
          if [[ "$accepted" != true ]]; then
            bash .automation/run-v22-supervisor.sh
          fi

      - name: Independent repository and production assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          release = 'v22-authoritative-localization-20260820'
          proof_path = Path('public/data/v22-final-acceptance.json')
          report_path = Path('public/data/story-title-authority-report-v22.json')
          audit_path = Path('public/data/v22-site-audit.json')
          groups_path = Path('public/downloads/story-title-groups.json')
          css_path = Path('public/myfile/v22-menu-fixes.css')
          index_path = Path('public/index.html')
          for path in (proof_path, report_path, audit_path, groups_path, css_path, index_path):
              if not path.exists():
                  raise SystemExit(f'missing required release file: {path}')

          proof = json.loads(proof_path.read_text(encoding='utf-8-sig'))
          report = json.loads(report_path.read_text(encoding='utf-8-sig'))
          audit = json.loads(audit_path.read_text(encoding='utf-8-sig'))
          groups = json.loads(groups_path.read_text(encoding='utf-8-sig'))
          if proof.get('release') != release or proof.get('state') != 'pass':
              raise SystemExit('final acceptance proof is not pass')
          if report.get('release') != release:
              raise SystemExit('authority report release mismatch')
          if int(report.get('uniqueTranslations', 0)) < 1000:
              raise SystemExit('implausibly few localized title records')
          if int(report.get('displayStillContainsKanaCount', 999999)) > 500:
              raise SystemExit('too many displayed titles still contain kana')
          counts = report.get('counts', {})
          expected = {
              'official_table_pieceList': 900,
              'official_table_charaList': 150,
              'official_table_sectionList': 900,
              'target_json_files': 1,
          }
          for key, minimum in expected.items():
              if int(counts.get(key, 0)) < minimum:
                  raise SystemExit(f'{key} below minimum: {counts.get(key)} < {minimum}')
          if audit.get('state') == 'fail':
              raise SystemExit('site audit is fail')

          index = index_path.read_text(encoding='utf-8-sig')
          body = re.search(r'<body\b[^>]*>(.*)</body\s*>', index, re.I | re.S)
          if release not in index:
              raise SystemExit('release marker missing from index')
          if 'navtext-container' in index:
              raise SystemExit('navtext-container remains in index')
          if body and '魔法纪录·Magia Exedra 魔法少女称呼搜索' in body.group(1):
              raise SystemExit('removed title remains in body')
          css = css_path.read_text(encoding='utf-8')
          for contract in ('width: max-content !important', 'height: auto !important', 'overflow: auto !important'):
              if contract not in css:
                  raise SystemExit(f'menu CSS contract missing: {contract}')

          no_re = re.compile(r'^\s*No\.\s*(\d+)\b', re.I)
          defects = []
          def title(item):
              if not isinstance(item, dict): return ''
              for key in ('titleZh','titleCn','translation','translatedTitle','title','name'):
                  if isinstance(item.get(key), str): return item[key]
              return ''
          def walk(node, trail=()):
              if isinstance(node, list):
                  numbered = []
                  for i, item in enumerate(node):
                      m = no_re.match(title(item))
                      if m: numbered.append((i, int(m.group(1))))
                  if len(numbered) >= 3 and len(numbered) / max(len(node), 1) >= .6:
                      for a, b in zip(numbered, numbered[1:]):
                          if b[1] < a[1]:
                              defects.append({'path':'/'.join(trail), 'before':a[1], 'after':b[1]})
                              break
                  for i, child in enumerate(node): walk(child, trail + (str(i),))
              elif isinstance(node, dict):
                  for key, child in node.items(): walk(child, trail + (str(key),))
          walk(groups)
          if defects:
              raise SystemExit(f'No.n natural sort defects remain: {defects[:5]}')

          stale = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'safe-v18-production-fix' in text:
                  stale.append(str(path))
          if stale:
              raise SystemExit(f'workflows still depend on safe-v18-production-fix: {stale}')
          if Path('.github/workflows/deploy-v21-production.yml').exists():
              raise SystemExit('obsolete V21 deploy workflow still exists')
          PY

          token="independent-${GITHUB_RUN_ID}-$(date +%s%N)"
          base='https://magireco-call-search-cn.pages.dev'
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/?v22independent=$token" > /tmp/v22-index.html
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/v22-final-acceptance.json?v22independent=$token" > /tmp/v22-proof.json
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/story-title-authority-report-v22.json?v22independent=$token" > /tmp/v22-report.json
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/myfile/v22-menu-fixes.css?v22independent=$token" > /tmp/v22-menu.css
          grep -Fq 'v22-authoritative-localization-20260820' /tmp/v22-index.html
          grep -Fq 'v22-authoritative-localization-20260820' /tmp/v22-proof.json
          grep -Fq 'v22-authoritative-localization-20260820' /tmp/v22-report.json
          grep -Fq 'width: max-content !important' /tmp/v22-menu.css

      - name: Run independent browser core acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v22-independent-node /tmp/v22-independent-browser
          mkdir -p /tmp/v22-independent-node /tmp/v22-independent-browser
          cp .automation/v22-core-smoke.mjs /tmp/v22-independent-node/smoke.mjs
          printf '{"type":"module","private":true}\n' > /tmp/v22-independent-node/package.json
          npm install --prefix /tmp/v22-independent-node --no-package-lock --no-save puppeteer-core@24.16.0
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          BASE_URL=https://magireco-call-search-cn.pages.dev \
          CHROME_PATH="$chrome" \
          ARTIFACT_DIR=/tmp/v22-independent-browser \
          node /tmp/v22-independent-node/smoke.mjs

      - name: Commit independent verification record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          proof = json.loads(Path('public/data/v22-final-acceptance.json').read_text(encoding='utf-8'))
          report = json.loads(Path('public/data/story-title-authority-report-v22.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('/tmp/v22-independent-browser/core-acceptance.json').read_text(encoding='utf-8'))
          result = {
              'release': 'v22-authoritative-localization-20260820',
              'state': 'pass',
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'verifiedCommit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'production': 'https://magireco-call-search-cn.pages.dev',
              'productAcceptance': proof,
              'uniqueTranslations': report['uniqueTranslations'],
              'missingAuthoritativeCount': report['missingAuthoritativeCount'],
              'displayStillContainsKanaCount': report['displayStillContainsKanaCount'],
              'authorityCounts': report['counts'],
              'browserCoreAcceptance': browser,
              'branchDeletionPerformed': False,
          }
          Path('public/data/v22-independent-verification.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/v22-independent-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record independent V22 verification'
            git push origin HEAD:main
          fi

      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-independent-verification-${{ github.run_id }}
          path: |
            /tmp/v22-independent-browser
            /tmp/v22-supervisor
            /tmp/v22-supervisor-local
            /tmp/v22-supervisor-production
            public/data/v22-final-acceptance.json
            public/data/v22-independent-verification.json
            public/data/story-title-authority-report-v22.json
            public/data/v22-site-audit.json
            public/downloads/story-title-missing-authoritative-v22.tsv
            docs/V22_SITE_AUDIT.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
