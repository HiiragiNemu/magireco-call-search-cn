name: Verify production deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/validate-production.py"
      - "scripts/browser-smoke.py"
      - ".github/workflows/production-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-production.py
      - name: Wait for Cloudflare Pages and validate production data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://magireco-call-search-cn.pages.dev"
          for attempt in range(120):
              nonce = str(time.time_ns())

              def get(path):
                  req = urllib.request.Request(
                      f"{base}/{path}?verify={nonce}",
                      headers={
                          "Cache-Control": "no-cache, no-store",
                          "User-Agent": "V26-production-verify",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                  if raw.lstrip().startswith((b"<!DOCTYPE", b"<html", b"<")):
                      raise RuntimeError(f"{path}: HTML instead of data")
                  return raw

              def get_text(path):
                  req = urllib.request.Request(
                      f"{base}/{path}?verify={nonce}",
                      headers={
                          "Cache-Control": "no-cache, no-store",
                          "User-Agent": "V26-production-verify",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read().decode("utf-8")

              try:
                  manifest = json.loads(get("data/titles/manifest.json"))
                  assert manifest["release"] == "canonical-title-authority-v1"
                  assert manifest["dataArchitecture"] == "plain-json"
                  assert json.loads(get("data/story-v6/manifest.json"))["totalRows"] == 14466
                  assert len(json.loads(get("data/character-catalog.json"))) >= 180
                  titles = json.loads(get("data/titles/titles.json"))
                  assert sum(len(v) for v in titles["titleByCategory"].values()) == 5826
                  reader_links = json.loads(get("data/titles/reader-links.json"))
                  assert reader_links["reader"]["head"] == "cd78e9b7d4fa6dcb029c3c7edc788298de03da94"
                  assert reader_links["summary"]["entries"] == 1196
                  story_router = json.loads(get("data/story-router-v1.json"))
                  assert story_router["targets"]["reader"]["readerRevision"] == "cd78e9b7d4fa6dcb029c3c7edc788298de03da94"
                  assert story_router["targets"]["adv"]["handoffReady"] is True
                  assert story_router["targets"]["adv"]["readerRevision"] == "bad94aa371dc9e6aed16ccf6d144106b31643f28"
                  assert len(story_router["routes"]) == 12443
                  edition_routes = [route for route in story_router["routes"] if "variants" in route]
                  assert len(edition_routes) == 1187
                  assert sum(len(route["variants"]) for route in edition_routes) == 2374
                  assert all({variant["edition"] for variant in route["variants"]} == {"initial", "rerun"} for route in edition_routes)
                  assert all(variant["adv"] is not None for route in edition_routes for variant in route["variants"])
                  aio_router = json.loads(get("aio/story-routes.json"))
                  assert aio_router["catalogRevision"] == story_router["catalogRevision"]
                  assert aio_router["targets"]["reader"]["readerRevision"] == "cd78e9b7d4fa6dcb029c3c7edc788298de03da94"
                  assert aio_router["targets"]["adv"]["handoffReady"] is True
                  assert aio_router["targets"]["adv"]["readerRevision"] == "bad94aa371dc9e6aed16ccf6d144106b31643f28"
                  assert aio_router == story_router
                  assert len(aio_router["routes"]) == 12443
                  aio_report = json.loads(get("aio/story-routes.report.json"))
                  assert aio_report["exactSectionMappedRows"] + aio_report["storyParentMappedRows"] == 12443
                  assert all(
                      item["exactSectionMapped"] + item["storyParentMapped"] == item["mapped"]
                      for item in aio_report["categories"]
                  )
                  get("myfile/story-route-bridge-v1.js")
                  story_html = get_text("story.html")
                  assert '<meta name="magireco-aio-router" content="https://callsearch.magireco.top/aio/">' in story_html
                  print("Production V26 endpoints passed.")
                  break
              except Exception:
                  if attempt == 119:
                      raise
                  time.sleep(5)
          PY
      - name: Wait for EdgeOne Call and AIO routes
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://callsearch.magireco.top"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          for attempt in range(120):
              nonce = str(time.time_ns())
              try:
                  with urllib.request.urlopen(
                      f"{base}/aio/story-routes.json?verify={nonce}", timeout=60
                  ) as response:
                      manifest = json.load(response)
                  assert len(manifest["routes"]) == 12443
                  assert manifest["targets"]["reader"]["readerRevision"] == "cd78e9b7d4fa6dcb029c3c7edc788298de03da94"
                  source = urllib.parse.quote(manifest["routes"][0]["sourceKey"], safe="")
                  try:
                      opener.open(f"{base}/aio/open?source={source}&target=reader", timeout=60)
                      raise AssertionError("Reader route did not redirect")
                  except urllib.error.HTTPError as response:
                      assert response.code == 302
                      assert response.headers["Location"].startswith("https://magireader.pages.dev/")
                  try:
                      opener.open(f"{base}/aio/open?source={source}&target=adv", timeout=60)
                      raise AssertionError("ADV route did not redirect")
                  except urllib.error.HTTPError as response:
                      assert response.code == 302
                      assert response.headers["Location"].startswith("https://magiaexedralive2dviewer.pages.dev/")
                      assert "advRenderer=pixi-v2&bridge=1" in response.headers["Location"]
                      assert "readerRevision=bad94aa371dc9e6aed16ccf6d144106b31643f28" in response.headers["Location"]
                  edition_route = next(route for route in manifest["routes"] if "variants" in route)
                  edition_source = urllib.parse.quote(edition_route["sourceKey"], safe="")
                  locations = []
                  for edition in ("initial", "rerun"):
                      try:
                          opener.open(f"{base}/aio/open?source={edition_source}&target=reader&edition={edition}", timeout=60)
                          raise AssertionError(f"{edition} Reader route did not redirect")
                      except urllib.error.HTTPError as response:
                          assert response.code == 302
                          locations.append(response.headers["Location"])
                  assert locations[0] != locations[1]
                  print("EdgeOne Call/AIO endpoints passed.")
                  break
              except Exception:
                  if attempt == 119:
                      raise
                  time.sleep(5)
          PY
      - name: Exercise production in Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python scripts/browser-smoke.py \
            --base https://magireco-call-search-cn.pages.dev \
            --output /tmp/v26-production-browser-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-production-verification
          path: /tmp/v26-production-browser-proof.json
          if-no-files-found: ignore
          retention-days: 30
