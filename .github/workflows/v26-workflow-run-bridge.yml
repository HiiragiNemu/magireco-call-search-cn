name: Atomic V26 closure bridge

"on":
  workflow_run:
    workflows: ["Complete V26 safely without breaking production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: magireco-call-search-v26-atomic-closure
  cancel-in-progress: true

jobs:
  close:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.id == 32527429313
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cancel competing runs, synchronize main, and publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          current = int(os.environ["GITHUB_RUN_ID"])
          data = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/runs?per_page=100"], text=True
          ))
          for run in data.get("workflow_runs", []):
              run_id = int(run.get("id", 0))
              if run_id == current:
                  continue
              if run.get("status") not in {"queued", "in_progress", "waiting", "requested"}:
                  continue
              subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repo}/actions/runs/{run_id}/cancel"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
          PY
          git fetch origin main
          git reset --hard origin/main
          test -f scripts/v26-finalize-once.py
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('.v26-active-run.json').write_text(json.dumps({
              'schemaVersion': 1,
              'status': 'running',
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'eventSha': os.environ.get('GITHUB_SHA'),
              'startedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v26-active-run.json
          git commit -m "Record active atomic V26 closure run"
          git push origin HEAD:main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Correct the one-shot finalizer deterministically
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/v26-finalize-once.py")
          text = path.read_text(encoding="utf-8")
          old_parent = '''        parent = str(
              parent_by_category.get(category, {}).get(source_base)
              or group.get("approved_translation")
              or group.get("current_translation")
              or source_base
          ).strip()
          if not parent:
              fail(f"empty mother title: {category}/{source_base}")

          group["current_translation"] = parent
          group["approved_translation"] = parent

          category_map = title_by_category.setdefault(category, {})
          for child in group.get("children") or []:
              total_children += 1
              source_title = str(child.get("source_title") or "").strip()
              source_suffix = str(child.get("source_suffix") or "")
              if not source_title:
                  fail(f"empty source title in group {group.get('group_id')}")

              exact = exact_exceptions.get(category, {}).get(source_title)
              if isinstance(exact, str) and exact.strip():
                  target = exact.strip()
              else:
                  if source_suffix in suffix_by_source:
                      suffix = str(suffix_by_source[source_suffix] or "").strip()
                  else:
                      suffix = str(
                          child.get("localized_suffix")
                          if child.get("localized_suffix") is not None
                          else source_suffix
                      ).strip()
                  target = f"{parent}{' ' + suffix if suffix else ''}".strip()

              if not target:
                  fail(f"empty Chinese display title: {category}/{source_title}")
              child["localized_suffix"] = (
                  str(suffix_by_source.get(source_suffix, child.get("localized_suffix", source_suffix)) or "").strip()
              )
'''
          new_parent = '''        parent_override = parent_by_category.get(category, {}).get(source_base)
          if isinstance(parent_override, str) and parent_override.strip():
              group["current_translation"] = parent_override.strip()
              group["approved_translation"] = parent_override.strip()

          parent = str(group.get("current_translation") or source_base).strip()
          if not parent:
              fail(f"empty mother title: {category}/{source_base}")

          group["current_translation"] = parent
          group["approved_translation"] = parent

          category_map = title_by_category.setdefault(category, {})
          for child in group.get("children") or []:
              total_children += 1
              source_title = str(child.get("source_title") or "").strip()
              source_suffix = str(child.get("source_suffix") or "")
              if not source_title:
                  fail(f"empty source title in group {group.get('group_id')}")

              if source_suffix in suffix_by_source:
                  suffix = str(suffix_by_source[source_suffix] or "").strip()
              else:
                  suffix = str(
                      child.get("localized_suffix")
                      if child.get("localized_suffix") is not None
                      else source_suffix
                  ).strip()

              exact = exact_exceptions.get(category, {}).get(source_title)
              target = (
                  exact.strip()
                  if isinstance(exact, str) and exact.strip()
                  else f"{parent}{' ' + suffix if suffix else ''}".strip()
              )

              if not target:
                  fail(f"empty Chinese display title: {category}/{source_title}")
              child["localized_suffix"] = suffix
'''
          if old_parent in text:
              text = text.replace(old_parent, new_parent, 1)
          elif new_parent not in text:
              raise SystemExit("reconstruction block is neither original nor corrected")
          old_sample = '("scene0", "サイドストーリー Film.0"): "支线故事 Film.0",'
          new_sample = '("scene0", "サイドストーリー Film.0 1 (紫)"): "支线故事 Film.0 1 （紫色）",'
          if old_sample in text:
              text = text.replace(old_sample, new_sample)
          elif new_sample not in text:
              raise SystemExit("scene0 verification sample was not found")
          old_fail_open = '''        else:
              if runtime_info["mappedTitles"] < 1:
                  raise AssertionError("base localization did not load during fail-open test")
'''
          new_fail_open = '''        else:
              if runtime_info["runtimeError"] is None:
                  raise AssertionError("fail-open test did not exercise the missing title-data path")
'''
          if old_fail_open in text:
              text = text.replace(old_fail_open, new_fail_open, 1)
          elif new_fail_open not in text:
              raise SystemExit("fail-open assertion was not found")
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/v26-finalize-once.py

      - name: Preserve hashes of unrelated working product files
        run: |
          set -euo pipefail
          files=(
            public/attendance.html
            public/runes.html
            public/myfile/story-app-v7.js
            public/myfile/tools-suite.js
            public/myfile/suite-v7.js
          )
          for file in "${files[@]}"; do test -f "$file"; done
          sha256sum "${files[@]}" > /tmp/v26-preserved-core.sha256

      - name: Verify current production before any product change
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base = "https://magireco-call-search-cn.pages.dev"
          nonce = str(time.time_ns())
          def get(path):
              req = urllib.request.Request(
                  f"{base}/{path}?preflight={nonce}",
                  headers={"Cache-Control":"no-cache, no-store","User-Agent":"V26-atomic-preflight"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()
          story = get("story.html").decode("utf-8", "replace")
          if "v25-emergency-restored-20260822" not in story and "v26-converged-20260822" not in story:
              raise RuntimeError("production story page is not a recognized healthy release")
          for path in (
              "data/character-catalog.json",
              "data/story-v6/manifest.json",
              "data/story-v6/variant-map.json",
              "data/story-v7/localization.json",
              "data/story-title-groups-v1.json",
          ):
              raw = get(path)
              if raw.lstrip().startswith((b"<!DOCTYPE", b"<html", b"<")):
                  raise RuntimeError(f"{path}: returned HTML")
              json.loads(raw.decode("utf-8"))
          manifest = json.loads(get("data/story-v6/manifest.json"))
          assert manifest["totalRows"] == 14466
          assert len(manifest["categories"]) == 19
          assert len(json.loads(get("data/character-catalog.json"))) >= 180
          print("Healthy production baseline confirmed.")
          PY

      - name: Build and validate the complete V26 tree locally
        run: |
          set -euo pipefail
          python scripts/v26-finalize-once.py
          sha256sum -c /tmp/v26-preserved-core.sha256
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Install Chromium
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exercise V26 and preserved tools locally
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public >/tmp/v26-local-http.log 2>&1 &
          echo $! >/tmp/v26-http.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/story.html >/dev/null && break
            sleep 1
          done
          python scripts/browser-smoke.py --base http://127.0.0.1:4173 --output /tmp/v26-local-browser-proof.json

      - name: Prove title enhancement failure cannot disable story search
        run: |
          set -euo pipefail
          mv public/data/titles /tmp/v26-title-data-hidden
          restore_titles() {
            if [ -d /tmp/v26-title-data-hidden ]; then mv /tmp/v26-title-data-hidden public/data/titles; fi
          }
          trap restore_titles EXIT
          python scripts/browser-smoke.py --base http://127.0.0.1:4173 --allow-title-runtime-error --output /tmp/v26-fail-open-browser-proof.json
          restore_titles
          trap - EXIT
          python scripts/validate-production.py

      - name: Publish one atomic validated product commit
        id: publish
        run: |
          set -euo pipefail
          kill "$(cat /tmp/v26-http.pid)" 2>/dev/null || true
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Complete V26 architecture without regressing existing tools"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Wait for Cloudflare Pages and verify deployed V26
        id: live_data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          base = "https://magireco-call-search-cn.pages.dev"
          last = None
          for attempt in range(180):
              nonce = str(time.time_ns())
              def get(path):
                  sep = "&" if "?" in path else "?"
                  req = urllib.request.Request(
                      f"{base}/{path}{sep}verify={nonce}",
                      headers={"Cache-Control":"no-cache, no-store","User-Agent":"V26-atomic-live-verify"},
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read()
              try:
                  marker = json.loads(get("v26-build-marker.json"))
                  manifest = json.loads(get("data/titles/manifest.json"))
                  titles = json.loads(get("data/titles/titles.json"))
                  story_manifest = json.loads(get("data/story-v6/manifest.json"))
                  catalog = json.loads(get("data/character-catalog.json"))
                  story = get("story.html").decode("utf-8", "replace")
                  editor = get("story-title-editor.html").decode("utf-8", "replace")
                  runtime = get("myfile/story-title-runtime-v2.js").decode("utf-8", "replace")
                  index = get("index.html").decode("utf-8", "replace")
                  css = get("myfile/hamburgerMenu.css").decode("utf-8", "replace")
                  assert marker["release"] == "v26-converged-20260822"
                  assert manifest["release"] == "v26-converged-20260822"
                  assert manifest["dataArchitecture"] == "plain-json"
                  assert sum(len(v) for v in titles["titleByCategory"].values()) == 5826
                  assert story_manifest["totalRows"] == 14466
                  assert len(story_manifest["categories"]) == 19
                  assert len(catalog) >= 180
                  assert "v26-converged-20260822" in story
                  assert "v26-converged-20260822" in editor
                  assert "20260822-v26-final3" in story
                  assert "20260822-v26-final3" in editor
                  assert "story-title-runtime-v26-20260822" in runtime
                  assert "DecompressionStream" not in runtime
                  assert "v25-title-delta" not in runtime
                  assert 'class="navtext-container"' not in index
                  assert "hamburger-menu-v23.js?v=20260822-v26-final3" in index
                  assert "width: max-content;" in css
                  assert "min-width:" not in css
                  for old in ("data/v25-title-delta.part-00.txt", "__acceptance.html", "json_open_old.html", "oldfile/index.html"):
                      try:
                          get(old)
                          raise AssertionError(f"obsolete public file still exists: {old}")
                      except urllib.error.HTTPError as exc:
                          assert exc.code == 404, (old, exc.code)
                  print("Deployed V26 data verification passed.")
                  break
              except Exception as exc:
                  last = repr(exc)
                  if attempt == 179: raise RuntimeError(last)
                  time.sleep(5)
          PY

      - name: Exercise deployed V26 and all preserved tools in Chromium
        id: live_browser
        run: |
          set -euo pipefail
          python scripts/browser-smoke.py --base https://magireco-call-search-cn.pages.dev --output /tmp/v26-production-browser-proof.json

      - name: Preserve successful release tag
        if: success()
        run: |
          set -euo pipefail
          product_sha="${{ steps.publish.outputs.product_sha }}"
          git fetch origin main --tags
          git tag -f v26-converged-20260822 "$product_sha"
          git push origin refs/tags/v26-converged-20260822 --force

      - name: Roll back atomically if deployed verification fails
        if: failure() && steps.publish.outputs.product_sha != '' && (steps.live_data.outcome == 'failure' || steps.live_browser.outcome == 'failure')
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert --no-edit "${{ steps.publish.outputs.product_sha }}"
          git push origin HEAD:main

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-atomic-closure-evidence
          path: |
            /tmp/v26-local-browser-proof.json
            /tmp/v26-fail-open-browser-proof.json
            /tmp/v26-production-browser-proof.json
            /tmp/v26-local-http.log
            /tmp/v26-preserved-core.sha256
          if-no-files-found: ignore
          retention-days: 30
