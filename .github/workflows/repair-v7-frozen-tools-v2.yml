name: Repair V7 frozen tools V2

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/repair-v7-frozen-tools-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0
      - name: Patch immutable V7 tool namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('public/myfile/suite-v7.js')
          text=path.read_text(encoding='utf-8')
          old='''  Object.assign(Tools, {
              loadLocalizationV7: loadLocalization,
              resolveCharacterV7,
              createCastChipV7,
              installAttributeFilterV7,
              installQuickRailV7,
              scrollToTargetV7: scrollToTarget,
              attributesForV7: attributesFor,
              attributeLabelV7: attributeLabel
            });'''
          new='''  global.MagiToolsV7 = Object.freeze({
              ...Tools,
              loadLocalizationV7: loadLocalization,
              resolveCharacterV7,
              createCastChipV7,
              installAttributeFilterV7,
              installQuickRailV7,
              scrollToTargetV7: scrollToTarget,
              attributesForV7: attributesFor,
              attributeLabelV7: attributeLabel
            });'''
          if old not in text: raise SystemExit('Frozen extension block not found.')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          replacements={
            'public/myfile/story-app-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools?.loadLocalizationV7) return;",
              "const Tools = global.MagiToolsV7;\n  if (!Tools?.loadLocalizationV7) return;"),
            'public/myfile/attendance-app-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools?.resolveCharacterV7) return;",
              "const Tools = global.MagiToolsV7;\n  if (!Tools?.resolveCharacterV7) return;"),
            'public/myfile/runes-template-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools) return;",
              "const Tools = global.MagiToolsV7 || global.MagiTools;\n  if (!Tools) return;"),
            'scripts/smoke-story-ui-v7.mjs': (
              'window.MagiTools?.resolveCharacterV7',
              'window.MagiToolsV7?.resolveCharacterV7')
          }
          for filename,(old,new) in replacements.items():
            path=Path(filename); text=path.read_text(encoding='utf-8')
            if old not in text: raise SystemExit(f'Pattern missing: {filename}')
            path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          node --check public/myfile/suite-v7.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/attendance-app-v7.js
          node --check public/myfile/runes-template-v7.js
          node --check scripts/smoke-story-ui-v7.mjs
      - name: Commit source-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/suite-v7.js public/myfile/story-app-v7.js public/myfile/attendance-app-v7.js public/myfile/runes-template-v7.js scripts/smoke-story-ui-v7.mjs
          git commit -m 'Use a separate immutable MagiToolsV7 namespace'
          git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
