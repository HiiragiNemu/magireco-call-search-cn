name: Seed rune mask V9 source

on:
  push:
    branches:
      - fix/rune-mask-v9-20260816
    paths:
      - .github/workflows/seed-rune-mask-v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rune-mask-v9-20260816
          fetch-depth: 0

      - name: Materialize the V9 mask UI and bridge both OCR engines
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > public/myfile/runes-mask-v9.js
          echo '' | base64 -d | gzip -d > public/myfile/runes-mask-v9.css

          python3 <<'PY'
          from pathlib import Path

          path = Path('public/myfile/runes-template-v7.js')
          text = path.read_text(encoding='utf-8')
          old = "      const file = fileInput.files?.[0];"
          new = "      const file = global.__RUNE_INPUT_OVERRIDE_V9__ || fileInput.files?.[0];"
          if old not in text:
              raise SystemExit('V7 file-input anchor missing.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('public/myfile/runes-app.js')
          text = path.read_text(encoding='utf-8')
          old = "  async function recognize() {\n    if (!file) return;"
          new = "  async function recognize() {\n    const recognitionFile = global.__RUNE_INPUT_OVERRIDE_V9__ || file;\n    if (!recognitionFile) return;"
          if old not in text:
              raise SystemExit('V6 recognize anchor missing.')
          text = text.replace(old, new, 1)
          old = "      const result = await runEnsemble(\n        file,"
          new = "      const result = await runEnsemble(\n        recognitionFile,"
          if old not in text:
              raise SystemExit('V6 runEnsemble anchor missing.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check public/myfile/runes-mask-v9.js
          node --check public/myfile/runes-template-v7.js
          node --check public/myfile/runes-app.js

      - name: Commit V9 source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/myfile/runes-mask-v9.js \
            public/myfile/runes-mask-v9.css \
            public/myfile/runes-template-v7.js \
            public/myfile/runes-app.js
          git commit -m 'Add paint-to-keep rune mask and OCR override bridge V9'
          git push origin HEAD:fix/rune-mask-v9-20260816
