name: Repair V5 rune sample

on:
  push:
    branches:
      - fix/integrated-tools-v5-20260816
    paths:
      - .github/workflows/repair-rune-sample-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integrated-tools-v5-20260816
          fetch-depth: 0

      - name: Replace the single-rune crop with the complete A-G reference row
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/smoke-integrated-tools-v5.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    crop.width = 512;': '    crop.width = source.naturalWidth * 3;',
              '    crop.height = 400;': '    crop.height = 165;',
              '    context.drawImage(source, 7, 6, 64, 50, 0, 0, crop.width, crop.height);': '    context.drawImage(source, 0, 0, source.naturalWidth, 55, 0, 0, crop.width, crop.height);',
              "    const file = new File([blob], 'known-rune-A.png', { type: 'image/png' });": "    const file = new File([blob], 'known-runes-A-G.png', { type: 'image/png' });",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'OCR sample pattern not found: {old}')
              text = text.replace(old, new, 1)
          anchor = "    const input = document.getElementById('runesFile');\n"
          insertion = "    document.getElementById('runesPreprocess').value = 'contrast';\n"
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit('OCR input anchor not found.')
              text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/smoke-integrated-tools-v5.mjs

      - name: Commit the known-row OCR acceptance sample
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-integrated-tools-v5.mjs
          git commit -m 'Validate witch-rune OCR with the complete A-G row'
          git push origin HEAD:fix/integrated-tools-v5-20260816
