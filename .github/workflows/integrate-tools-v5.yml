name: Integrate tools V5

on:
  push:
    branches:
      - fix/integrated-tools-v5-20260816
    paths:
      - public/story.html
      - public/attendance.html
      - public/runes.html
      - public/myfile/tools-suite.css
      - public/myfile/tools-suite.js
      - public/myfile/triple-tap-filter.js
      - public/myfile/story-app.js
      - public/myfile/attendance-app.js
      - public/myfile/runes-app.js
      - scripts/integrate-tools-v5.py
      - scripts/audit-translations-v5.py
      - scripts/smoke-integrated-tools-v5.mjs
      - scripts/validate-site.js
      - .github/workflows/site-validation.yml
      - .github/workflows/verify-production.yml
      - .github/workflows/integrate-tools-v5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-tools-v5
  cancel-in-progress: false

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out V5 integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/integrated-tools-v5-20260816
          fetch-depth: 0

      - name: Download and pin witch-rune OCR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/mdkOCR
          curl --fail --show-error --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            'https://magireco-chara-search.vercel.app/mdkOCR/mdk.traineddata' \
            -o public/mdkOCR/mdk.traineddata
          curl --fail --show-error --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            'https://magireco-chara-search.vercel.app/mdkOCR/mdm.traineddata' \
            -o public/mdkOCR/mdm.traineddata
          curl --fail --show-error --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 \
            'https://magireco-chara-search.vercel.app/mdkOCR/madokarunes.jpg' \
            -o public/mdkOCR/madokarunes.jpg
          test "$(stat -c%s public/mdkOCR/mdk.traineddata)" -gt 100000
          test "$(stat -c%s public/mdkOCR/mdm.traineddata)" -gt 100000
          test "$(stat -c%s public/mdkOCR/madokarunes.jpg)" -gt 10000

      - name: Integrate V5 production files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-tools-v5.py
          python3 scripts/audit-translations-v5.py | tee /tmp/translation-audit-v5-summary.json

      - name: Validate static files and syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          for file in \
            public/myfile/tools-suite.js \
            public/myfile/triple-tap-filter.js \
            public/myfile/story-app.js \
            public/myfile/attendance-app.js \
            public/myfile/runes-app.js \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-integrated-tools-v5.mjs; do
            node --check "$file"
          done
          python3 -m py_compile scripts/integrate-tools-v5.py scripts/audit-translations-v5.py

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run local regression and integrated-tool acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8000 --directory public >/tmp/integrated-v5-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            sleep .25
          done
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" \
            node scripts/smoke-neo11-v3.mjs | tee /tmp/neo11-v3-regression.txt
          grep -Fq '"state": "pass"' /tmp/neo11-v3-regression.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" \
            node scripts/smoke-height-guide-v4.mjs | tee /tmp/height-guide-v4-regression.txt
          grep -Fq '"state": "pass"' /tmp/height-guide-v4-regression.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" \
            node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/integrated-v5-local-report.txt
          grep -Fq '"state": "pass"' /tmp/integrated-v5-local-report.txt

      - name: Commit only the fully tested V5 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/index.html \
            public/cnt.html \
            public/index_png.html \
            public/story.html \
            public/attendance.html \
            public/runes.html \
            public/build-info.json \
            public/__acceptance.html \
            public/mdkOCR \
            public/data/character-catalog.json \
            public/data/translation-audit-v5.json \
            public/myfile/mgirlCallNarrow.js \
            docs/translation-audit-v5.md \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs
          if git diff --cached --quiet; then
            echo 'Integrated tools V5 already generated and tested.'
          else
            git commit -m 'Integrate and validate Chinese Magia Record tool suite V5'
            git push origin HEAD:fix/integrated-tools-v5-20260816
          fi

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-tools-v5-prepublication-${{ github.sha }}
          path: |
            /tmp/translation-audit-v5-summary.json
            /tmp/neo11-v3-regression.txt
            /tmp/height-guide-v4-regression.txt
            /tmp/integrated-v5-local-report.txt
            /tmp/integrated-v5-root-mobile.png
            /tmp/integrated-v5-story-mobile.png
            /tmp/integrated-v5-attendance-mobile.png
            /tmp/integrated-v5-runes-desktop.png
            /tmp/integrated-v5-http.log
            docs/translation-audit-v5.md
            public/data/translation-audit-v5.json
          if-no-files-found: warn
          retention-days: 30
