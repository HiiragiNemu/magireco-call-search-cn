name: Integrate story UI translation OCR V7

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/integrate-story-ui-v7.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-story-ui-v7
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out V7 branch
        uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0

      - name: Apply final V7 source requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          # Keep every category from the original Japanese page in its original
          # order, then append categories that were added later.
          path = Path('scripts/build-story-localization-v7.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'CATEGORY_ORDER = \[.*?\n\]', re.S)
          replacement = '''CATEGORY_ORDER = [
              "メイン【第1部】", "メイン【第2部】", "アナザー【第1部】", "アナザー【第2部】",
              "魔法少女", "衣装", "ミラーズ", "イベント", "バトルミュージアム",
              "スペシャル", "第1部EDムービー", "第2部EDムービー", "アニメ【1st】",
              "アニメ【2nd】", "アニメ【Final】", "ピュエラ・ヒストリア", "scene0",
              "メモリア", "シール図鑑",
          ]'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('CATEGORY_ORDER block not found.')
          path.write_text(text, encoding='utf-8')

          # Load the shared V7 quick rail on the established call/height page too.
          path = Path('scripts/integrate-story-ui-v7.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # The original call/height page already has its proven pink top/search/bottom
              # controls. Do not add the suite rail a second time.
              path.write_text(text, encoding="utf-8")'''
          new = '''    text = insert_after(text, '<script src="./myfile/layout-v6.js"></script>', '<script src="./myfile/suite-v7.js"></script>', "root V7 JS")
              path.write_text(text, encoding="utf-8")'''
          if old not in text:
              raise SystemExit('Root V7 integration block not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Replace the quick-rail function with one shared implementation.  The
          # legacy root buttons remain in the DOM for rollback compatibility but
          # are hidden once the complete rail is active.
          path = Path('public/myfile/suite-v7.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('  function installQuickRailV7() {')
          end = text.index('  function measureNav()', start)
          function = r'''  function installQuickRailV7() {
              if (document.body?.dataset.suiteTool === 'runes' || document.querySelector('.suite-quick-rail-v7')) return;
              const tool = document.body?.dataset.suiteTool || 'call';
              if (tool === 'call') {
                for (const id of ['pagetop', 'pagemdl', 'pagebtm']) {
                  const legacy = document.getElementById(id);
                  if (legacy) {
                    legacy.hidden = true;
                    legacy.setAttribute('aria-hidden', 'true');
                  }
                }
              }
              const attributeTarget = () => [...document.querySelectorAll('fieldset, form')]
                .find((element) => /按属性选择魔法少女/u.test(element.textContent || ''));
              const definitions = tool === 'story'
                ? [
                    ['↑','顶部',() => global.scrollTo({top:0,behavior:'smooth'})],
                    ['筛','搜索条件',() => scrollToTarget('#story-options-title')],
                    ['人','角色列表',() => scrollToTarget('#story-character-title')],
                    ['搜','执行搜索',() => document.getElementById('storySearchButton')?.click()],
                    ['表','搜索结果',() => scrollToTarget('#storyResults')],
                    ['↓','页面底部',() => global.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})]
                  ]
                : tool === 'attendance'
                  ? [
                      ['↑','顶部',() => global.scrollTo({top:0,behavior:'smooth'})],
                      ['筛','筛选角色',() => scrollToTarget('#attendance-character-title')],
                      ['人','角色列表',() => scrollToTarget('#attendanceGrid')],
                      ['表','排行结果',() => scrollToTarget('#attendanceResults')],
                      ['↓','页面底部',() => global.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})]
                    ]
                  : [
                      ['↑','顶部',() => global.scrollTo({top:0,behavior:'smooth'})],
                      ['人','角色列表',() => scrollToTarget('#girltop')],
                      ['筛','属性筛选',() => scrollToTarget(attributeTarget())],
                      ['搜','称呼搜索',() => typeof global.drawAndJump === 'function' && global.drawAndJump()],
                      ['高','全局身高图',() => typeof global.displayHeightChart === 'function' && global.displayHeightChart('global')],
                      ['表','称呼结果',() => scrollToTarget('#callResultSection')],
                      ['↓','页面底部',() => global.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})]
                    ];
              const rail = document.createElement('aside');
              rail.className = 'suite-quick-rail-v7';
              rail.setAttribute('aria-label', '页面快捷操作');
              for (const [glyph, label, action] of definitions) {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = glyph;
                button.title = label;
                button.setAttribute('aria-label', label);
                button.addEventListener('click', action);
                rail.appendChild(button);
              }
              document.body.appendChild(rail);
            }

          '''
          path.write_text(text[:start] + function + text[end:], encoding='utf-8')

          # The V7 browser acceptance must require the new root rail and hidden
          # legacy controls rather than the pre-V7 state.
          path = Path('scripts/smoke-story-ui-v7.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  const rootAudit = await root.page.evaluate(() => ({
              release: document.body.dataset.build,
              existingControls: ['pagetop','pagemdl','pagebtm'].filter((id) => document.getElementById(id)).length,
              duplicateRail: document.querySelectorAll('.suite-quick-rail-v7').length,
              documentWidth: document.documentElement.scrollWidth,
              viewportWidth: innerWidth
            }));
            assert(rootAudit.release === EXPECTED_RELEASE && rootAudit.existingControls === 3 && rootAudit.duplicateRail === 0,
              'root page keeps its established pink controls without a duplicate rail', rootAudit);'''
          new = '''  const rootAudit = await root.page.evaluate(() => ({
              release: document.body.dataset.build,
              existingControls: ['pagetop','pagemdl','pagebtm'].filter((id) => document.getElementById(id)).length,
              hiddenLegacyControls: ['pagetop','pagemdl','pagebtm'].filter((id) => document.getElementById(id)?.hidden).length,
              railCount: document.querySelectorAll('.suite-quick-rail-v7').length,
              railButtons: document.querySelectorAll('.suite-quick-rail-v7 button').length,
              documentWidth: document.documentElement.scrollWidth,
              viewportWidth: innerWidth
            }));
            assert(rootAudit.release === EXPECTED_RELEASE && rootAudit.existingControls === 3
              && rootAudit.hiddenLegacyControls === 3 && rootAudit.railCount === 1 && rootAudit.railButtons === 7,
              'root page uses the complete shared shortcut rail while retaining rollback-compatible legacy nodes', rootAudit);'''
          if old not in text:
              raise SystemExit('Root V7 smoke assertion block not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/build-story-localization-v7.py scripts/integrate-story-ui-v7.py
          node --check public/myfile/suite-v7.js
          node --check scripts/smoke-story-ui-v7.mjs

      - name: Download MagiReader metadata read-only and build localization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/magi-reader-v7/website/public /tmp/magi-reader-v7/website/app/config
          for file in website/public/story_index.json titles.json website/app/config/dictionary.ts; do
            mkdir -p "/tmp/magi-reader-v7/$(dirname "$file")"
            curl -L --fail --silent --show-error --retry 4 --retry-all-errors --max-time 180 \
              "https://raw.githubusercontent.com/HiiragiNemu/magi-reader/main/$file" \
              -o "/tmp/magi-reader-v7/$file"
          done
          python3 scripts/build-story-localization-v7.py \
            --catalog public/data/character-catalog.json \
            --story-dir public/data/story-v6 \
            --reader-index /tmp/magi-reader-v7/website/public/story_index.json \
            --reader-titles /tmp/magi-reader-v7/titles.json \
            --reader-dictionary /tmp/magi-reader-v7/website/app/config/dictionary.ts \
            --output public/data/story-v7/localization.json \
            | tee /tmp/v7-localization-audit.json
          python3 - <<'PY'
          import json
          value=json.load(open('public/data/story-v7/localization.json',encoding='utf-8'))
          audit=value['audit']
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          assert audit['castNames'] >= 270
          assert audit['mappedCastNames'] >= 240
          assert len(value['categoryOrder']) == 19
          assert value['categoryOrder'][:15] == [
            'メイン【第1部】','メイン【第2部】','アナザー【第1部】','アナザー【第2部】',
            '魔法少女','衣装','ミラーズ','イベント','バトルミュージアム','スペシャル',
            '第1部EDムービー','第2部EDムービー','アニメ【1st】','アニメ【2nd】','アニメ【Final】'
          ]
          assert value['categoryLabels']['ピュエラ・ヒストリア']=='魔法少女历史篇'
          assert '神浜スパアドベンチャー ビーチに渦巻く悪魔の怨嗟' in value['titleExact'] or any(
            item['jp']=='神浜スパアドベンチャー ビーチに渦巻く悪魔の怨嗟' for item in value['titlePrefixes'])
          PY

      - name: Integrate the V7 production pages and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-story-ui-v7.py
          git diff --check

      - name: Extend static validation and production verifier for V7
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path=Path('scripts/validate-site.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
            "  V6: 'story-ocr-layout-v6-20260816'\n});",
            "  V6: 'story-ocr-layout-v6-20260816',\n  V7: 'story-ui-translation-ocr-v7-20260816'\n});",
            1)
          text=text.replace(
            "const isV6 = release === RELEASES.V6;",
            "const isV7 = release === RELEASES.V7;\nconst isV6 = release === RELEASES.V6 || isV7;",
            1)
          text=text.replace(
            "  if (!pages[0].text.includes('./myfile/story-app.js')) fail('story.html missing story app.');\n  if (!pages[1].text.includes('./myfile/attendance-app.js')) fail('attendance.html missing attendance app.');",
            "  if (!isV7 && !pages[0].text.includes('./myfile/story-app.js')) fail('story.html missing story app.');\n  if (!isV7 && !pages[1].text.includes('./myfile/attendance-app.js')) fail('attendance.html missing attendance app.');\n  if (isV7 && !pages[0].text.includes('./myfile/story-app-v7.js')) fail('story.html missing V7 story app.');\n  if (isV7 && !pages[1].text.includes('./myfile/attendance-app-v7.js')) fail('attendance.html missing V7 attendance app.');",
            1)
          text=text.replace(
            "  const storyApp = read('public/myfile/story-app.js');",
            "  const storyApp = read(isV7 ? 'public/myfile/story-app-v7.js' : 'public/myfile/story-app.js');",
            1)
          block=r'''
          if (isV7) {
            for (const file of [
              'public/myfile/suite-v7.css', 'public/myfile/suite-v7.js',
              'public/myfile/story-app-v7.js', 'public/myfile/attendance-app-v7.js',
              'public/myfile/runes-template-v7.js', 'public/data/story-v7/localization.json',
              'scripts/build-story-localization-v7.py', 'scripts/integrate-story-ui-v7.py',
              'scripts/smoke-story-ui-v7.mjs', 'scripts/smoke-rune-v7.mjs'
            ]) requireFile(file);
            const rootV7 = read('public/index.html');
            const storyV7 = read('public/story.html');
            const attendanceV7 = read('public/attendance.html');
            const runesV7 = read('public/runes.html');
            for (const [file, page] of [['index', rootV7], ['story', storyV7], ['attendance', attendanceV7], ['runes', runesV7]]) {
              if (!page.includes('./myfile/suite-v7.css')) fail(`${file} page missing V7 CSS.`);
            }
            for (const marker of ['./myfile/suite-v7.js', './myfile/story-app-v7.js', './myfile/charaAt.js']) {
              if (!storyV7.includes(marker)) fail(`story page missing ${marker}`);
            }
            for (const marker of ['./myfile/suite-v7.js', './myfile/attendance-app-v7.js', './myfile/charaAt.js']) {
              if (!attendanceV7.includes(marker)) fail(`attendance page missing ${marker}`);
            }
            if (!rootV7.includes('./myfile/suite-v7.js')) fail('root page missing V7 quick-rail script.');
            if (!runesV7.includes('./myfile/runes-template-v7.js')) fail('runes page missing V7 template recognizer.');
            for (const forbidden of ['不修改 magi-reader', '中文整合工具', '查询仍使用原始日文角色键', '不再由手机浏览器直接请求 Google Apps Script']) {
              for (const [file, page] of [['story', storyV7], ['attendance', attendanceV7], ['runes', runesV7]]) {
                if (page.includes(forbidden)) fail(`${file} page exposes internal visitor copy: ${forbidden}`);
              }
            }
            const localization = JSON.parse(read('public/data/story-v7/localization.json'));
            if (localization.categoryLabels?.['ピュエラ・ヒストリア'] !== '魔法少女历史篇') fail('V7 Historia label is incorrect.');
            if (localization.categoryOrder?.[0] !== 'メイン【第1部】' || localization.categoryOrder?.[9] !== 'スペシャル') fail('V7 category order does not follow the original page.');
            if (!localization.titleExact?.['神浜スパアドベンチャー ビーチに渦巻く悪魔の怨嗟 3話']) fail('V7 verified SPA story title translation missing.');
            const storyAppV7 = read('public/myfile/story-app-v7.js');
            for (const marker of ['story-result-list-v7', 'resolveCharacterV7', 'installAttributeFilterV7', 'localizeTitle']) {
              if (!storyAppV7.includes(marker)) fail(`V7 story marker missing: ${marker}`);
            }
            const runeV7 = read('public/myfile/runes-template-v7.js');
            for (const marker of ['ALPHABET_ROWS', 'removeLongLines', 'chartRecognition', 'row-major-chart']) {
              if (!runeV7.includes(marker)) fail(`V7 rune marker missing: ${marker}`);
            }
            if (buildInfo.rollbackBeforeStoryUiTranslationOcrV7 !== 'rollback/pre-story-ui-translation-ocr-v7-20260816') fail('V7 rollback pointer missing.');
            if (buildInfo.visitorCopyPolicy !== 'no-internal-project-instructions') fail('V7 visitor-copy policy missing.');
          }
          '''
          anchor='\nif (failed) process.exit(1);'
          if 'if (isV7)' not in text:
            if anchor not in text: raise SystemExit('validate-site final anchor missing')
            text=text.replace(anchor,'\n'+block+anchor,1)
          path.write_text(text,encoding='utf-8')

          path=Path('.github/workflows/site-validation.yml')
          text=path.read_text(encoding='utf-8')
          if 'fix/story-ui-translation-ocr-v7-20260816' not in text:
            text=text.replace('      - fix/story-ocr-layout-v6-20260816\n','      - fix/story-ocr-layout-v6-20260816\n      - fix/story-ui-translation-ocr-v7-20260816\n',1)
          if 'scripts/smoke-story-ui-v7.mjs' not in text:
            anchor='              scripts/smoke-ocr-v6.mjs\n'
            addition=anchor+'              public/myfile/suite-v7.js\n              public/myfile/story-app-v7.js\n              public/myfile/attendance-app-v7.js\n              public/myfile/runes-template-v7.js\n              scripts/smoke-story-ui-v7.mjs\n              scripts/smoke-rune-v7.mjs\n'
            if anchor not in text: raise SystemExit('site-validation V6 JS anchor missing')
            text=text.replace(anchor,addition,1)
          if 'scripts/build-story-localization-v7.py' not in text:
            text=text.replace(
              '            scripts/integrate-story-ocr-layout-v6.py\n',
              '            scripts/integrate-story-ocr-layout-v6.py \\\n            scripts/build-story-localization-v7.py \\\n            scripts/integrate-story-ui-v7.py\n',1)
          path.write_text(text,encoding='utf-8')
          PY

          cat > .github/workflows/verify-production.yml <<'YAML'
          name: Verify production deployment

          on:
            push:
              branches: [main]
              paths:
                - public/**
                - scripts/smoke-neo11-v3.mjs
                - scripts/smoke-height-guide-v4.mjs
                - scripts/smoke-integrated-tools-v5.mjs
                - scripts/smoke-story-ui-v7.mjs
                - scripts/smoke-rune-v7.mjs
                - .github/workflows/verify-production.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 75
              steps:
                - uses: actions/checkout@v4
                - name: Wait for Cloudflare Pages V7
                  shell: bash
                  run: |
                    set -euo pipefail
                    BASE='https://magireco-call-search-cn.pages.dev'
                    EXPECTED='story-ui-translation-ocr-v7-20260816'
                    ready=0
                    for attempt in $(seq 1 150); do
                      nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
                      if curl -LfsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache, no-store' \
                          "$BASE/build-info.json?verify=$nonce" -o /tmp/live-build.json \
                        && grep -Fq "\"release\": \"$EXPECTED\"" /tmp/live-build.json \
                        && curl -LfsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache, no-store' \
                          "$BASE/data/story-v7/localization.json?verify=$nonce" -o /tmp/live-localization.json \
                        && python3 - <<'PY'
          import json
          value=json.load(open('/tmp/live-localization.json',encoding='utf-8'))
          assert value['categoryLabels']['ピュエラ・ヒストリア']=='魔法少女历史篇'
          assert value['categoryOrder'][0]=='メイン【第1部】'
          assert value['audit']['mappedCastNames']>=240
          PY
                      then
                        page_ok=1
                        for route in '' story.html attendance.html runes.html; do
                          output="/tmp/live-${route:-index.html}"
                          curl -LfsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache, no-store' \
                            "$BASE/${route}?verify=$nonce" -o "$output" || page_ok=0
                          grep -Fq "data-build=\"$EXPECTED\"" "$output" || page_ok=0
                          grep -Fq './myfile/suite-v7.css' "$output" || page_ok=0
                        done
                        if [ "$page_ok" -eq 1 ] \
                          && grep -Fq './myfile/story-app-v7.js' /tmp/live-story.html \
                          && grep -Fq './myfile/attendance-app-v7.js' /tmp/live-attendance.html \
                          && grep -Fq './myfile/runes-template-v7.js' /tmp/live-runes.html; then
                          ready=1; break
                        fi
                      fi
                      sleep 10
                    done
                    test "$ready" -eq 1
                - name: Install browser driver
                  run: npm install --no-save --no-package-lock puppeteer-core@24.16.0
                - name: Run live regressions and V7 acceptance
                  shell: bash
                  run: |
                    set -euo pipefail
                    CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
                    BASE='https://magireco-call-search-cn.pages.dev'
                    BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/live-neo11.txt
                    grep -Fq '"state": "pass"' /tmp/live-neo11.txt
                    BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/live-height.txt
                    grep -Fq '"state": "pass"' /tmp/live-height.txt
                    BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/live-tools.txt
                    grep -Fq '"state": "pass"' /tmp/live-tools.txt
                    BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/live-story-v7.txt
                    grep -Fq '"state": "pass"' /tmp/live-story-v7.txt
                    BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-rune-v7.mjs | tee /tmp/live-rune-v7.txt
                    grep -Fq '"state": "pass"' /tmp/live-rune-v7.txt
                - name: Upload live evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: live-story-ui-translation-ocr-v7-${{ github.sha }}
                    path: |
                      /tmp/live-build.json
                      /tmp/live-localization.json
                      /tmp/live-index.html
                      /tmp/live-story.html
                      /tmp/live-attendance.html
                      /tmp/live-runes.html
                      /tmp/live-neo11.txt
                      /tmp/live-height.txt
                      /tmp/live-tools.txt
                      /tmp/live-story-v7.txt
                      /tmp/live-rune-v7.txt
                      /tmp/story-ui-v7-mobile.png
                      /tmp/rune-v7-desktop.png
                    if-no-files-found: warn
                    retention-days: 30
          YAML

      - name: Static syntax and localization validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          for file in \
            public/myfile/suite-v7.js \
            public/myfile/story-app-v7.js \
            public/myfile/attendance-app-v7.js \
            public/myfile/runes-template-v7.js \
            scripts/smoke-story-ui-v7.mjs \
            scripts/smoke-rune-v7.mjs \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-integrated-tools-v5.mjs; do
            node --check "$file"
          done
          python3 -m py_compile scripts/build-story-localization-v7.py scripts/integrate-story-ui-v7.py
          git diff --check

      - name: Install browser driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8000 --directory public >/tmp/v7-http.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/build-info.json >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/v7-http.log
          exit 1

      - name: Run relationship height and integrated-tool regressions
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/v7-neo11.txt
          grep -Fq '"state": "pass"' /tmp/v7-neo11.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/v7-height.txt
          grep -Fq '"state": "pass"' /tmp/v7-height.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/v7-tools.txt
          grep -Fq '"state": "pass"' /tmp/v7-tools.txt

      - name: Run V7 story UI localization attribute and OCR acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/v7-story.txt
          grep -Fq '"state": "pass"' /tmp/v7-story.txt
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" node scripts/smoke-rune-v7.mjs | tee /tmp/v7-rune.txt
          grep -Fq '"state": "pass"' /tmp/v7-rune.txt

      - name: Commit only the fully tested V7 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts .github/workflows/site-validation.yml .github/workflows/verify-production.yml
          if git diff --cached --quiet; then
            echo 'V7 production tree already integrated.'
          else
            git commit -m 'Integrate and validate responsive localized story UI and OCR V7'
            git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
          fi

      - name: Upload prepublication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-ui-translation-ocr-v7-prepublication-${{ github.sha }}
          path: |
            /tmp/v7-localization-audit.json
            /tmp/v7-http.log
            /tmp/v7-neo11.txt
            /tmp/v7-height.txt
            /tmp/v7-tools.txt
            /tmp/v7-story.txt
            /tmp/v7-rune.txt
            /tmp/story-ui-v7-mobile.png
            /tmp/rune-v7-desktop.png
            /tmp/neo11-v3-mobile.png
            /tmp/neo11-v3-desktop.png
            /tmp/height-guide-v4-mobile.png
            /tmp/height-guide-v4-desktop.png
          if-no-files-found: warn
          retention-days: 30
