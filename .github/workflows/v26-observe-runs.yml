name: Observe V26 workflow runs

on:
  push:
    branches: [main]
    paths:
      - .v26-observe-trigger
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record recent runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" > reports/v26-recent-actions-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('reports/v26-recent-actions-runs.json').read_text())
          compact = []
          for run in source.get('workflow_runs', []):
              compact.append({
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              })
          Path('reports/v26-recent-actions-runs-summary.json').write_text(
              json.dumps(compact, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-recent-actions-runs*.json
          git commit -m 'Record current V26 Actions run state'
          git push origin HEAD:main
