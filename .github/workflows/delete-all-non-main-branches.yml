name: Delete every non-main branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-all-non-main-branches.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delete-all-non-main-branches
  cancel-in-progress: false

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete every branch except main and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'magireco-call-search-cn-branch-cleanup',
          }

          def call(url: str, method: str = 'GET'):
              request = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {url} -> HTTP {exc.code}: {payload}') from exc

          def list_branches() -> list[str]:
              result: list[str] = []
              page = 1
              while True:
                  _, rows = call(f'{api}/branches?per_page=100&page={page}')
                  if not rows:
                      break
                  result.extend(str(row['name']) for row in rows)
                  if len(rows) < 100:
                      break
                  page += 1
              return sorted(set(result))

          before = list_branches()
          targets = [name for name in before if name != 'main']
          deleted: list[str] = []
          failures: dict[str, str] = {}

          for name in targets:
              encoded = urllib.parse.quote(name, safe='')
              url = f'{api}/git/refs/heads/{encoded}'
              try:
                  call(url, 'DELETE')
                  deleted.append(name)
              except Exception as exc:
                  failures[name] = str(exc)

          # GitHub's branch listing can be briefly eventually consistent.
          after: list[str] = []
          for _ in range(12):
              after = list_branches()
              if after == ['main']:
                  break
              time.sleep(5)

          proof = {
              'schemaVersion': 1,
              'state': 'pass' if after == ['main'] and not failures else 'fail',
              'repository': repo,
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'checkedAt': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              'beforeCount': len(before),
              'before': before,
              'targetCount': len(targets),
              'deletedCount': len(deleted),
              'deleted': deleted,
              'failures': failures,
              'afterCount': len(after),
              'after': after,
          }
          Path('/tmp/branch-cleanup-proof.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          if proof['state'] != 'pass':
              raise SystemExit(1)
          PY

      - name: Record verified cleanup and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/branch-cleanup-proof.json reports/branch-cleanup-proof.json
          rm -f .github/workflows/delete-all-non-main-branches.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record verified branch cleanup: only main remains'
          git push origin HEAD:main
