name: V22 final accepted-state supervisor

on:
  push:
    branches:
      - main
    paths:
      - .deploy-v22-supervisor-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v22-authoritative-main
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WIKI_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted state or execute supervised fallback
        shell: bash
        run: bash .automation/run-v22-supervisor.sh

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-supervisor-evidence-${{ github.run_id }}
          path: |
            /tmp/v22-supervisor
            /tmp/v22-supervisor-local
            /tmp/v22-supervisor-production
            public/data/story-title-authority-report-v22.json
            public/data/story-title-authority-map-v22.json
            public/data/v22-site-audit.json
            public/data/v22-final-acceptance.json
            public/downloads/story-title-missing-authoritative-v22.tsv
            docs/V22_SITE_AUDIT.md
            .automation/v22-build-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
