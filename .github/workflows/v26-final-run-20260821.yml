name: Final V26 convergence execution

on:
  push:
    branches: [main]
    paths:
      - .v26-final-run-20260821-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-final-v26-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate final convergence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v26-finalize-atomic.py
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Commit converged repository directly to main
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'V26 finalizer produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Complete V26 repository, title-data, and public cleanup'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify only main remains
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          printf 'Remote branches: %s\n' "${branches[*]}"
          [ "${#branches[@]}" -eq 1 ]
          [ "${branches[0]}" = main ]

      - name: Preserve converged source with a tag
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v26-converged-final-20260821'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists."
          else
            git tag -a "$tag" "$PRODUCT_SHA" -m 'Final V26 converged release'
            git push origin "refs/tags/$tag"
          fi

      - name: Wait for Cloudflare Pages V26
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            marker="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "https://magireco-call-search-cn.pages.dev/v26-build-marker.json?v=$nonce" 2>/dev/null || true)"
            if python - "$marker" <<'PY'
          import json, sys
          try:
              value = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if value.get('release') == 'v26-converged-20260821' and value.get('dataArchitecture') == 'plain-json' else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for V26 production.' >&2
          exit 1

      - name: Independently verify production
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-live-v26.py \
            --base https://magireco-call-search-cn.pages.dev \
            --output /tmp/v26-production-proof.json \
            --source-sha "$PRODUCT_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Record final proof on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p reports
          cp /tmp/v26-production-proof.json public/v26-production-proof.json
          cp /tmp/v26-production-proof.json reports/v26-production-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/v26-production-proof.json').read_text(encoding='utf-8'))
          summary = {
              'schemaVersion': 1,
              'state': 'pass',
              'release': proof['release'],
              'priorities': {
                  '1_repository_convergence': 'complete',
                  '2_versioned_local_overrides': 'complete',
                  '3_plain_json_title_architecture': 'complete',
                  '9_public_directory_cleanup': 'complete',
              },
              'onlyMainBranch': True,
              'remoteBranchCount': 1,
              'workflowCount': 3,
              'productionProof': 'public/v26-production-proof.json',
          }
          Path('reports/v26-convergence.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/v26-production-proof.json reports/v26-production-proof.json reports/v26-convergence.json
          git commit -m 'Record completed V26 production convergence proof'
          git push origin HEAD:main
