name: Call r22 prepublication verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/call-r22-verify.yml
      - .github/maintenance/call-r22/**
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright pillow==12.3.0 requests
      - run: python -m playwright install chromium --with-deps
      - uses: actions/download-artifact@v4
        with:
          name: call-r22-source-evidence
          run-id: 36470614126
          github-token: ${{ github.token }}
          path: /tmp/call-r22-source
      - name: Prepare isolated candidate from frozen source
        run: |
          cp .github/maintenance/call-r22/prepare.py /tmp/call-r22-prepare.py
          cp .github/maintenance/call-r22/prepare-commit.py /tmp/call-r22-prepare-commit.py
          python /tmp/call-r22-prepare.py
      - name: Static and unit regression gates
        shell: bash
        run: |
          set -euo pipefail
          {
            python scripts/cn_terminology.py
            python scripts/canonicalize-cn-artifacts.py --check
            python scripts/build-aio-edge-route-index.py --check
            python scripts/build-title-data.py --check
            python scripts/validate-production.py
            node scripts/validate-site.js
            python scripts/audit-translations-v5.py
            git diff --exit-code
            node --test tests/*.test.mjs
            git diff --cached --check
          } 2>&1 | tee /tmp/call-r22-verify/static-tests.log
      - name: Complete pagination regression
        run: python tests/story-pagination-browser.py --output /tmp/call-r22-verify/pagination.json
      - name: Actual browser UI regression and screenshots
        run: python tests/call-r22-browser.py --output /tmp/call-r22-verify/browser
      - name: Store reviewed candidate without updating main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/call-r22-prepare-commit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-r22-prepublication-evidence
          path: /tmp/call-r22-verify
          retention-days: 7
