name: Emergency diagnose live runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-diagnose-live-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect deployed runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          q="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -LfsS -D /tmp/noquery.headers "$BASE/myfile/live-fixes-v12.js" -o /tmp/noquery.js
          curl -LfsS -D /tmp/busted.headers -H 'Cache-Control: no-cache, no-store' "$BASE/myfile/live-fixes-v12.js?emergency=$q" -o /tmp/busted.js
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE/?emergency=$q" -o /tmp/index.html
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE/runes.html?emergency=$q" -o /tmp/runes.html
          echo '=== live-fixes without query ==='
          sha256sum /tmp/noquery.js
          grep -nE 'ensureCallMenuLinks|V12 real-device|V12/V15' /tmp/noquery.js || true
          grep -iE '^(cache-control|age|etag|cf-cache-status):' /tmp/noquery.headers || true
          echo '=== live-fixes cache-busted ==='
          sha256sum /tmp/busted.js
          grep -nE 'ensureCallMenuLinks|V12 real-device|V12/V15' /tmp/busted.js || true
          grep -iE '^(cache-control|age|etag|cf-cache-status):' /tmp/busted.headers || true
          cmp -s /tmp/noquery.js /tmp/busted.js && echo 'LIVE_BYTES_EQUAL=yes' || echo 'LIVE_BYTES_EQUAL=no'
          grep -F 'data-build=' /tmp/runes.html | head -1

      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Test event-loop responsiveness
        shell: bash
        run: |
          cat > emergency-diag.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const chrome = process.env.CHROME_PATH;
          const base = 'https://magireco-call-search-cn.pages.dev';
          const browser = await puppeteer.launch({executablePath: chrome, headless: true, args:['--no-sandbox','--disable-dev-shm-usage']});
          async function probe(label, bustAsset) {
            const page = await browser.newPage();
            await page.setCacheEnabled(false);
            if (bustAsset) {
              await page.setRequestInterception(true);
              page.on('request', req => {
                const u = req.url();
                if (u.includes('/myfile/live-fixes-v12.js') && !u.includes('emergencyAsset=')) {
                  req.continue({url: `${u}${u.includes('?') ? '&' : '?'}emergencyAsset=${Date.now()}`});
                } else req.continue();
              });
            }
            const errors=[];
            page.on('pageerror', e => errors.push(e.message));
            const started=Date.now();
            try {
              await page.goto(`${base}/?diag=${label}-${Date.now()}`, {waitUntil:'domcontentloaded', timeout:20000});
              const result = await Promise.race([
                page.evaluate(() => new Promise(resolve => setTimeout(() => resolve({
                  ready: document.readyState,
                  live: window.__MAGIRECO_LIVE_V12__?.release || '',
                  nav: document.querySelectorAll('.suite-nav a').length,
                  feature: document.documentElement.dataset.liveFeatureV16 || '',
                  callMenu: document.documentElement.dataset.callMenuV15 || ''
                }), 250))),
                new Promise((_, reject) => setTimeout(() => reject(new Error('event loop probe timeout')), 5000))
              ]);
              console.log(JSON.stringify({label, state:'pass', elapsed:Date.now()-started, result, errors}));
            } catch (e) {
              console.log(JSON.stringify({label, state:'fail', elapsed:Date.now()-started, message:e.message, errors}));
              process.exitCode = 1;
            } finally {
              await page.close().catch(()=>{});
            }
          }
          await probe('normal', false);
          await probe('asset-busted', true);
          await browser.close();
          NODE
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          CHROME_PATH="$CHROME" node ./emergency-diag.mjs

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-live-runtime-${{ github.run_id }}
          path: |
            /tmp/noquery.js
            /tmp/busted.js
            /tmp/noquery.headers
            /tmp/busted.headers
            /tmp/index.html
            /tmp/runes.html
          if-no-files-found: warn
          retention-days: 7
