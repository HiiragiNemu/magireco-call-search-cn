name: V22 deterministic release and persistent acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .v22-finalize-r4-trigger

permissions:
  contents: write

env:
  BUILD_ID: v22-authority-20260820
  PRODUCTION_URL: https://magireco-call-search-cn.pages.dev

concurrency:
  group: magireco-call-search-v22-finalization
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main

      - name: Checkout official CN client tables
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-cn-patch
          path: _sources/magireco-cn-patch
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            magica/js/libs

      - name: Checkout MagiReader
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magi-reader
          path: _sources/magi-reader
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild V22 outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/finalize-v22.py
          node --check public/myfile/v22-final.js
          node --check tests/v22-smoke-r3.mjs

          rm -f \
            public/data/story-title-authority-v22.json \
            public/downloads/story-title-authority-v22.json \
            public/data/v22-translation-report.json \
            public/data/v22-site-audit.json \
            public/data/v22-production-acceptance.json \
            reports/v22-translation-report.json \
            reports/v22-site-audit.json \
            reports/v22-unresolved-titles.tsv \
            reports/v22-local-browser.json \
            reports/v22-production-acceptance.json

          python scripts/finalize-v22.py apply \
            --libs _sources/magireco-cn-patch/magica/js/libs \
            --reader _sources/magi-reader

          python - <<'PY'
          from pathlib import Path
          css = Path('public/myfile/v22-final.css')
          text = css.read_text(encoding='utf-8').replace(
              'calc(100dvh - (2 * var(--v22-menu-gap)))',
              'min(82dvh, 48rem)',
          )
          css.write_text(text, encoding='utf-8', newline='\n')
          js = Path('public/myfile/v22-final.js')
          text = js.read_text(encoding='utf-8').replace(
              'calc(100dvh - 16px)',
              'min(82dvh, 48rem)',
          )
          js.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Make repository main-only in active automation
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            ! -name 'v22-finalize-r4.yml' \
            -delete
          rm -rf .automation
          rm -f .deploy-v21-trigger .v22-finalize-trigger .v22-finalize-r2-trigger .v22-finalize-r3-trigger .v22-finalize-r4-trigger
          rm -f tests/v22-smoke.mjs tests/v22-smoke-r2.mjs
          git rm -r --cached --ignore-unmatch node_modules || true
          rm -rf node_modules

          cat > .github/workflows/v22-maintenance.yml <<'YAML'
          name: V22 main-only maintenance acceptance

          on:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: magireco-call-search-v22-maintenance
            cancel-in-progress: true

          jobs:
            audit:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Static audit
                  run: |
                    python -m py_compile scripts/finalize-v22.py
                    python scripts/finalize-v22.py audit --strict
                    node --check public/myfile/v22-final.js
                    node --check tests/v22-smoke-r3.mjs
                - name: Responsive browser audit
                  shell: bash
                  run: |
                    set -euo pipefail
                    npm install --no-save --no-package-lock puppeteer-core@24.16.0
                    python -m http.server 4173 --directory public >/tmp/v22-http.log 2>&1 &
                    server_pid=$!
                    trap 'kill "$server_pid" 2>/dev/null || true; rm -rf node_modules' EXIT
                    for _ in $(seq 1 30); do
                      curl -fsS http://127.0.0.1:4173/ >/dev/null && break
                      sleep 1
                    done
                    chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
                    BASE_URL=http://127.0.0.1:4173 CHROME_PATH="$chrome" \
                    REPORT_PATH=reports/v22-maintenance-browser.json \
                    node tests/v22-smoke-r3.mjs
          YAML

      - name: Static acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize-v22.py audit --strict
          node --check public/myfile/v22-final.js
          node --check tests/v22-smoke-r3.mjs

      - name: Local browser diagnostic
        id: local_browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          python -m http.server 4173 --directory public >/tmp/v22-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf node_modules' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_URL=http://127.0.0.1:4173 CHROME_PATH="$chrome" \
          REPORT_PATH=reports/v22-local-browser.json \
          node tests/v22-smoke-r3.mjs

      - name: Commit V22 product tree to main
        id: product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sources node_modules __pycache__ scripts/__pycache__
          rm -f .github/workflows/v22-finalize-r4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes generated.' >&2
            exit 1
          fi
          git commit -m "Finalize V22 authoritative Chinese localization and menu layout"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for production deployment
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            index="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$PRODUCTION_URL/?v22=$token" || true)"
            map_head="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$PRODUCTION_URL/data/story-title-authority-v22.json?v22=$token" 2>/dev/null | head -c 1 || true)"
            if grep -Fq "$BUILD_ID" <<<"$index" && [[ "$map_head" == '{' ]]; then
              echo "V22 deployed on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Production browser diagnostic
        id: production_browser
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_URL="$PRODUCTION_URL" CHROME_PATH="$chrome" \
          REPORT_PATH=/tmp/v22-production-browser.json \
          node tests/v22-smoke-r3.mjs
          rm -rf node_modules

      - name: Persist acceptance result on main
        if: always() && steps.product.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          local_outcome='${{ steps.local_browser.outcome }}'
          deploy_outcome='${{ steps.deploy.outcome }}'
          production_outcome='${{ steps.production_browser.outcome }}'
          state=pass
          if [[ "$local_outcome" != success || "$deploy_outcome" != success || "$production_outcome" != success ]]; then
            state=needs-review
          fi
          generated="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p reports public/data
          cat > reports/v22-production-acceptance.json <<JSON
          {
            "schemaVersion": 1,
            "build": "${BUILD_ID}",
            "generatedAt": "${generated}",
            "state": "${state}",
            "releaseSha": "${{ steps.product.outputs.sha }}",
            "runId": "${GITHUB_RUN_ID}",
            "production": "${PRODUCTION_URL}",
            "checks": {
              "static": "success",
              "localBrowser": "${local_outcome}",
              "deployment": "${deploy_outcome}",
              "productionBrowser": "${production_outcome}"
            },
            "branchCleanup": "deferred by explicit user request"
          }
          JSON
          cp reports/v22-production-acceptance.json public/data/v22-production-acceptance.json
          if [[ -f /tmp/v22-production-browser.json ]]; then
            cp /tmp/v22-production-browser.json reports/v22-production-browser.json
          fi
          git add reports/v22-production-acceptance.json reports/v22-production-browser.json public/data/v22-production-acceptance.json 2>/dev/null || true
          git commit -m "Record V22 production acceptance" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-deterministic-release-${{ github.run_id }}
          path: |
            reports/v22-*.json
            reports/v22-unresolved-titles.tsv
            /tmp/v22-production-browser.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce acceptance outcome
        if: always() && steps.product.outcome == 'success'
        shell: bash
        run: |
          test '${{ steps.local_browser.outcome }}' = success
          test '${{ steps.deploy.outcome }}' = success
          test '${{ steps.production_browser.outcome }}' = success
