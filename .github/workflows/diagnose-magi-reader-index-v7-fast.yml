name: Diagnose MagiReader story index V7 fast

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/diagnose-magi-reader-index-v7-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download index metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/magi-meta
          for file in website/public/story_index.json titles.json website/app/config/dictionary.ts; do
            mkdir -p "/tmp/magi-meta/$(dirname "$file")"
            curl -L --fail --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/HiiragiNemu/magi-reader/main/$file" \
              -o "/tmp/magi-meta/$file"
          done
      - name: Print useful structures
        shell: bash
        run: |
          python3 <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/magi-meta')
          data=json.loads((root/'website/public/story_index.json').read_text(encoding='utf-8'))
          print('TYPE',type(data).__name__,'LEN',len(data))
          if isinstance(data,list):
              for item in data[:3]: print('ITEM',json.dumps(item,ensure_ascii=False)[:2400])
          else:
              print('KEYS',list(data)[:40])
              for key in list(data)[:3]: print('ITEM',key,json.dumps(data[key],ensure_ascii=False)[:2400])
          text=(root/'website/public/story_index.json').read_text(encoding='utf-8')
          for term in ['神浜スパアドベンチャー','アリナのアトリエ','殲滅戦 魔女たちのパラドクス','阿莉娜的工作室','海滩']:
              pos=text.find(term)
              print('TERM',term,'POS',pos,'COUNT',text.count(term))
              if pos>=0: print(text[max(0,pos-800):pos+1800])
          titles=json.loads((root/'titles.json').read_text(encoding='utf-8'))
          for term in ['神浜スパアドベンチャー','アリナのアトリエ','殲滅戦','阿莉娜的工作室']:
              hits=[(key,value) for key,value in titles.items() if term in value]
              print('TITLE_HITS',term,len(hits),hits[:10])
          PY
