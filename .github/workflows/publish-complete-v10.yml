name: Publish complete call height title rune V10

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/publish-complete-v10.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-complete-v10
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out the V10 branch
        uses: actions/checkout@v4
        with:
          ref: fix/height-export-title-call-v10-20260817
          fetch-depth: 0

      - name: Assemble the completed V10 rune recognizer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assemble-runes-v10.py
          node --check public/myfile/runes-v10.js
          node --check public/myfile/runes-line-v10.js
          grep -Fq 'buildSmartMaskedFile' public/myfile/runes-v10.js
          grep -Fq 'detectAlphabetGrid' public/myfile/runes-v10.js
          grep -Fq '__RUNE_V10__' public/myfile/runes-v10.js
          grep -Fq 'recognizePaintedLine' public/myfile/runes-line-v10.js

      - name: Download MagiReader and Chinese Wiki metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v10/reader/website/public /tmp/v10/wiki
          for file in website/public/story_index.json titles.json; do
            mkdir -p "/tmp/v10/reader/$(dirname "$file")"
            curl -L --fail --silent --show-error --retry 5 --retry-all-errors --max-time 240 \
              "https://raw.githubusercontent.com/HiiragiNemu/magi-reader/main/$file" \
              -o "/tmp/v10/reader/$file"
          done
          USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors --max-time 240 \
            -A "$USER_AGENT" \
            'https://magireco.moe/wiki/%E6%97%A5%E6%9C%8D%E6%B4%BB%E5%8A%A8%E5%88%97%E8%A1%A8' \
            -o /tmp/v10/wiki/events.html
          curl -L --fail --silent --show-error --retry 3 --retry-all-errors --max-time 180 \
            -A "$USER_AGENT" \
            'https://magireco.moe/wiki/%E9%AD%94%E6%B3%95%E7%BA%AA%E5%BD%95:%E8%AE%B0%E5%BF%86%E7%BB%93%E6%99%B6' \
            -o /tmp/v10/wiki/memoria.html \
            || : > /tmp/v10/wiki/memoria.html
          test -s /tmp/v10/reader/website/public/story_index.json
          test -s /tmp/v10/reader/titles.json
          test -s /tmp/v10/wiki/events.html

      - name: Build all story display titles and the self-translation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-story-titles-v10.py \
            --localization public/data/story-v7/localization.json \
            --story-dir public/data/story-v6 \
            --reader-index /tmp/v10/reader/website/public/story_index.json \
            --reader-titles /tmp/v10/reader/titles.json \
            --wiki-events /tmp/v10/wiki/events.html \
            --wiki-memoria /tmp/v10/wiki/memoria.html \
            --audit-md docs/story-title-self-translations-v10.md \
            --audit-json public/data/story-v10/title-audit.json \
            | tee /tmp/v10-title-build.json
          python3 <<'PY'
          import json
          from pathlib import Path
          localization=json.loads(Path('public/data/story-v7/localization.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('public/data/story-v10/title-audit.json').read_text(encoding='utf-8'))
          summary=localization['titleAuditV10']
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert summary['uniqueSourceTitles']==5710
          assert summary['localizedSourceTitles']==5710
          assert summary['categoryTitlePairs']==5826
          assert summary['selfTranslatedTitles']==len(audit['selfTranslations'])
          assert len(localization['titleExact'])>=5710
          assert sum(len(value) for value in localization['titleByCategoryV10'].values())==5826
          assert localization['titleExact']['神浜スパアドベンチャー ビーチに渦巻く悪魔の怨嗟 3話'].startswith('神滨SPA大冒险')
          document=Path('docs/story-title-self-translations-v10.md').read_text(encoding='utf-8')
          assert '## 助手自译清单' in document
          assert '| 分类 | 日文原文 | 采用译名 |' in document or summary['selfTranslatedTitles']==0
          PY

      - name: Integrate call UI height categories export titles and rune V10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-height-export-title-call-v10.py
          python3 scripts/finalize-height-v10-source.py
          python3 scripts/integrate-complete-v10.py
          python3 scripts/extend-validator-v10.py
          git diff --check

      - name: Run static validation and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          for file in \
            public/myfile/call-ui-v10.js \
            public/myfile/height-export-v10.js \
            public/myfile/runes-v10.js \
            public/myfile/runes-line-v10.js \
            public/myfile/site-correction-v2.js \
            public/myfile/site-correction-v3-height.js \
            public/myfile/story-app-v7.js \
            scripts/smoke-complete-v10.mjs \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-integrated-tools-v5.mjs \
            scripts/smoke-story-ui-v7.mjs \
            scripts/smoke-collapsible-layout-v8.mjs; do
            node --check "$file"
          done
          python3 -m py_compile \
            scripts/assemble-runes-v10.py \
            scripts/build-story-titles-v10.py \
            scripts/integrate-height-export-title-call-v10.py \
            scripts/finalize-height-v10-source.py \
            scripts/integrate-complete-v10.py \
            scripts/extend-validator-v10.py

      - name: Install Chromium driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8000 --directory public >/tmp/v10-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:8000/build-info.json >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/v10-http.log
          exit 1

      - name: Run established mobile relationship height story and layout regressions
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE='http://127.0.0.1:8000'
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/v10-neo11.txt
          grep -Fq '"state": "pass"' /tmp/v10-neo11.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/v10-height-v4.txt
          grep -Fq '"state": "pass"' /tmp/v10-height-v4.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/v10-tools-v5.txt
          grep -Fq '"state": "pass"' /tmp/v10-tools-v5.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/v10-story-v7.txt
          grep -Fq '"state": "pass"' /tmp/v10-story-v7.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-collapsible-layout-v8.mjs | tee /tmp/v10-layout-v8.txt
          grep -Fq '"state": "pass"' /tmp/v10-layout-v8.txt

      - name: Run complete V10 acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" \
            node scripts/smoke-complete-v10.mjs | tee /tmp/v10-complete.txt
          grep -Fq '"state": "pass"' /tmp/v10-complete.txt

      - name: Commit only the fully tested production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts docs
          if git diff --cached --quiet; then
            echo 'The complete V10 production tree is already committed.'
          else
            git commit -m 'Publish complete call height title and rune OCR V10'
            git push origin HEAD:fix/height-export-title-call-v10-20260817
          fi

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-v10-prepublication-${{ github.sha }}
          path: |
            /tmp/v10-title-build.json
            /tmp/v10-http.log
            /tmp/v10-neo11.txt
            /tmp/v10-height-v4.txt
            /tmp/v10-tools-v5.txt
            /tmp/v10-story-v7.txt
            /tmp/v10-layout-v8.txt
            /tmp/v10-complete.txt
            /tmp/complete-v10-ocr.png
            /tmp/complete-v10-call-height.png
            /tmp/neo11-v3-mobile.png
            /tmp/neo11-v3-desktop.png
            /tmp/height-guide-v4-mobile.png
            /tmp/height-guide-v4-desktop.png
          if-no-files-found: warn
          retention-days: 30
