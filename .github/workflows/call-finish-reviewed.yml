name: Prepare reviewed Call completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/call-finish-reviewed.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load fixed reviewed inputs and apply exact production changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          repo='HiiragiNemu/magireco-call-search-cn'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req,timeout=60))
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='f141922e3f5a5dffb8dc398531b385212a98aa1f','main changed: rebase and review required'
          inputs={
            '/tmp/pagination-reviewed.patch':'f26bf8e87f99f0ebf86cfa191a10e41d57521128',
            'docs/call-sync-audit-20260929.json':'1802063500743abf6206bb5519e3d6b36aef7e6a',
            'tests/call-sync-20260929.test.mjs':'3e8ae35bf8365a3941353c49ede403c6387ff1a5',
            'tests/story-pagination-browser.py':'9c24eacba311dd9761ebfbb10c0795268492c85f',
            'scripts/verify-call-finish.py':'684d635dafac7e027bc58a141e6b9ca4fbfcaeea'
          }
          for path,sha in inputs.items():
              blob=api('git/blobs/'+sha);data=base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==sha
              Path(path).parent.mkdir(parents=True,exist_ok=True);Path(path).write_bytes(data)
          before={'public/myfile/story-app-v7.js':'31abd5edb4dec309a740683eb8cc8418534ca03318311cda6660dba218911189','public/story.html':'3d6378e805c87214210b1d2f07564c02242aacf29f8ffce08e6feb0f439e4270','public/myfile/callTable.js':'24c94d1af3b82df89089236f24fbdb98ef714f3d7d6142cb74e00c0d237fb683'}
          for path,wanted in before.items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==wanted,path
          Path('/tmp/call-baseline-story-app.js').write_bytes(Path('public/myfile/story-app-v7.js').read_bytes())
          assert hashlib.sha256(Path('/tmp/pagination-reviewed.patch').read_bytes()).hexdigest()=='34ef23651761af870f1720a125d79076ba57302b269fe82c3064841ce1c9dc23'
          subprocess.run(['git','apply','--check','/tmp/pagination-reviewed.patch'],check=True)
          subprocess.run(['git','apply','/tmp/pagination-reviewed.patch'],check=True)
          report=json.loads(Path('docs/call-sync-audit-20260929.json').read_text())
          path=Path('public/myfile/callTable.js');text=path.read_text()
          def change(key,target,before,after):
              global text
              start=text.index('  ['+json.dumps(key,ensure_ascii=False)+', new Map([')
              end=text.index('\n  ])]',start);segment=text[start:end]
              if before is not None:
                  old='    '+json.dumps([target,before],ensure_ascii=False)
                  new='    '+json.dumps([target,after],ensure_ascii=False)
                  assert segment.count(old)==1,(key,target)
                  segment=segment.replace(old,new,1)
              else:
                  assert not re.search('^    \\['+re.escape(json.dumps(target,ensure_ascii=False))+',',segment,re.M),(key,target)
                  segment+=',\n    '+json.dumps([target,after],ensure_ascii=False)
              text=text[:start]+segment+text[end:]
          for u in report['newRelationsAndCalls']:change(u['callerKey'],u['targetKey'],u['full'],u['after'])
          for u in report['metadataCorrections']:
              keys=re.findall(r'^  \["([^"]+)", new Map\(\[',text,re.M)
              key=next(k for k in keys if '('+u['caller']+' / ' in k)
              change(key,u['field'],u['before'],u['after'])
          for u in report['newRelationsAndCalls']:
              if u['kind']!='add-relation':continue
              caller=u['callerKey'].split(' (')[0]
              pattern=r'(^[ \t]*\['+re.escape(json.dumps(u['targetKey'],ensure_ascii=False))+r', new Set\()(\[[^\n]*\])(\)\])'
              matches=list(re.finditer(pattern,text,re.M));assert len(matches)==1
              m=matches[0];incoming=json.loads(m[2])
              if caller not in incoming:
                  incoming.append(caller);text=text[:m.start(2)]+json.dumps(incoming,ensure_ascii=False)+text[m.end(2):]
          path.write_text(text,encoding='utf-8')
          after={'public/myfile/story-app-v7.js':'dca81a4be7395df7050363f5c3825ea89a44ab038e1b26c021b3a1d213fcb65c','public/story.html':'a144d5b9d4919244c405ac332b3316c4f723c71bd8f624be2dec4e54b555fcb5','public/myfile/callTable.js':'af2e48de39f58cbb1c967a7affcbc7e395151474fe157fc257a7ed733301a5c6'}
          for path,wanted in after.items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==wanted,path
          Path('/tmp/call-reviewed-hashes.json').write_text(json.dumps(after,indent=2))
          ci=Path('.github/workflows/ci.yml');ci.write_text(ci.read_text()+'          node --test tests/call-sync-20260928.test.mjs tests/call-sync-20260929.test.mjs\n')
          prod=Path('.github/workflows/production-verify.yml')
          prod.write_text(prod.read_text()+'''\n      - name: Verify complete Call results and deployment bytes
                  run: python scripts/verify-call-finish.py --base https://magireco-call-search-cn.pages.dev --wait 600 --output /tmp/call-finish-production-proof.json
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: call-finish-production-verification
                    path: /tmp/call-finish-production-proof.json
                    retention-days: 30
          '''.replace('\n        ','\n'))
          PY
      - name: Validate production and relation regressions
        run: |
          python scripts/cn_terminology.py
          python scripts/canonicalize-cn-artifacts.py --check
          python scripts/build-aio-edge-route-index.py --check
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node scripts/validate-site.js
          python scripts/audit-translations-v5.py
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/callTable.js
          node --test tests/call-sync-20260928.test.mjs tests/call-sync-20260929.test.mjs tests/story-route-bridge-v1.test.mjs tests/aio-edge-function.test.mjs tests/ui-optics-local.test.mjs
      - name: Browser regression and matched performance comparison
        run: |
          python -m pip install --disable-pip-version-check playwright Pillow pyyaml
          python -m playwright install --with-deps chromium
          python tests/story-pagination-browser.py --output /tmp/call-pagination-proof.json
          python -m http.server 8765 --directory public >/tmp/call-http.log 2>&1 &
          python scripts/verify-call-finish.py --base http://127.0.0.1:8765 --wait 30 --check-upstream --baseline-script /tmp/call-baseline-story-app.js --output /tmp/call-prepublication-proof.json
      - name: Prepare tested commit object without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,statistics,urllib.request
          from pathlib import Path
          import yaml
          repo='HiiragiNemu/magireco-call-search-cn';parent=os.environ['GITHUB_SHA']
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              return json.load(urllib.request.urlopen(req,timeout=60))
          assert api('git/ref/heads/main')['object']['sha']==parent,'Concurrent main update: do not publish'
          for path,wanted in json.loads(Path('/tmp/call-reviewed-hashes.json').read_text()).items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==wanted,path
          for path in ['.github/workflows/ci.yml','.github/workflows/production-verify.yml']:yaml.safe_load(Path(path).read_text())
          proof=json.loads(Path('/tmp/call-prepublication-proof.json').read_text());assert proof['state']=='pass'
          for result in proof['browsers']:
              new=statistics.median(x['elapsedMs'] for x in result['warm']);old=statistics.median(x['elapsedMs'] for x in result['baselineWarm'])
              assert new<=old*1.25,('Performance regression',new,old)
          paths=['public/myfile/story-app-v7.js','public/story.html','public/myfile/callTable.js','public/data/translation-audit-v5.json','docs/translation-audit-v5.md','docs/call-sync-audit-20260929.json','tests/call-sync-20260929.test.mjs','tests/story-pagination-browser.py','scripts/verify-call-finish.py','.github/workflows/ci.yml','.github/workflows/production-verify.yml']
          entries=[];hashes={}
          for path in paths:
              data=Path(path).read_bytes();sha=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha});hashes[path]=hashlib.sha256(data).hexdigest()
          entries.append({'path':'.github/workflows/call-finish-reviewed.yml','mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':api('git/commits/'+parent)['tree']['sha'],'tree':entries})['sha']
          commit=api('git/commits',{'message':'fix(call): complete reviewed relation sync and paginate all story results','tree':tree,'parents':[parent]})
          Path('/tmp/call-prepared-commit.json').write_text(json.dumps({'commit':commit['sha'],'parent':parent,'tree':tree,'files':hashes,'state':'validated-not-published'},indent=2))
          print('Prepared tested commit:',commit['sha'],'; main ref unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-finish-reviewed-proof
          path: |
            /tmp/call-prepared-commit.json
            /tmp/call-prepublication-proof.json
            /tmp/call-pagination-proof.json
            /tmp/call-reviewed-hashes.json
          if-no-files-found: warn
          retention-days: 30
