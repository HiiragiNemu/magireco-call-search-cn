name: Apply layout correction V2

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-layout-correction-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and patch the accepted production release
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .automation/layout-correction-v2/js-part-01.b64 \
            .automation/layout-correction-v2/js-part-02.b64 \
            .automation/layout-correction-v2/js-02.b64 \
            .automation/layout-correction-v2/js-03.b64 \
            | tr -d '\r\n ' | base64 -d | gzip -d \
            > public/myfile/site-correction-v2.js

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          release = 'layout-correction-v2-20260816'

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          css_anchor = '\t<link rel="stylesheet" href="./myfile/site-overhaul.css">'
          css_ref = '\t<link rel="stylesheet" href="./myfile/site-correction-v2.css">'
          js_anchor = '<script src="./myfile/site-overhaul.js"></script>'
          js_ref = '<script src="./myfile/site-correction-v2.js"></script>'

          for value, label in [(css_anchor, 'CSS anchor'), (js_anchor, 'JavaScript anchor')]:
              if index.count(value) != 1:
                  raise SystemExit(f'{label} must occur exactly once.')
          if css_ref not in index:
              index = index.replace(css_anchor, css_anchor + '\n' + css_ref, 1)
          if js_ref not in index:
              index = index.replace(js_anchor, js_anchor + '\n' + js_ref, 1)
          if index.count(css_ref) != 1 or index.count(js_ref) != 1:
              raise SystemExit('V2 production references are missing or duplicated.')
          index, changed = re.subn(r'data-build="[^"]*"', f'data-build="{release}"', index, count=1)
          if changed != 1:
              raise SystemExit('Production build marker could not be replaced.')
          index_path.write_text(index, encoding='utf-8')

          info_path = Path('public/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info.update({
              'release': release,
              'productionEntry': 'public/index.html',
              'deploymentTarget': 'magireco-call-search-cn.pages.dev',
              'acceptancePage': 'public/__acceptance.html',
              'rollbackBeforeLayoutCorrectionV2': 'rollback/pre-layout-correction-v2-20260816',
              'rollbackRejectedMobileOverhaul': 'rollback/rejected-mobile-overhaul-20260816'
          })
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          overhaul_path = Path('public/myfile/site-overhaul.js')
          overhaul = overhaul_path.read_text(encoding='utf-8')
          marker = 'const selectionOrderTracker = {'
          if marker not in overhaul:
              anchor = """    function getSelectedEntries() {
                  const keyIndex = U.buildCallTableKeyIndex();
                  return U.getCharacterCheckboxes()
                      .filter((checkbox) => checkbox.checked)
              """
              replacement = """    const selectionOrderTracker = {
                  order: [],
                  bound: false,
                  key(checkbox) {
                      return checkbox.id || checkbox.value;
                  },
                  bind() {
                      if (this.bound) return;
                      this.bound = true;
                      document.addEventListener('change', (event) => {
                          const checkbox = event.target;
                          if (!checkbox || typeof checkbox.matches !== 'function'
                              || !checkbox.matches('input.MagicalChk[name=\"chara\"]')) return;
                          const key = this.key(checkbox);
                          const existing = this.order.indexOf(key);
                          if (existing !== -1) this.order.splice(existing, 1);
                          if (checkbox.checked) this.order.push(key);
                      }, true);
                  },
                  orderedChecked() {
                      const checked = U.getCharacterCheckboxes().filter((checkbox) => checkbox.checked);
                      const active = new Set(checked.map((checkbox) => this.key(checkbox)));
                      this.order = this.order.filter((key) => active.has(key));
                      for (const checkbox of checked) {
                          const key = this.key(checkbox);
                          if (!this.order.includes(key)) this.order.push(key);
                      }
                      const rank = new Map(this.order.map((key, index) => [key, index]));
                      return checked
                          .map((checkbox, domIndex) => ({
                              checkbox,
                              domIndex,
                              rank: rank.get(this.key(checkbox)) ?? Number.MAX_SAFE_INTEGER
                          }))
                          .sort((left, right) => left.rank - right.rank || left.domIndex - right.domIndex)
                          .map((entry) => entry.checkbox);
                  }
              };
              selectionOrderTracker.bind();
              global.getSelectedCharacterCheckboxesInOrder = function getSelectedCharacterCheckboxesInOrder() {
                  selectionOrderTracker.bind();
                  return selectionOrderTracker.orderedChecked();
              };

              function getSelectedEntries() {
                  const keyIndex = U.buildCallTableKeyIndex();
                  return global.getSelectedCharacterCheckboxesInOrder()
              """
              if overhaul.count(anchor) != 1:
                  raise SystemExit('getSelectedEntries patch anchor is not unique.')
              overhaul = overhaul.replace(anchor, replacement, 1)
          if overhaul.count(marker) != 1:
              raise SystemExit('Selection-order tracker was not installed exactly once.')
          api_marker = 'global.getSelectedCharacterCheckboxesInOrder = function getSelectedCharacterCheckboxesInOrder() {'
          if api_marker not in overhaul:
              bind_anchor = '    selectionOrderTracker.bind();\n\n    function getSelectedEntries() {'
              bind_replacement = (
                  '    selectionOrderTracker.bind();\n'
                  '    global.getSelectedCharacterCheckboxesInOrder = function getSelectedCharacterCheckboxesInOrder() {\n'
                  '        selectionOrderTracker.bind();\n'
                  '        return selectionOrderTracker.orderedChecked();\n'
                  '    };\n\n'
                  '    function getSelectedEntries() {'
              )
              if overhaul.count(bind_anchor) != 1:
                  raise SystemExit('Selection-order API insertion anchor is not unique.')
              overhaul = overhaul.replace(bind_anchor, bind_replacement, 1)
          if overhaul.count(api_marker) != 1:
              raise SystemExit('Selection-order API was not installed exactly once.')
          overhaul_path.write_text(overhaul, encoding='utf-8')

          correction_path = Path('public/myfile/site-correction-v2.js')
          correction = correction_path.read_text(encoding='utf-8')
          correction_marker = 'global.getSelectedCharacterCheckboxesInOrder()'
          if correction_marker not in correction:
              correction_anchor = (
                  '  function getSelectedEntries() {\n'
                  '    const keyIndex = U.buildCallTableKeyIndex();\n'
                  '    const entries = [];\n'
                  '    for (const checkbox of U.getCharacterCheckboxes()) {'
              )
              correction_replacement = (
                  '  function getSelectedEntries() {\n'
                  '    const keyIndex = U.buildCallTableKeyIndex();\n'
                  '    const entries = [];\n'
                  "    const orderedCheckboxes = typeof global.getSelectedCharacterCheckboxesInOrder === 'function'\n"
                  '      ? global.getSelectedCharacterCheckboxesInOrder()\n'
                  '      : U.getCharacterCheckboxes();\n'
                  '    for (const checkbox of orderedCheckboxes) {'
              )
              if correction.count(correction_anchor) != 1:
                  raise SystemExit('V2 getSelectedEntries patch anchor is not unique.')
              correction = correction.replace(correction_anchor, correction_replacement, 1)
          if correction.count(correction_marker) != 1:
              raise SystemExit('V2 selection-order integration was not installed exactly once.')
          correction_path.write_text(correction, encoding='utf-8')
          PY

          test -s public/myfile/site-correction-v2.js
          grep -Fq 'relationship-table-viewport' public/myfile/site-correction-v2.js
          grep -Fq 'height-chart-viewport-v2' public/myfile/site-correction-v2.js
          grep -Fq 'const selectionOrderTracker = {' public/myfile/site-overhaul.js
          grep -Fq 'global.getSelectedCharacterCheckboxesInOrder = function' public/myfile/site-overhaul.js
          grep -Fq 'global.getSelectedCharacterCheckboxesInOrder()' public/myfile/site-correction-v2.js

      - name: Validate syntax and static production invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          node --check public/myfile/site-overhaul.js
          node --check public/myfile/site-correction-v2.js

          python3 <<'PY'
          from pathlib import Path
          import re
          html = Path('public/__acceptance.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html, flags=re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline acceptance script, found {len(scripts)}.')
          Path('/tmp/acceptance-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/acceptance-inline.js

      - name: Run fail-closed mobile and desktop browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "Using browser: $CHROME"

          python3 -m http.server 8000 --directory public >/tmp/magireco-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

          run_browser() {
            local operation="$1" name="$2" size="$3" mode="$4"
            local profile
            profile="$(mktemp -d "/tmp/${name}-profile-XXXXXX")"
            timeout 130s "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --disable-component-update \
              --disable-default-apps \
              --disable-extensions \
              --disable-sync \
              --metrics-recording-only \
              --mute-audio \
              --no-first-run \
              --run-all-compositor-stages-before-draw \
              --user-data-dir="$profile" \
              --window-size="$size" \
              --virtual-time-budget=35000 \
              "$operation" \
              "http://127.0.0.1:8000/__acceptance.html?mode=${mode}&verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$(date +%s%N)"
          }

          run_browser --dump-dom local-mobile-full '390,844' full > /tmp/local-mobile-full.html
          run_browser --dump-dom local-desktop-full '1440,900' full > /tmp/local-desktop-full.html

          for report in /tmp/local-mobile-full.html /tmp/local-desktop-full.html; do
            grep -Fq 'data-acceptance="pass"' "$report"
            grep -Fq '"state": "pass"' "$report"
            grep -Fq '关系表行顺序保持实际点击顺序' "$report"
            grep -Fq '关系表列顺序保持实际点击顺序' "$report"
          done

          echo 'Mobile acceptance report:'
          grep -A160 -F 'id="acceptance-status"' /tmp/local-mobile-full.html | tail -160 || true
          echo 'Desktop acceptance report:'
          grep -A160 -F 'id="acceptance-status"' /tmp/local-desktop-full.html | tail -160 || true

      - name: Upload pre-publication acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-publication-acceptance-${{ github.sha }}
          path: |
            /tmp/magireco-http.log
            /tmp/local-mobile-full.html
            /tmp/local-desktop-full.html
            public/myfile/site-overhaul.js
            public/myfile/site-correction-v2.js
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and publish only the accepted production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HiiragiNemu'
          git config user.email '128921071+HiiragiNemu@users.noreply.github.com'

          rollback='rollback/pre-layout-correction-v2-20260816'
          if ! git ls-remote --exit-code --heads origin "$rollback" >/dev/null 2>&1; then
            git push origin "${GITHUB_SHA}:refs/heads/${rollback}"
          fi

          git add \
            public/index.html \
            public/build-info.json \
            public/myfile/site-overhaul.js \
            public/myfile/site-correction-v2.css \
            public/myfile/site-correction-v2.js

          if git diff --cached --quiet; then
            echo 'Accepted production files are already current.'
            exit 0
          fi

          git commit -m 'Deploy accepted layout correction V2'
          git push origin HEAD:main
