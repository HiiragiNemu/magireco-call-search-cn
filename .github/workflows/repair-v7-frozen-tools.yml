name: Repair V7 frozen tools extension

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/repair-v7-frozen-tools.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0

      - name: Publish V7 tools as a separate immutable namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path=Path('public/myfile/suite-v7.js')
          text=path.read_text(encoding='utf-8')
          old='''  Object.assign(Tools, {
              loadLocalizationV7: loadLocalization,
              resolveCharacterV7,
              createCastChipV7,
              installAttributeFilterV7,
              installQuickRailV7,
              scrollToTargetV7: scrollToTarget,
              attributesForV7: attributesFor,
              attributeLabelV7: attributeLabel
            });'''
          new='''  global.MagiToolsV7 = Object.freeze({
              ...Tools,
              loadLocalizationV7: loadLocalization,
              resolveCharacterV7,
              createCastChipV7,
              installAttributeFilterV7,
              installQuickRailV7,
              scrollToTargetV7: scrollToTarget,
              attributesForV7: attributesFor,
              attributeLabelV7: attributeLabel
            });'''
          if old not in text: raise SystemExit('Frozen-tools extension block not found.')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          replacements={
            'public/myfile/story-app-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools?.loadLocalizationV7) return;",
              "const Tools = global.MagiToolsV7;\n  if (!Tools?.loadLocalizationV7) return;"),
            'public/myfile/attendance-app-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools?.resolveCharacterV7) return;",
              "const Tools = global.MagiToolsV7;\n  if (!Tools?.resolveCharacterV7) return;"),
            'public/myfile/runes-template-v7.js': (
              "const Tools = global.MagiTools;\n  if (!Tools) return;",
              "const Tools = global.MagiToolsV7 || global.MagiTools;\n  if (!Tools) return;"),
            'scripts/smoke-story-ui-v7.mjs': (
              'window.MagiTools?.resolveCharacterV7',
              'window.MagiToolsV7?.resolveCharacterV7')
          }
          for filename,(old,new) in replacements.items():
            path=Path(filename); text=path.read_text(encoding='utf-8')
            if old not in text: raise SystemExit(f'Expected V7 namespace pattern missing: {filename}')
            path.write_text(text.replace(old,new),encoding='utf-8')

          # Touch the gated integration workflow so the corrected source is tested
          # from a fresh checkout immediately after this repair commit.
          path=Path('.github/workflows/integrate-story-ui-v7.yml')
          text=path.read_text(encoding='utf-8')
          marker='# frozen-tools repair applied\n'
          if marker not in text:
            text=text.replace('name: Integrate story UI translation OCR V7\n','name: Integrate story UI translation OCR V7\n'+marker,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check public/myfile/suite-v7.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/attendance-app-v7.js
          node --check public/myfile/runes-template-v7.js
          node --check scripts/smoke-story-ui-v7.mjs

      - name: Commit and trigger a fresh gated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/myfile/suite-v7.js \
            public/myfile/story-app-v7.js \
            public/myfile/attendance-app-v7.js \
            public/myfile/runes-template-v7.js \
            scripts/smoke-story-ui-v7.mjs \
            .github/workflows/integrate-story-ui-v7.yml
          git commit -m 'Publish V7 helpers without mutating frozen MagiTools'
          git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
