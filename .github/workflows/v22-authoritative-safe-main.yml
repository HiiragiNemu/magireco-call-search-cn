name: V22 safe authoritative localization and acceptance

on:
  push:
    branches:
      - main
    paths:
      - .deploy-v22-safe-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v22-authoritative-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      WIKI_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT || secrets.GITHUB_PAT }}
      V22_MAX_MACHINE_TRANSLATIONS: "3000"
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record fail-closed rollback point
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Checkout official Chinese client tables
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-cn-patch
          path: _sources/magireco-cn-patch
          fetch-depth: 1

      - name: Checkout MagiReader
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magi-reader
          path: _sources/magi-reader
          fetch-depth: 1

      - name: Checkout structured Chinese Wiki source when authorized
        if: ${{ env.WIKI_TOKEN != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-wiki-data
          path: _sources/magireco-wiki-data
          token: ${{ env.WIKI_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/characters.json
            data/memoria.json
            data/story.json
            data/pages_index.json

      - name: Validate programs and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-authoritative-localization-v22.py scripts/run-v22-authoritative-safe.py
          node --check .automation/v22-production-smoke.mjs
          python -m pip install --quiet openpyxl

      - name: Build safe authoritative localization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run-v22-authoritative-safe.py
          rm -f .github/workflows/v22-authoritative-main.yml
          rm -f .deploy-v22-trigger
          rm -f .automation/v22-write-probe.txt

      - name: Syntax-check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file" >/tmp/v22-node-check.log 2>&1; then
              echo "::error file=$file::JavaScript syntax check failed"
              cat /tmp/v22-node-check.log
              failed=1
            fi
          done < <(find public -type f -name '*.js' -size -8M -print0)
          exit "$failed"

      - name: Prepare isolated browser test environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v22-node /tmp/v22-local-acceptance /tmp/v22-production-acceptance
          mkdir -p /tmp/v22-node /tmp/v22-local-acceptance /tmp/v22-production-acceptance
          cp .automation/v22-production-smoke.mjs /tmp/v22-node/smoke.mjs
          cd /tmp/v22-node
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-package-lock --no-save puppeteer-core@24.16.0

      - name: Local responsive browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public >/tmp/v22-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$chrome"
          BASE_URL=http://127.0.0.1:4173 \
          CHROME_PATH="$chrome" \
          ARTIFACT_DIR=/tmp/v22-local-acceptance \
          node /tmp/v22-node/smoke.mjs

      - name: Commit accepted product to main
        id: push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sources
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Safe V22 run produced no repository changes"
            exit 1
          fi
          git commit -m "Finalize safe V22 authoritative localization"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          expected='v22-authoritative-localization-20260820'
          for attempt in $(seq 1 180); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            index="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/?v22safe=$token" || true)"
            report="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/data/story-title-authority-report-v22.json?v22safe=$token" || true)"
            css="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/myfile/v22-menu-fixes.css?v22safe=$token" || true)"
            groups_head="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/downloads/story-title-groups.json?v22safe=$token" 2>/dev/null | head -c 1 || true)"
            if grep -Fq "$expected" <<<"$index" \
              && grep -Fq "$expected" <<<"$report" \
              && grep -Fq "$expected" <<<"$css" \
              && [[ "$groups_head" == '{' || "$groups_head" == '[' ]]; then
              echo "Cloudflare Pages is serving the safe V22 product commit."
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for safe V22 production.' >&2
          exit 1

      - name: Production responsive browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          BASE_URL=https://magireco-call-search-cn.pages.dev \
          CHROME_PATH="$chrome" \
          ARTIFACT_DIR=/tmp/v22-production-acceptance \
          node /tmp/v22-node/smoke.mjs

      - name: Record accepted production state
        id: proof
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          acceptance = json.loads(Path('/tmp/v22-production-acceptance/acceptance.json').read_text(encoding='utf-8'))
          authority = json.loads(Path('public/data/story-title-authority-report-v22.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/data/v22-site-audit.json').read_text(encoding='utf-8'))
          proof = {
              'release': 'v22-authoritative-localization-20260820',
              'state': 'pass',
              'acceptedAt': datetime.now(timezone.utc).isoformat(),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'productCommit': os.environ['PRODUCT_SHA'],
              'production': 'https://magireco-call-search-cn.pages.dev',
              'localAndProductionBrowserAcceptance': True,
              'missingAuthoritativeCount': authority['missingAuthoritativeCount'],
              'displayStillContainsKanaCount': authority['displayStillContainsKanaCount'],
              'authorityCounts': authority['counts'],
              'siteAuditSummary': audit['summary'],
              'browserWarnings': acceptance.get('warnings', []),
          }
          Path('public/data/v22-final-acceptance.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git add public/data/v22-final-acceptance.json
          if git diff --cached --quiet; then
            echo "Acceptance proof already matches."
          else
            git commit -m "Record accepted safe V22 production state"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-safe-final-acceptance-${{ github.run_id }}
          path: |
            /tmp/v22-local-acceptance
            /tmp/v22-production-acceptance
            public/data/story-title-authority-report-v22.json
            public/data/story-title-authority-map-v22.json
            public/data/v22-site-audit.json
            public/data/v22-final-acceptance.json
            public/downloads/story-title-missing-authoritative-v22.tsv
            docs/V22_SITE_AUDIT.md
            .automation/v22-build-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Roll back an unaccepted safe product commit
        if: failure() && steps.push.outputs.pushed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ steps.base.outputs.sha }}'
          git fetch origin main
          lease="$(git rev-parse origin/main)"
          git push --force-with-lease=refs/heads/main:"$lease" origin "$base_sha":refs/heads/main
