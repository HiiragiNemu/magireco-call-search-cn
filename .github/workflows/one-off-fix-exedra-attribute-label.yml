name: One-off Exedra attribute label repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-off-fix-exedra-attribute-label.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair hard-coded attribute labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('public/index.html'): [
                  ('value="まどドラ">小圆前辈', 'value="まどドラ">Magia Exedra'),
                  ("['まどドラ', '小圆前辈']", "['まどドラ', 'Magia Exedra']"),
              ],
              Path('NEW/call.html'): [
                  ('value="まどドラ">小圆前辈', 'value="まどドラ">Magia Exedra'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-off workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/one-off-fix-exedra-attribute-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html NEW/call.html .github/workflows/one-off-fix-exedra-attribute-label.yml
          git diff --cached --check
          git commit -m "Fix Magia Exedra attribute label source mappings"
          git push origin HEAD:main
