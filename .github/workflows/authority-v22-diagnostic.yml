name: V22 final-source snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/authority-v22-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official CN patch source
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magireco-cn-patch
          path: _sources/magireco-cn-patch
          fetch-depth: 1

      - name: Checkout MagiReader source
        uses: actions/checkout@v4
        with:
          repository: HiiragiNemu/magi-reader
          path: _sources/magi-reader
          fetch-depth: 1

      - name: Checkout structured Chinese Wiki source when a cross-repository token is available
        if: ${{ env.WIKI_TOKEN != '' }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: HiiragiNemu/magireco-wiki-data
          path: _sources/magireco-wiki-data
          token: ${{ env.WIKI_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/catalog.json
            data/characters.json
            data/memoria.json
            data/pages_index.json
            data/story.json

      - name: Collect complete working snapshot
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/authority-v22-final-source"
          mkdir -p "$out/target-repo" "$out/sources"

          rsync -a \
            --exclude='.git/' \
            --exclude='_sources/' \
            --exclude='node_modules/' \
            ./ "$out/target-repo/"

          mkdir -p "$out/sources/cn-patch"
          cp -a _sources/magireco-cn-patch/magica/js/libs "$out/sources/cn-patch/libs"

          mkdir -p "$out/sources/magi-reader"
          for candidate in \
            _sources/magi-reader/website/public/story_index.json \
            _sources/magi-reader/website/public/data/titles.json \
            _sources/magi-reader/artifacts/exedra_portrait_title_catalog.json \
            _sources/magi-reader/artifacts/exedra_tw_manifest_titles.generated.json \
            _sources/magi-reader/artifacts/tw_title_coverage.audit.json; do
            if [[ -f "$candidate" ]]; then
              rel="${candidate#_sources/magi-reader/}"
              mkdir -p "$out/sources/magi-reader/$(dirname "$rel")"
              cp "$candidate" "$out/sources/magi-reader/$rel"
            fi
          done
          find _sources/magi-reader -type f -name 'titles.json' -size -25M -print0 | while IFS= read -r -d '' file; do
            rel="${file#_sources/magi-reader/}"
            mkdir -p "$out/sources/magi-reader/$(dirname "$rel")"
            cp "$file" "$out/sources/magi-reader/$rel"
          done

          if [[ -d _sources/magireco-wiki-data/data ]]; then
            mkdir -p "$out/sources/magireco-wiki-data/data"
            for file in catalog.json characters.json memoria.json pages_index.json story.json; do
              if [[ -f "_sources/magireco-wiki-data/data/$file" ]]; then
                cp "_sources/magireco-wiki-data/data/$file" "$out/sources/magireco-wiki-data/data/$file"
              fi
            done
            printf 'available\n' > "$out/sources/magireco-wiki-data/status.txt"
          else
            mkdir -p "$out/sources/magireco-wiki-data"
            printf 'unavailable: no usable cross-repository token in this repository\n' > "$out/sources/magireco-wiki-data/status.txt"
          fi

          git branch -r --format='%(refname:short)' | sort > "$out/remote-branches.txt"
          find .github/workflows -maxdepth 1 -type f -printf '%f\t%s\n' | sort > "$out/workflows.tsv"
          du -ah "$out" | sort -h > "$out/package-sizes.txt"

      - name: Upload final-source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: authority-v22-final-source-${{ github.run_id }}
          path: ${{ runner.temp }}/authority-v22-final-source
          retention-days: 3
          compression-level: 6

      - name: Record snapshot run id on main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          cat > .automation/authority-v22-final-source-run.json <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_sha": "${GITHUB_SHA}",
            "artifact_name": "authority-v22-final-source-${GITHUB_RUN_ID}"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/authority-v22-final-source-run.json
          git commit -m "Record final-source snapshot run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
