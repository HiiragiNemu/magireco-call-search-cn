name: Repair V5 rune OCR engine

on:
  push:
    branches:
      - fix/integrated-tools-v5-20260816
    paths:
      - .github/workflows/repair-rune-oem-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integrated-tools-v5-20260816
          fetch-depth: 0

      - name: Select the legacy OCR engine required by mdk/mdm traineddata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('public/myfile/runes-app.js')
          text = path.read_text(encoding='utf-8')
          old = "    worker = await global.Tesseract.createWorker(model, 1, {"
          new = "    worker = await global.Tesseract.createWorker(model, global.Tesseract.OEM?.TESSERACT_ONLY ?? 0, {"
          if old not in text:
              raise SystemExit('Fixed LSTM OEM call was not found.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check public/myfile/runes-app.js

      - name: Commit the legacy-engine correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-app.js
          git commit -m 'Use the legacy OCR engine required by Madoka traineddata'
          git push origin HEAD:fix/integrated-tools-v5-20260816
