name: Dispatch repaired complete V10 gate
# Full-height painted-selection expansion is now included in the staged recognizer.

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/dispatch-complete-v10.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-complete-v10.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/height-export-title-call-v10-20260817
