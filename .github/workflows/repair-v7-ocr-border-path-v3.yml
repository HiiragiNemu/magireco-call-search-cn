name: Finalize border-aware V7 OCR candidate selection

on:
  push:
    branches:
      - fix/story-ui-translation-ocr-v7-20260816
    paths:
      - .github/workflows/repair-v7-ocr-border-path-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ui-translation-ocr-v7-20260816
          fetch-depth: 0

      - name: Replace candidate and fallback regions by stable anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('public/myfile/runes-template-v7.js')
          text = path.read_text(encoding='utf-8')

          start_marker = '      const borderBonus = binary.removedRows + binary.removedColumns > 0 ? .04 : 0;'
          end_marker = '    return { best: candidates[0], candidates };'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'candidate anchors missing: start={start} end={end}')
          end += len(end_marker)
          candidate = '''      const removedLines = binary.removedRows + binary.removedColumns;
              const borderBonus = removedLines > 0 ? .11 : 0;
              result.letterCount = letterCount;
              result.uniqueCount = unique;
              result.removedLines = removedLines;
              result.score = result.confidence
                + Math.min(.18, letterCount / 150)
                + Math.min(.08, unique / 150)
                + borderBonus;
              result.binary = binary;
              result.removedRows = binary.removedRows;
              result.removedColumns = binary.removedColumns;
              candidates.push(result);
            }
            candidates.sort((a, b) => b.score - a.score);
            let best = candidates[0];
            if (layout !== 'chart') {
              const borderBest = candidates
                .filter((candidate) => candidate.removedLines > 0
                  && candidate.letterCount >= 3
                  && candidate.uniqueCount >= 3)
                .sort((a, b) => b.score - a.score)[0];
              if (borderBest && (borderBest.score >= best.score - .28
                || best.letterCount < 5
                || best.uniqueCount < 3)) {
                best = borderBest;
              }
            }
            return { best, candidates };'''
          text = text[:start] + candidate + text[end:]

          start_marker = "        const letters = best.text.replace(/[^A-Za-z]/g, '');"
          end_marker = "          return;\n        }"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'fallback anchors missing: start={start} end={end}')
          end += len(end_marker)
          fallback = '''        const letters = best.text.replace(/[^A-Za-z]/g, '');
              const uniqueLetters = new Set(letters.toLowerCase()).size;
              const minimum = effective === 'chart' ? 18 : 3;
              const borderAwareUsable = effective !== 'chart'
                && best.removedLines > 0
                && letters.length >= minimum
                && uniqueLetters >= 3;
              if (letters.length < minimum || (best.confidence < .18 && !borderAwareUsable)) {
                // Fall back only when template segmentation remains weak after
                // detected frame lines have already been removed.
                oldButton.hidden = false;
                oldButton.click();
                oldButton.hidden = true;
                Tools.setStatus(status, '模板分割置信度不足，已切换到经典模型。');
                return;
              }'''
          text = text[:start] + fallback + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          node --check public/myfile/runes-template-v7.js
          grep -Fq 'borderAwareUsable' public/myfile/runes-template-v7.js
          grep -Fq 'removedLines > 0' public/myfile/runes-template-v7.js

      - name: Commit OCR repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-template-v7.js
          git commit -m 'Keep usable border-cleaned template OCR results'
          git push origin HEAD:fix/story-ui-translation-ocr-v7-20260816
