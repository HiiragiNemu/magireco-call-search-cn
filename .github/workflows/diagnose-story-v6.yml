name: Diagnose story data sources V6

on:
  push:
    branches:
      - fix/story-ocr-layout-v6-20260816
    paths:
      - .github/workflows/diagnose-story-v6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe original pages and Google Apps Script services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/story-v6
          ORIGINAL='https://magireco-chara-search.vercel.app/index.html'
          SEARCH_API='https://script.google.com/macros/s/AKfycbz7rqYmZAcY-Cu0QG_XfcqH1JfRrgZXLkk7XRhU2Df7VYNNbOMBwwqrKdcqQQmokndm/exec'
          JSON_API='https://script.google.com/macros/s/AKfycby0a9kdaYzplRNKeFqTLPgy4sFwzcJ39dSs677Z5LXB2yK71lMhVTsKLy4-QkhB2D4h9A/exec'
          ATTENDANCE_API='https://script.google.com/macros/s/AKfycbyXrQPl-k-SPUxM4MFHkdlFgHQp3kUp7p3iZgaTIc4Hbu8_lghESfjjLOjFPJXTDGbd/exec'

          curl -L --fail --show-error --silent -D /tmp/story-v6/original.headers "$ORIGINAL?probe=$GITHUB_RUN_ID" -o /tmp/story-v6/original.html
          echo '--- Original page endpoints ---'
          grep -Eo 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' /tmp/story-v6/original.html | sort -u || true
          echo '--- Original page relevant script lines ---'
          grep -nE 'script\.google|ajax|fetch\(|JSONP|jsonp' /tmp/story-v6/original.html | tail -40 || true

          SEARCH_QUERY='and_or=AND&story_csv=%E9%AD%94%E6%B3%95%E5%B0%91%E5%A5%B3&netabare=false&chara_csv=%E7%92%B0%E3%81%84%E3%82%8D%E3%81%AF&star=true&keywordtext='
          set +e
          curl -L --show-error --silent --max-time 60 -D /tmp/story-v6/search.headers "$SEARCH_API?$SEARCH_QUERY" -o /tmp/story-v6/search.body
          SEARCH_EXIT=$?
          set -e
          echo "SEARCH_EXIT=$SEARCH_EXIT SEARCH_BYTES=$(wc -c </tmp/story-v6/search.body 2>/dev/null || echo 0)"
          sed -n '1,30p' /tmp/story-v6/search.headers || true
          head -c 500 /tmp/story-v6/search.body || true
          echo

          for STORY in \
            'メイン【第1部】' \
            'メイン【第2部】' \
            'アナザー【第1部】' \
            'アナザー【第2部】' \
            'ミラーズストーリー' \
            '魔法少女ストーリー' \
            '衣装ストーリー' \
            'イベントストーリー' \
            'スペシャル' \
            'EDムービー' \
            'アニメ'; do
            ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$STORY")"
            SAFE="$(echo "$STORY" | tr '/【】 ' '____')"
            set +e
            curl -L --show-error --silent --max-time 90 -D "/tmp/story-v6/json-${SAFE}.headers" "$JSON_API?story=$ENCODED" -o "/tmp/story-v6/json-${SAFE}.body"
            EXIT=$?
            set -e
            BYTES="$(wc -c <"/tmp/story-v6/json-${SAFE}.body" 2>/dev/null || echo 0)"
            echo "JSON story=$STORY exit=$EXIT bytes=$BYTES first=$(head -c 80 "/tmp/story-v6/json-${SAFE}.body" 2>/dev/null | tr '\n' ' ')"
          done

          ATTENDANCE_QUERY='gname=%E7%92%B0%E3%81%84%E3%82%8D%E3%81%AF'
          curl -L --fail --show-error --silent --max-time 60 -D /tmp/story-v6/attendance.headers "$ATTENDANCE_API?$ATTENDANCE_QUERY" -o /tmp/story-v6/attendance.body
          echo "ATTENDANCE_BYTES=$(wc -c </tmp/story-v6/attendance.body)"
          head -c 300 /tmp/story-v6/attendance.body
          echo

          python3 <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/story-v6')
          for path in sorted(root.glob('json-*.body')):
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  print(path.name, type(data).__name__, len(data) if hasattr(data,'__len__') else 'na')
              except Exception as exc:
                  print(path.name, 'INVALID_JSON', exc)
          for name in ['search.body','attendance.body']:
              path=root/name
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  print(name, type(data).__name__, len(data) if hasattr(data,'__len__') else 'na')
              except Exception as exc:
                  print(name, 'INVALID_JSON', exc)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-v6-diagnostics-${{ github.sha }}
          path: /tmp/story-v6
          if-no-files-found: warn
          retention-days: 14
