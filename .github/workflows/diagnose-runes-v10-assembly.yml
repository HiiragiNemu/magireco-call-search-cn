name: Diagnose V10 rune recognizer assembly

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/diagnose-runes-v10-assembly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-export-title-call-v10-20260817
      - name: Decode all staged chunks and inspect syntax
        shell: bash
        run: |
          set -u
          cat .automation/v10-final/runes-v10.js.b64.* | base64 -d > /tmp/runes-v10.js
          echo "decoded-bytes=$(wc -c < /tmp/runes-v10.js)"
          echo '--- lines 520-780 ---'
          nl -ba /tmp/runes-v10.js | sed -n '520,780p'
          echo '--- node syntax ---'
          node --check /tmp/runes-v10.js || true
