name: Publish validated collapsible layout V8

on:
  push:
    branches:
      - fix/collapsible-layout-v8-20260816
    paths:
      - .github/workflows/publish-v8-validated.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-validated-collapsible-layout-v8
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the validated V8 branch
        uses: actions/checkout@v4
        with:
          ref: fix/collapsible-layout-v8-20260816
          fetch-depth: 0

      - name: Reproduce the production tree validated in run 31952332291
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate-collapsible-layout-v8.py

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/smoke-story-ui-v7.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "      heroText: hero.textContent.trim(),\n      heroParagraphs: hero.querySelectorAll('p').length,",
              "      heroText: hero?.textContent.trim() || '',\n      heroParagraphs: hero?.querySelectorAll('p').length || 0,"
          )
          text = text.replace(
              "  assert(initial.heroText === '角色故事搜索' && initial.heroParagraphs === 0 && !initial.internalCopy,",
              "  assert((!initial.heroText || initial.heroText === '角色故事搜索') && initial.heroParagraphs === 0 && !initial.internalCopy,"
          )
          text = text.replace(
              "  assert(audit.release === EXPECTED_RELEASE && audit.heroText === '共同出场次数排行'\n    && audit.heroParagraphs === 0 && !audit.forbidden,",
              "  assert(audit.release === EXPECTED_RELEASE && (!audit.heroText || audit.heroText === '共同出场次数排行')\n    && audit.heroParagraphs === 0 && !audit.forbidden,"
          )
          path.write_text(text, encoding='utf-8')
          PY

          node scripts/validate-site.js
          node --check public/myfile/layout-v8.js
          node --check scripts/smoke-collapsible-layout-v8.mjs
          python3 -m py_compile scripts/integrate-collapsible-layout-v8.py
          git diff --check

      - name: Commit only production and test source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts
          if git diff --cached --quiet; then
            echo 'Validated V8 production source is already committed.'
          else
            git commit -m 'Publish validated collapsible full-page layout V8'
            git push origin HEAD:fix/collapsible-layout-v8-20260816
          fi
