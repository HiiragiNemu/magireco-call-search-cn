name: Dispatch V8 integration

on:
  push:
    branches:
      - fix/collapsible-layout-v8-20260816
    paths:
      - .github/workflows/dispatch-v8-integration.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the gated V8 integration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run integrate-collapsible-layout-v8.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/collapsible-layout-v8-20260816
