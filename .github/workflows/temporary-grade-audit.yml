name: Temporary static data audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-grade-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit character keys, grade inference, IDs, assets and local references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');

          function loadMap(file, variable) {
            const source = fs.readFileSync(file, 'utf8') + `\nglobalThis.__result = ${variable};`;
            const context = { console };
            vm.createContext(context);
            vm.runInContext(source, context, { filename: file });
            return context.__result;
          }

          const callTable = loadMap('public/myfile/callTable.js', 'callTable');
          const charaAttribute = loadMap('public/myfile/charaAt.js', 'charaAttribute');
          const html = fs.readFileSync('public/index.html', 'utf8');

          const inputs = [...html.matchAll(/<input\b[^>]*\bname=["']chara["'][^>]*>/g)].map(m => m[0]);
          const attr = (tag, name) => (tag.match(new RegExp(`\\b${name}=["']([^"']*)["']`)) || [])[1] || '';
          const ids = inputs.map(tag => attr(tag, 'id'));
          const values = inputs.map(tag => attr(tag, 'value'));
          const duplicateIds = [...new Set(ids.filter((id, i) => id && ids.indexOf(id) !== i))];

          const normalize = name => String(name || '')
            .replace(/\s+\(.+$/, '')
            .replace(/-眼镜ver$/, '(眼镜ver)')
            .replace(/^名小姐$/, '名字')
            .replace(/^水树塁$/, '水树垒')
            .trim();

          const htmlNames = new Map(values.map((value, i) => [normalize(value), { id: ids[i], value }]));
          const jsNames = new Map([...callTable.keys()].map(key => [normalize(key), key]));
          const missingCallTable = [...htmlNames.keys()].filter(k => !jsNames.has(k));
          const missingHtml = [...jsNames.keys()].filter(k => !htmlNames.has(k));

          const images = new Set(fs.readdirSync('public/img/png').filter(f => f.endsWith('.png')).map(f => f.slice(0, -4)));
          const missingImages = values
            .map(v => String(v).replace(/\s+\(.+$/, '').trim())
            .filter(name => name && !images.has(name));

          const schoolTokens = ['学校', '学園', '学院', '学舎', 'アカデミー', '中学', '高校', '高等'];
          const ambiguous = [];
          const missingGrade = [];
          for (const [longKey, details] of callTable) {
            const match = String(longKey).match(/\(([^/]+)/);
            const jp = match ? match[1].trim() : String(longKey);
            const grade = String(details.get('学年') || '').trim();
            const age = String(details.get('年龄') || details.get('年齢') || '').trim();
            const attrs = new Set();
            for (const [versionedName, set] of charaAttribute) {
              if (versionedName.startsWith(jp)) for (const a of set) attrs.add(a);
            }
            const schools = [...attrs].filter(a => schoolTokens.some(t => String(a).includes(t)));
            if (!grade || grade === '-' || grade === '?') {
              missingGrade.push({ longKey, jp, grade, age, schools, attrs: [...attrs] });
              const academyOnly = schools.filter(a => String(a).includes('学院') && !String(a).includes('中学') && !String(a).includes('高等'));
              if (academyOnly.length) ambiguous.push({ longKey, jp, grade, age, academyOnly, schools });
            }
          }

          const localRefs = [...html.matchAll(/(?:src|href)=["'](\.\/[^"'#?]+)[^"']*["']/g)].map(m => m[1]);
          const missingLocalRefs = [...new Set(localRefs.filter(ref => {
            const resolved = path.join('public', ref.replace(/^\.\//, ''));
            return !fs.existsSync(resolved);
          }))];

          const idMatches = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicateAllIds = [...new Set(idMatches.filter((id, i) => idMatches.indexOf(id) !== i))];

          console.log('AUDIT_JSON_START');
          console.log(JSON.stringify({
            counts: {
              htmlCharacters: inputs.length,
              callTableCharacters: callTable.size,
              charaAttributeEntries: charaAttribute.size,
              missingGrade: missingGrade.length,
              ambiguousAcademyInference: ambiguous.length
            },
            duplicateCharacterIds: duplicateIds,
            duplicateAllIds,
            missingCallTable,
            missingHtml,
            missingImages: [...new Set(missingImages)],
            missingLocalRefs,
            ambiguousAcademyInference: ambiguous,
            missingGrade
          }, null, 2));
          console.log('AUDIT_JSON_END');
          NODE
