name: One-shot fail-closed V26 closure

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v26-one-shot
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current production baseline before touching main
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://magireco-call-search-cn.pages.dev'
          nonce = str(time.time_ns())
          def get(path):
              sep = '&' if '?' in path else '?'
              req = urllib.request.Request(
                  f'{base}/{path}{sep}preflight={nonce}',
                  headers={'Cache-Control':'no-cache, no-store','User-Agent':'V26-one-shot-preflight'},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
              return raw
          story = get('story.html').decode('utf-8', 'replace')
          if 'v25-emergency-restored-20260822' not in story and 'v26-converged-20260822' not in story:
              raise RuntimeError('production is not a recognized healthy baseline')
          for path in (
              'data/character-catalog.json',
              'data/story-v6/manifest.json',
              'data/story-v6/variant-map.json',
              'data/story-v7/localization.json',
              'data/story-title-groups-v1.json',
          ):
              raw = get(path)
              if raw.lstrip().startswith((b'<!DOCTYPE', b'<html', b'<')):
                  raise RuntimeError(f'{path}: HTML instead of JSON')
              json.loads(raw.decode('utf-8'))
          print('Production preflight passed.')
          PY

      - name: Build complete V26 in the runner workspace
        run: |
          set -euo pipefail
          test -f scripts/v26-finalize-once.py
          python scripts/v26-finalize-once.py
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exercise all primary pages and story search locally
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public >/tmp/v26-local-http.log 2>&1 &
          echo $! >/tmp/v26-http.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/story.html >/dev/null && break
            sleep 1
          done
          python scripts/browser-smoke.py \
            --base http://127.0.0.1:4173 \
            --output /tmp/v26-local-browser-proof.json

      - name: Prove title-data failure cannot disable core story search
        run: |
          set -euo pipefail
          mv public/data/titles /tmp/v26-title-data-hidden
          restore_titles() {
            if [ -d /tmp/v26-title-data-hidden ]; then
              mv /tmp/v26-title-data-hidden public/data/titles
            fi
          }
          trap restore_titles EXIT
          python scripts/browser-smoke.py \
            --base http://127.0.0.1:4173 \
            --allow-title-runtime-error \
            --output /tmp/v26-fail-open-browser-proof.json
          restore_titles
          trap - EXIT
          python scripts/validate-production.py

      - name: Publish the fully tested tree atomically
        id: publish
        run: |
          set -euo pipefail
          if [ -f /tmp/v26-http.pid ]; then
            kill "$(cat /tmp/v26-http.pid)" 2>/dev/null || true
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete V26 architecture without product regressions'
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Wait for Cloudflare Pages and verify all V26 endpoints
        id: live_data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://magireco-call-search-cn.pages.dev'
          last_error = None
          for attempt in range(180):
              nonce = str(time.time_ns())
              def get(path):
                  sep = '&' if '?' in path else '?'
                  req = urllib.request.Request(
                      f'{base}/{path}{sep}verify={nonce}',
                      headers={'Cache-Control':'no-cache, no-store','User-Agent':'V26-one-shot-live'},
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.status, response.read()
              try:
                  _, marker_raw = get('v26-build-marker.json')
                  _, manifest_raw = get('data/titles/manifest.json')
                  _, titles_raw = get('data/titles/titles.json')
                  _, story_manifest_raw = get('data/story-v6/manifest.json')
                  _, catalog_raw = get('data/character-catalog.json')
                  _, story_raw = get('story.html')
                  _, runtime_raw = get('myfile/story-title-runtime-v2.js')
                  _, index_raw = get('index.html')
                  for label, raw in (
                      ('marker', marker_raw), ('manifest', manifest_raw), ('titles', titles_raw),
                      ('story manifest', story_manifest_raw), ('catalog', catalog_raw),
                  ):
                      if raw.lstrip().startswith((b'<!DOCTYPE', b'<html', b'<')):
                          raise RuntimeError(f'{label}: HTML instead of JSON')
                  marker = json.loads(marker_raw)
                  manifest = json.loads(manifest_raw)
                  titles = json.loads(titles_raw)
                  story_manifest = json.loads(story_manifest_raw)
                  catalog = json.loads(catalog_raw)
                  story = story_raw.decode('utf-8', 'replace')
                  runtime = runtime_raw.decode('utf-8', 'replace')
                  index = index_raw.decode('utf-8', 'replace')
                  assert marker['release'] == 'v26-converged-20260822'
                  assert manifest['release'] == 'v26-converged-20260822'
                  assert manifest['dataArchitecture'] == 'plain-json'
                  assert sum(len(v) for v in titles['titleByCategory'].values()) == 5826
                  assert story_manifest['totalRows'] == 14466
                  assert len(story_manifest['categories']) == 19
                  assert len(catalog) >= 180
                  assert 'v26-converged-20260822' in story
                  assert 'story-title-runtime-v26-20260822' in runtime
                  assert 'DecompressionStream' not in runtime
                  assert 'v25-title-delta' not in runtime
                  assert 'class="navtext-container"' not in index
                  assert 'hamburger-menu-v23.js' in index
                  print('Production V26 endpoint verification passed.')
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  if attempt == 179:
                      raise RuntimeError(last_error)
                  time.sleep(5)
          PY

      - name: Exercise deployed production in Chromium
        id: live_browser
        run: |
          set -euo pipefail
          python scripts/browser-smoke.py \
            --base https://magireco-call-search-cn.pages.dev \
            --output /tmp/v26-production-browser-proof.json

      - name: Preserve the successful release tag
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git tag -f v26-converged-20260822 "${{ steps.publish.outputs.product_sha }}"
          git push origin refs/tags/v26-converged-20260822 --force

      - name: Roll back the product commit if production verification fails
        if: failure() && steps.publish.outputs.product_sha != '' && (steps.live_data.outcome == 'failure' || steps.live_browser.outcome == 'failure')
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert --no-edit "${{ steps.publish.outputs.product_sha }}"
          git push origin HEAD:main

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-one-shot-closure-evidence
          path: |
            /tmp/v26-local-browser-proof.json
            /tmp/v26-fail-open-browser-proof.json
            /tmp/v26-production-browser-proof.json
            /tmp/v26-local-http.log
          if-no-files-found: ignore
          retention-days: 30
