name: Repair V10 height-label acceptance selector

on:
  push:
    branches:
      - fix/height-export-title-call-v10-20260817
    paths:
      - .github/workflows/repair-v10-height-label-smoke.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-export-title-call-v10-20260817
          fetch-depth: 0
      - name: Query the actual rendered X-axis label class
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('scripts/smoke-complete-v10.mjs')
          text=path.read_text(encoding='utf-8')
          old="labels: [...document.querySelectorAll('.height-x-axis-label-v2')].map((node) => node.textContent.trim()),"
          new="labels: [...document.querySelectorAll('.height-x-label-v2')].map((node) => node.textContent.trim()),"
          if text.count(old)!=1:
              raise SystemExit(f'Expected one obsolete label selector, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/smoke-complete-v10.mjs
          grep -Fq "querySelectorAll('.height-x-label-v2')" scripts/smoke-complete-v10.mjs
      - name: Commit the acceptance correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-complete-v10.mjs
          git commit -m 'Use the rendered V10 height category-label selector'
          git push origin HEAD:fix/height-export-title-call-v10-20260817
      - name: Dispatch the complete V10 gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-complete-v10.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/height-export-title-call-v10-20260817
