name: Repair height-guide V4 desktop acceptance V2

on:
  push:
    branches:
      - fix/height-guide-v4-20260816
    paths:
      - .github/workflows/repair-height-guide-v4-desktop-acceptance-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/height-guide-v4-20260816
          fetch-depth: 0

      - name: Patch desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch-desktop-v4.py
          python3 /tmp/patch-desktop-v4.py
          node --check scripts/smoke-height-guide-v4.mjs

      - name: Commit corrected desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-height-guide-v4.mjs
          git commit -m 'Test all height lines when every desktop character is visible'
          git push origin HEAD:fix/height-guide-v4-20260816
