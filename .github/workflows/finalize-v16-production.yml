name: Finalize and verify V16 production

on:
  push:
    branches: [main]
    paths:
      - .automation/finalize-v16-production-trigger.txt

permissions:
  contents: write

concurrency:
  group: finalize-v16-production-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize branch and regenerate authoritative data
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/build-story-title-groups-v1.py
          python3 -m py_compile scripts/build-story-title-groups-v1.py
          node --check public/myfile/runes-fix-v14.js
          node --check public/myfile/runes-chart-v15.js
          node --check public/myfile/runes-glyph-v16.js
          node --check public/myfile/story-grouped-results-v15.js
          node --check public/myfile/story-title-password-v1.js
          node --check public/myfile/live-fixes-v12.js
          node --check public/myfile/tools-suite.js
          node --check public/myfile/layout-v8.js
          node --check scripts/smoke-v16-delivery.mjs

      - name: Validate generated checklist, downloads, password gate and menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          groups_path = Path('public/data/story-title-groups-v1.json')
          report_path = Path('public/data/story-title-build-report-v1.json')
          map_path = Path('public/data/story-title-map.generated.json')
          json_download = Path('public/downloads/story-title-groups.json')
          csv_path = Path('public/downloads/story-title-groups.csv')
          xlsx_path = Path('public/downloads/story-title-groups.xlsx')

          groups = json.loads(groups_path.read_text(encoding='utf-8'))
          report = json.loads(report_path.read_text(encoding='utf-8'))
          exact_map = json.loads(map_path.read_text(encoding='utf-8'))
          downloaded = json.loads(json_download.read_text(encoding='utf-8'))
          summary = groups['summary']

          assert report['state'] == 'pass', report
          assert summary['totalRows'] == 14466, summary
          assert summary['categoryCount'] == 19, summary
          assert summary['parentGroups'] == 1443, summary
          assert summary['childTitles'] == 5710, summary
          assert downloaded['sourceDigest'] == groups['sourceDigest']
          assert exact_map['version'] == 1

          aquarium = next(g for g in groups['groups'] if g['category'] == 'イベント' and g['source_base'] == 'ウワサアクアリウムへようこそ')
          assert aquarium['child_count'] == 21, aquarium['child_count']
          assert any(c['source_title'].endswith('5話') for c in aquarium['children'])

          assert csv_path.read_bytes().startswith(b'\xef\xbb\xbf')
          with csv_path.open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.reader(f))
          assert len(rows) == summary['parentGroups'] + 1, len(rows)
          assert any('ウワサアクアリウムへようこそ' in cell for row in rows for cell in row)

          assert xlsx_path.read_bytes().startswith(b'PK')
          assert xlsx_path.stat().st_size > 100000
          with zipfile.ZipFile(xlsx_path) as zf:
              assert zf.testzip() is None
              workbook = ET.fromstring(zf.read('xl/workbook.xml'))
              ns = {'m': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'r': 'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
              names = [node.attrib['name'] for node in workbook.findall('m:sheets/m:sheet', ns)]
              assert names == ['标题翻译', '子剧情明细', '分类统计', '使用说明'], names
              sheet1 = ET.fromstring(zf.read('xl/worksheets/sheet1.xml'))
              row_count = len(sheet1.findall('.//m:sheetData/m:row', ns))
              assert row_count == summary['parentGroups'] + 1, row_count
              all_text = b' '.join(zf.read(name) for name in zf.namelist() if name.endswith('.xml'))
              assert '乌ワサアクアリウムへようこそ'.encode('utf-8') not in all_text
              assert 'ウワサアクアリウムへようこそ'.encode('utf-8') in all_text

          runes = Path('public/runes.html').read_text(encoding='utf-8')
          assert 'rune-glyph-color-chart-v16-20260818' in runes
          assert 'runes-fix-v14.js' in runes and 'runes-chart-v15.js' in runes and 'runes-glyph-v16.js' in runes
          assert '<title>魔女文翻译</title>' in runes

          editor = Path('public/story-title-editor.html').read_text(encoding='utf-8')
          assert 'story-title-password-v1.js' in editor
          assert './data/story-title-groups-v1.json' in editor
          password = Path('public/myfile/story-title-password-v1.js').read_text(encoding='utf-8')
          assert 'af20a4cdb149e87bd038f3abdb309393a087c451718d7927780afe6e80c8279a' in password
          assert 'hourglass' not in password

          index = Path('public/index.html').read_text(encoding='utf-8')
          assert '母故事标题翻译清单（管理员）' in index
          assert '魔女文翻译' in index
          tools = Path('public/myfile/tools-suite.js').read_text(encoding='utf-8')
          layout = Path('public/myfile/layout-v8.js').read_text(encoding='utf-8')
          assert '魔女文翻译' in tools and '魔女文翻译' in layout

          for fixture in [
              'tests/fixtures/runes/charlotte-complex-background.png',
              'tests/fixtures/runes/ornamental-black-background.jpg',
              'tests/fixtures/runes/madokarunes-alphabet-with-labels.jpg'
          ]:
              assert Path(fixture).is_file(), fixture

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit regenerated outputs when required
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/data/story-title-groups-v1.json \
            public/data/story-title-map.generated.json \
            public/data/story-title-build-report-v1.json \
            public/downloads/story-title-groups.json \
            public/downloads/story-title-groups.csv \
            public/downloads/story-title-overrides-template.json \
            docs/story-title-groups-v1.md
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Align final V16 generated parent-story data'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              python3 scripts/build-story-title-groups-v1.py
              git add \
                public/data/story-title-groups-v1.json \
                public/data/story-title-map.generated.json \
                public/data/story-title-build-report-v1.json \
                public/downloads/story-title-groups.json \
                public/downloads/story-title-groups.csv \
                public/downloads/story-title-overrides-template.json \
                docs/story-title-groups-v1.md
              git commit --amend --no-edit
              test "$attempt" != 3 || exit 1
            done
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for matching Cloudflare Pages deployment
        shell: bash
        env:
          BASE_URL: https://magireco-call-search-cn.pages.dev
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 180); do
            q="${GITHUB_RUN_ID}-${n}-$(date +%s%N)"
            if curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/runes.html?v=$q" -o /tmp/live-runes.html \
              && curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/story-title-editor.html?v=$q" -o /tmp/live-editor.html \
              && curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/index.html?v=$q" -o /tmp/live-index.html \
              && curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/data/story-title-groups-v1.json?v=$q" -o /tmp/live-groups.json \
              && curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/downloads/story-title-groups.csv?v=$q" -o /tmp/live-groups.csv \
              && curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE_URL/downloads/story-title-groups.xlsx?v=$q" -o /tmp/live-groups.xlsx \
              && grep -Fq 'rune-glyph-color-chart-v16-20260818' /tmp/live-runes.html \
              && grep -Fq 'story-title-password-v1.js' /tmp/live-editor.html \
              && grep -Fq '母故事标题翻译清单（管理员）' /tmp/live-index.html \
              && python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/live-groups.json').read_text(encoding='utf-8'))
          assert data['summary']['totalRows'] == 14466
          assert data['summary']['parentGroups'] == 1443
          assert data['summary']['childTitles'] == 5710
          assert Path('/tmp/live-groups.csv').read_bytes().startswith(b'\xef\xbb\xbf')
          assert Path('/tmp/live-groups.xlsx').read_bytes().startswith(b'PK')
          assert Path('/tmp/live-groups.xlsx').stat().st_size > 100000
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

      - name: Install production browser smoke dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run live browser acceptance with all three supplied rune scenes
        shell: bash
        env:
          BASE_URL: https://magireco-call-search-cn.pages.dev
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_URL="$BASE_URL" CHROME_PATH="$CHROME" node scripts/smoke-v16-delivery.mjs | tee /tmp/v16-production-smoke.txt
          grep -Fq '"state": "pass"' /tmp/v16-production-smoke.txt
          grep -Fq 'CHARLOTTE' /tmp/v16-production-smoke.txt
          grep -Fq 'ICHTOTEMICH' /tmp/v16-production-smoke.txt
          grep -Fq 'abcdefg' /tmp/v16-production-smoke.txt
          grep -Fq 'hijklmn' /tmp/v16-production-smoke.txt
          grep -Fq 'opqrstu' /tmp/v16-production-smoke.txt
          grep -Fq 'vwxyz' /tmp/v16-production-smoke.txt

      - name: Record successful production acceptance and remove one-shot controls
        shell: bash
        env:
          TESTED_SHA: ${{ steps.generated.outputs.tested_sha }}
        run: |
          set -euo pipefail
          mkdir -p .github/validation
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          groups = json.loads(Path('public/data/story-title-groups-v1.json').read_text(encoding='utf-8'))
          data = {
              'release': 'rune-glyph-color-chart-v16-20260818',
              'state': 'pass',
              'production': 'https://magireco-call-search-cn.pages.dev',
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'testedCommit': os.environ.get('TESTED_SHA') or os.environ['GITHUB_SHA'],
              'validatedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'storySummary': groups['summary'],
              'checks': [
                  'charlotte-complex-background-equals-CHARLOTTE',
                  'ornamental-black-background-equals-ICHTOTEMICH',
                  'alphabet-chart-ignores-latin-label-interference',
                  'parent-story-checklist-1443-groups-5710-child-titles',
                  'aquarium-parent-one-edit-covers-21-child-titles',
                  'json-csv-xlsx-downloads-return-real-file-bytes',
                  'editor-write-controls-locked-by-hourglass-password-hash',
                  'homepage-hamburger-menu-includes-admin-editor',
                  'story-search-loads-parent-title-runtime-and-collapsible-groups',
                  'production-browser-has-no-fatal-javascript-errors'
              ]
          }
          Path('.github/validation/v16-production.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f .automation/finalize-v16-production-trigger.txt
          rm -f .automation/v16-verify-trigger.txt
          rm -f .github/workflows/finalize-v16-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record final V16 production acceptance'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
            test "$attempt" != 3 || exit 1
          done

      - name: Upload final production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-v16-production-evidence-${{ github.run_id }}
          path: |
            /tmp/live-runes.html
            /tmp/live-editor.html
            /tmp/live-index.html
            /tmp/live-groups.json
            /tmp/live-groups.csv
            /tmp/live-groups.xlsx
            /tmp/v16-production-smoke.txt
            /tmp/v16-*.png
            .github/validation/v16-production.json
          if-no-files-found: warn
          retention-days: 30
