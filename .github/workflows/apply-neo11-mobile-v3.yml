name: Apply Neo11 mobile V3

on:
  push:
    branches:
      - fix/neo11-mobile-v3-20260816
    paths:
      - public/myfile/site-correction-v3.css
      - public/myfile/site-correction-v3-network.js
      - public/myfile/site-correction-v3-height.js
      - scripts/smoke-neo11-v3.mjs
      - scripts/validate-site.js
      - .github/workflows/site-validation.yml
      - .github/workflows/verify-production.yml
      - .github/workflows/apply-neo11-mobile-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-neo11-mobile-v3
  cancel-in-progress: false

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/neo11-mobile-v3-20260816
          fetch-depth: 0

      - name: Integrate V3 assets into the production entry
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          release = 'neo11-mobile-interaction-v3-20260816'

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          css_anchor = '\t<link rel="stylesheet" href="./myfile/site-correction-v2.css">'
          css_ref = '\t<link rel="stylesheet" href="./myfile/site-correction-v3.css">'
          js_anchor = '<script src="./myfile/site-correction-v2.js"></script>'
          js_refs = (
              '<script src="./myfile/site-correction-v3-network.js"></script>\n'
              '<script src="./myfile/site-correction-v3-height.js"></script>'
          )
          if index.count(css_anchor) != 1:
              raise SystemExit(f'Expected one V2 CSS anchor, found {index.count(css_anchor)}')
          if index.count(js_anchor) != 1:
              raise SystemExit(f'Expected one V2 JS anchor, found {index.count(js_anchor)}')
          if css_ref not in index:
              index = index.replace(css_anchor, css_anchor + '\n' + css_ref, 1)
          if 'site-correction-v3-network.js' not in index:
              index = index.replace(js_anchor, js_anchor + '\n' + js_refs, 1)
          index = index.replace('data-build="layout-correction-v2-20260816"', f'data-build="{release}"')
          index = index.replace('data-build="mobile-overhaul-20260816"', f'data-build="{release}"')
          if index.count(f'data-build="{release}"') != 1:
              raise SystemExit('Production build marker was not updated exactly once.')
          for marker in [
              './myfile/site-correction-v3.css',
              './myfile/site-correction-v3-network.js',
              './myfile/site-correction-v3-height.js'
          ]:
              if index.count(marker) != 1:
                  raise SystemExit(f'Expected one production reference for {marker}, found {index.count(marker)}')
          index_path.write_text(index, encoding='utf-8')

          info_path = Path('public/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info['release'] = release
          info['rollbackBeforeNeo11V3'] = 'rollback/pre-neo11-mobile-v3-20260816'
          info['productionEntry'] = 'public/index.html'
          info['deploymentTarget'] = 'magireco-call-search-cn.pages.dev'
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          acceptance_path = Path('public/__acceptance.html')
          acceptance = acceptance_path.read_text(encoding='utf-8')
          acceptance = acceptance.replace(
              "const EXPECTED_RELEASE = 'layout-correction-v2-20260816';",
              f"const EXPECTED_RELEASE = '{release}';"
          )
          if acceptance.count(f"const EXPECTED_RELEASE = '{release}';") != 1:
              raise SystemExit('Acceptance release marker was not updated exactly once.')
          acceptance_path.write_text(acceptance, encoding='utf-8')

          validate_path = Path('scripts/validate-site.js')
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace("'selectedEdges',", "'selectConnectedEdges: true',")
          validate_path.write_text(validate, encoding='utf-8')

          smoke_path = Path('scripts/smoke-neo11-v3.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          smoke = smoke.replace("waitUntil: 'networkidle0'", "waitUntil: 'domcontentloaded'")
          smoke = smoke.replace(
              "const relationY = Math.max(200, Math.min(innerHeight - 120, relationRect.top + 120));",
              "const relationY = Math.max(200, Math.min(724, relationRect.top + 120));"
          )
          drag_anchor = "  const dragData = await page.evaluate(() => {\n"
          drag_prep = (
              "  await page.evaluate(() => {\n"
              "    const host = document.getElementById('mynetwork');\n"
              "    if (host) host.scrollIntoView({ block: 'center', inline: 'center' });\n"
              "  });\n"
              "  await sleep(350);\n"
          )
          if drag_prep not in smoke:
              smoke = smoke.replace(drag_anchor, drag_prep + drag_anchor, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

      - name: Static and syntax validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.js
          node --check public/myfile/site-correction-v3-network.js
          node --check public/myfile/site-correction-v3-height.js
          node --check scripts/smoke-neo11-v3.mjs

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run local Neo11 and desktop browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --directory public >/tmp/neo11-v3-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            sleep .25
          done
          BASE_URL='http://127.0.0.1:8000' CHROME_PATH="$CHROME" \
            node scripts/smoke-neo11-v3.mjs | tee /tmp/neo11-v3-local-report.txt
          grep -Fq '"state": "pass"' /tmp/neo11-v3-local-report.txt

      - name: Commit only the tested integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/index.html \
            public/build-info.json \
            public/__acceptance.html \
            scripts/validate-site.js \
            scripts/smoke-neo11-v3.mjs
          if git diff --cached --quiet; then
            echo 'Neo11 V3 is already integrated and tested.'
          else
            git commit -m 'Integrate and validate Neo11 mobile V3 production'
            git push origin HEAD:fix/neo11-mobile-v3-20260816
          fi

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo11-v3-prepublication-${{ github.sha }}
          path: |
            /tmp/neo11-v3-local-report.txt
            /tmp/neo11-v3-mobile.png
            /tmp/neo11-v3-desktop.png
            /tmp/neo11-v3-http.log
          if-no-files-found: warn
          retention-days: 30
