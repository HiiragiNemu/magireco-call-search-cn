name: Validate static site

on:
  push:
    branches:
      - main
      - fix/live-fix-v12-20260818
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(python3 -c "import json; print(json.load(open('public/build-info.json',encoding='utf-8')).get('release',''))")"
          echo "release=$RELEASE"
          if [ "$RELEASE" = 'live-regression-repair-v12-20260818' ]; then
            node scripts/validate-v12.mjs
          else
            node scripts/validate-site.js
          fi

          for file in \
            public/myfile/myCommon.js \
            public/myfile/mgirlNarrow.js \
            public/myfile/mgirlCallNarrow.js \
            public/myfile/mgirlAtSearch.js \
            public/myfile/gradeOverrides.js \
            public/myfile/grade-classification.js \
            public/myfile/site-overhaul.js \
            public/myfile/site-correction-v2.js \
            public/myfile/site-correction-v3-network.js \
            public/myfile/site-correction-v3-height.js \
            public/myfile/site-correction-v4.js \
            public/myfile/tools-suite.js \
            public/myfile/triple-tap-filter.js \
            public/myfile/story-app-v7.js \
            public/myfile/attendance-app-v7.js \
            public/myfile/runes-app.js \
            public/myfile/runes-template-v7.js \
            public/myfile/runes-mask-v9.js \
            public/myfile/layout-v8.js \
            public/myfile/call-ui-v10.js \
            public/myfile/height-export-v11.js \
            public/myfile/live-fixes-v11.js \
            public/myfile/live-fixes-v12.js \
            scripts/smoke-neo11-v3.mjs \
            scripts/smoke-height-guide-v4.mjs \
            scripts/smoke-integrated-tools-v5.mjs \
            scripts/smoke-story-ui-v7.mjs \
            scripts/smoke-collapsible-layout-v8.mjs \
            scripts/smoke-complete-v10.mjs \
            scripts/smoke-live-v12.mjs; do
            test -s "$file"
            node --check "$file"
          done

          python3 -m py_compile scripts/integrate-live-v12.py
          git diff --check
