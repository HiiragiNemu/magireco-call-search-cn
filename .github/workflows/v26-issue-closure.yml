name: Complete V26 safely from an explicit issue trigger

"on":
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: magireco-call-search-v26-final-closure
  cancel-in-progress: true

jobs:
  complete:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[V26 FINAL CLOSURE]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cancel obsolete runs and confirm repository invariants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          current = int(os.environ["GITHUB_RUN_ID"])
          data = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/runs?per_page=100"], text=True))
          for run in data.get("workflow_runs", []):
              run_id = int(run.get("id", 0))
              if run_id == current or run.get("status") not in {"queued", "in_progress", "waiting", "requested"}:
                  continue
              subprocess.run(["gh", "api", "--method", "POST", f"repos/{repo}/actions/runs/{run_id}/cancel"], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          PY
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          test -f scripts/v26-finalize-once.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/v26-finalize-once.py")
          text = path.read_text(encoding="utf-8")
          old_sample = '("scene0", "サイドストーリー Film.0"): "支线故事 Film.0",'
          new_sample = '("scene0", "サイドストーリー Film.0 1 (紫)"): "支线故事 Film.0 1 （紫色）",'
          if old_sample not in text:
              raise SystemExit("expected obsolete scene0 sample was not found")
          text = text.replace(old_sample, new_sample)
          text = text.replace(
              'if runtime_info["mappedTitles"] < 1:',
              'if runtime_info["runtimeError"] is None:'
          )
          text = text.replace(
              'raise AssertionError("base localization did not load during fail-open test")',
              'raise AssertionError("fail-open test did not exercise the missing title-data path")'
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/v26-finalize-once.py

      - name: Verify current production is healthy before any product change
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base = "https://magireco-call-search-cn.pages.dev"
          nonce = str(time.time_ns())
          def get(path):
              req = urllib.request.Request(f"{base}/{path}?preflight={nonce}", headers={"Cache-Control":"no-cache, no-store","User-Agent":"V26-safe-preflight"})
              with urllib.request.urlopen(req, timeout=60) as response: return response.read()
          story = get("story.html").decode("utf-8", "replace")
          if "v25-emergency-restored-20260822" not in story and "v26-converged-20260822" not in story:
              raise RuntimeError("production story page is not a recognized healthy release")
          for path in ("data/character-catalog.json", "data/story-v6/manifest.json", "data/story-v6/variant-map.json", "data/story-v7/localization.json", "data/story-title-groups-v1.json"):
              raw = get(path)
              if raw.lstrip().startswith((b"<!DOCTYPE", b"<html", b"<")): raise RuntimeError(f"{path}: returned HTML")
              json.loads(raw.decode("utf-8"))
          assert json.loads(get("data/story-v6/manifest.json"))["totalRows"] == 14466
          print("Production preflight passed.")
          PY

      - name: Build the complete V26 tree without touching production
        run: |
          set -euo pipefail
          python scripts/v26-finalize-once.py
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-app-v7.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exercise complete V26 locally
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public >/tmp/v26-local-http.log 2>&1 &
          echo $! >/tmp/v26-http.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/story.html >/dev/null && break
            sleep 1
          done
          python scripts/browser-smoke.py --base http://127.0.0.1:4173 --output /tmp/v26-local-browser-proof.json

      - name: Prove title-data failure cannot disable core story search
        run: |
          set -euo pipefail
          mv public/data/titles /tmp/v26-title-data-hidden
          restore_titles() {
            if [ -d /tmp/v26-title-data-hidden ]; then mv /tmp/v26-title-data-hidden public/data/titles; fi
          }
          trap restore_titles EXIT
          python scripts/browser-smoke.py --base http://127.0.0.1:4173 --allow-title-runtime-error --output /tmp/v26-fail-open-browser-proof.json
          restore_titles
          trap - EXIT
          python scripts/validate-production.py

      - name: Publish one validated atomic product commit
        id: publish
        run: |
          set -euo pipefail
          kill "$(cat /tmp/v26-http.pid)" 2>/dev/null || true
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Complete V26 architecture without regressing existing tools"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Wait for Cloudflare Pages and verify deployed V26 data
        id: live_data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          base = "https://magireco-call-search-cn.pages.dev"
          last = None
          for attempt in range(180):
              nonce = str(time.time_ns())
              def get(path):
                  sep = "&" if "?" in path else "?"
                  req = urllib.request.Request(f"{base}/{path}{sep}verify={nonce}", headers={"Cache-Control":"no-cache, no-store","User-Agent":"V26-live-verify"})
                  with urllib.request.urlopen(req, timeout=60) as response: return response.read()
              try:
                  marker = json.loads(get("v26-build-marker.json"))
                  manifest = json.loads(get("data/titles/manifest.json"))
                  titles = json.loads(get("data/titles/titles.json"))
                  story_manifest = json.loads(get("data/story-v6/manifest.json"))
                  catalog = json.loads(get("data/character-catalog.json"))
                  story = get("story.html").decode("utf-8", "replace")
                  editor = get("story-title-editor.html").decode("utf-8", "replace")
                  runtime = get("myfile/story-title-runtime-v2.js").decode("utf-8", "replace")
                  index = get("index.html").decode("utf-8", "replace")
                  css = get("myfile/hamburgerMenu.css").decode("utf-8", "replace")
                  assert marker["release"] == "v26-converged-20260822"
                  assert manifest["release"] == "v26-converged-20260822" and manifest["dataArchitecture"] == "plain-json"
                  assert sum(len(v) for v in titles["titleByCategory"].values()) == 5826
                  assert story_manifest["totalRows"] == 14466 and len(story_manifest["categories"]) == 19 and len(catalog) >= 180
                  assert "v26-converged-20260822" in story and "v26-converged-20260822" in editor
                  assert "20260822-v26-final3" in story and "20260822-v26-final3" in editor
                  assert "story-title-runtime-v26-20260822" in runtime and "DecompressionStream" not in runtime and "v25-title-delta" not in runtime
                  assert 'class="navtext-container"' not in index and "hamburger-menu-v23.js?v=20260822-v26-final3" in index
                  assert "width: max-content;" in css and "min-width:" not in css
                  for old in ("data/v25-title-delta.part-00.txt", "__acceptance.html", "json_open_old.html", "oldfile/index.html"):
                      try:
                          get(old)
                          raise AssertionError(f"obsolete public file still exists: {old}")
                      except urllib.error.HTTPError as exc:
                          assert exc.code == 404, (old, exc.code)
                  print("Production V26 data verification passed.")
                  break
              except Exception as exc:
                  last = repr(exc)
                  if attempt == 179: raise RuntimeError(last)
                  time.sleep(5)
          PY

      - name: Exercise deployed V26 and all preserved tools in Chromium
        id: live_browser
        run: |
          set -euo pipefail
          python scripts/browser-smoke.py --base https://magireco-call-search-cn.pages.dev --output /tmp/v26-production-browser-proof.json

      - name: Preserve successful release and close audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          product_sha="${{ steps.publish.outputs.product_sha }}"
          git fetch origin main --tags
          git tag -f v26-converged-20260822 "$product_sha"
          git push origin refs/tags/v26-converged-20260822 --force
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "V26 production closure passed. Product commit: $product_sha"
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Roll back if the deployed product fails verification
        if: failure() && steps.publish.outputs.product_sha != '' && (steps.live_data.outcome == 'failure' || steps.live_browser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert --no-edit "${{ steps.publish.outputs.product_sha }}"
          git push origin HEAD:main
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "V26 deployment verification failed and the atomic product commit was reverted."
          fi

      - name: Report failure before publication
        if: failure() && steps.publish.outputs.product_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "V26 pre-publication validation failed. Production was not changed."
          fi

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-final-closure-evidence
          path: |
            /tmp/v26-local-browser-proof.json
            /tmp/v26-fail-open-browser-proof.json
            /tmp/v26-production-browser-proof.json
            /tmp/v26-local-http.log
          if-no-files-found: ignore
          retention-days: 30
