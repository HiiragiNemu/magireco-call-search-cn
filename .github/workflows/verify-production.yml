name: Verify production deployment

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - docs/story-title-self-translations-v10.md
      - scripts/smoke-neo11-v3.mjs
      - scripts/smoke-height-guide-v4.mjs
      - scripts/smoke-integrated-tools-v5.mjs
      - scripts/smoke-story-ui-v7.mjs
      - scripts/smoke-collapsible-layout-v8.mjs
      - scripts/smoke-complete-v10.mjs
      - .github/workflows/verify-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages to serve complete V10
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          EXPECTED='height-export-title-call-rune-v10-20260817'
          ACTUAL="$(python3 -c "import json; print(json.load(open('public/build-info.json',encoding='utf-8'))['release'])")"
          test "$ACTUAL" = "$EXPECTED"

          ready=0
          for attempt in $(seq 1 180); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            echo "Production probe ${attempt}/180 for ${EXPECTED}"
            if curl -LfsS --connect-timeout 10 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$BASE/build-info.json?verify=$nonce" -o /tmp/live-build-info.json \
              && grep -Fq "\"release\": \"$EXPECTED\"" /tmp/live-build-info.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$BASE/data/story-v7/localization.json?verify=$nonce" -o /tmp/live-localization.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$BASE/data/story-v10/title-audit.json?verify=$nonce" -o /tmp/live-title-audit.json \
              && python3 - <<'PY'
          import json
          build=json.load(open('/tmp/live-build-info.json',encoding='utf-8'))
          localization=json.load(open('/tmp/live-localization.json',encoding='utf-8'))
          audit=json.load(open('/tmp/live-title-audit.json',encoding='utf-8'))
          assert build['release']=='height-export-title-call-rune-v10-20260817'
          assert build['rollbackBeforeHeightExportTitleCallRuneV10']=='rollback/pre-height-export-title-call-v10-20260817'
          assert build['callQuickRail']=='nine-Chinese-actions'
          assert build['heightScaleDisplayedRange']=='50-250-percent'
          assert build['runeMaskMeaning']=='expanded-selection-region-not-exact-pixel-clipping'
          assert build['runePaintedLineDecoder']=='template-dynamic-programming-with-noise-skips'
          summary=localization['titleAuditV10']
          assert summary['uniqueSourceTitles']==5710
          assert summary['localizedSourceTitles']==5710
          assert summary['categoryTitlePairs']==5826
          assert summary['selfTranslatedTitles']==len(audit['selfTranslations'])
          assert sum(len(values) for values in localization['titleByCategoryV10'].values())==5826
          assert localization['titleExact']['神浜スパアドベンチャー ビーチに渦巻く悪魔の怨嗟 3話'].startswith('神滨SPA大冒险')
          PY
            then
              page_ok=1
              for route in '' story.html attendance.html runes.html; do
                output="/tmp/live-${route:-index.html}"
                if ! curl -LfsS --connect-timeout 10 --max-time 60 \
                    -H 'Cache-Control: no-cache, no-store, max-age=0' \
                    -H 'Pragma: no-cache' \
                    "$BASE/${route}?verify=$nonce" -o "$output" \
                  || ! grep -Fq "data-build=\"$EXPECTED\"" "$output" \
                  || ! grep -Fq './myfile/layout-v8.css' "$output" \
                  || ! grep -Fq './myfile/layout-v8.js' "$output"; then
                  page_ok=0
                  break
                fi
              done
              if [ "$page_ok" -eq 1 ] \
                && grep -Fq './myfile/site-correction-v10.css' /tmp/live-index.html \
                && grep -Fq './myfile/call-ui-v10.js' /tmp/live-index.html \
                && grep -Fq './myfile/height-export-v10.js' /tmp/live-index.html \
                && grep -Fq './myfile/story-app-v7.js' /tmp/live-story.html \
                && grep -Fq './myfile/runes-v10.css' /tmp/live-runes.html \
                && grep -Fq './myfile/runes-v10.js' /tmp/live-runes.html \
                && grep -Fq './myfile/runes-line-v10.js' /tmp/live-runes.html; then
                ready=1
                break
              fi
            fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Cloudflare Pages did not expose complete V10 within the verification window.' >&2
            cat /tmp/live-build-info.json 2>/dev/null || true
            grep -E 'data-build|v10|runes-line' /tmp/live-index.html /tmp/live-runes.html 2>/dev/null | head -120 || true
            exit 1
          fi

          for asset in \
            myfile/layout-v8.css \
            myfile/layout-v8.js \
            myfile/call-ui-v10.js \
            myfile/site-correction-v10.css \
            myfile/height-export-v10.js \
            myfile/runes-mask-v9.css \
            myfile/runes-mask-v9.js \
            myfile/runes-v10.css \
            myfile/runes-v10.js \
            myfile/runes-line-v10.js \
            myfile/runes-template-v7.js \
            myfile/runes-app.js \
            myfile/story-app-v7.js \
            data/story-v7/localization.json \
            data/story-v10/title-audit.json \
            data/story-v6/manifest.json \
            mdkOCR/mdk.traineddata \
            mdkOCR/mdm.traineddata \
            mdkOCR/madokarunes.jpg; do
            output="/tmp/live-$(echo "$asset" | tr '/' '-')"
            curl -LfsS --connect-timeout 10 --max-time 120 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$BASE/$asset?verify=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$output"
            test -s "$output"
          done

      - name: Install browser driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run all live regressions and complete V10 acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE='https://magireco-call-search-cn.pages.dev'

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-neo11-v3.mjs | tee /tmp/live-neo11.txt
          grep -Fq '"state": "pass"' /tmp/live-neo11.txt

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/live-height.txt
          grep -Fq '"state": "pass"' /tmp/live-height.txt

          BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" \
            node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/live-tools.txt
          grep -Fq '"state": "pass"' /tmp/live-tools.txt

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/live-story-v7.txt
          grep -Fq '"state": "pass"' /tmp/live-story-v7.txt

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-collapsible-layout-v8.mjs | tee /tmp/live-layout-v8.txt
          grep -Fq '"state": "pass"' /tmp/live-layout-v8.txt

          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-complete-v10.mjs | tee /tmp/live-complete-v10.txt
          grep -Fq '"state": "pass"' /tmp/live-complete-v10.txt

      - name: Upload live complete V10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-height-export-title-call-rune-v10-${{ github.sha }}
          path: |
            /tmp/live-build-info.json
            /tmp/live-localization.json
            /tmp/live-title-audit.json
            /tmp/live-index.html
            /tmp/live-story.html
            /tmp/live-attendance.html
            /tmp/live-runes.html
            /tmp/live-neo11.txt
            /tmp/live-height.txt
            /tmp/live-tools.txt
            /tmp/live-story-v7.txt
            /tmp/live-layout-v8.txt
            /tmp/live-complete-v10.txt
            /tmp/complete-v10-ocr.png
            /tmp/complete-v10-call-height.png
            /tmp/collapsible-v8-story-mobile.png
            /tmp/collapsible-v8-attendance-desktop.png
            /tmp/collapsible-v8-call-mobile.png
            /tmp/neo11-v3-mobile.png
            /tmp/neo11-v3-desktop.png
            /tmp/height-guide-v4-mobile.png
            /tmp/height-guide-v4-desktop.png
          if-no-files-found: warn
          retention-days: 30
