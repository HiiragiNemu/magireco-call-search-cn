name: Verify production deployment

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - scripts/smoke-neo11-v3.mjs
      - scripts/smoke-height-guide-v4.mjs
      - .github/workflows/verify-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages to serve height-guide V4
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          EXPECTED_RELEASE="$(python3 -c "import json; print(json.load(open('public/build-info.json', encoding='utf-8'))['release'])")"
          test "$EXPECTED_RELEASE" = 'neo11-height-guide-v4-20260816'

          ready=0
          for attempt in $(seq 1 90); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            echo "Deployment probe ${attempt}/90 for ${EXPECTED_RELEASE}"
            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "${BASE}/build-info.json?verify=${nonce}" -o /tmp/live-build-info.json \
              && grep -Fq "\"release\": \"${EXPECTED_RELEASE}\"" /tmp/live-build-info.json \
              && curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "${BASE}/?verify=${nonce}" -o /tmp/live-index.html \
              && grep -Fq "data-build=\"${EXPECTED_RELEASE}\"" /tmp/live-index.html \
              && grep -Fq './myfile/site-correction-v3.css' /tmp/live-index.html \
              && grep -Fq './myfile/site-correction-v3-network.js' /tmp/live-index.html \
              && grep -Fq './myfile/site-correction-v3-height.js' /tmp/live-index.html \
              && grep -Fq './myfile/site-correction-v4.css' /tmp/live-index.html \
              && grep -Fq './myfile/site-correction-v4.js' /tmp/live-index.html \
              && grep -Fq 'value="まどドラ">Magia Exedra' /tmp/live-index.html \
              && ! grep -Fq 'value="まどドラ">小圆前辈' /tmp/live-index.html; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Cloudflare Pages did not expose height-guide V4 within the verification window.' >&2
            cat /tmp/live-build-info.json 2>/dev/null || true
            grep -E 'data-build|site-correction-v[34]|まどドラ' /tmp/live-index.html 2>/dev/null | head -60 || true
            exit 1
          fi

          for asset in \
            site-correction-v3.css \
            site-correction-v3-network.js \
            site-correction-v3-height.js \
            site-correction-v4.css \
            site-correction-v4.js; do
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${BASE}/myfile/${asset}?verify=${GITHUB_RUN_ID}-$(date +%s%N)" \
              -o "/tmp/live-${asset}"
            test -s "/tmp/live-${asset}"
          done

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run Neo11 regression and height-guide V4 acceptance against production
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found.' >&2
            exit 1
          fi
          BASE_URL='https://magireco-call-search-cn.pages.dev' \
          CHROME_PATH="$CHROME" \
          node scripts/smoke-neo11-v3.mjs | tee /tmp/neo11-v3-live-report.txt
          grep -Fq '"state": "pass"' /tmp/neo11-v3-live-report.txt

          BASE_URL='https://magireco-call-search-cn.pages.dev' \
          CHROME_PATH="$CHROME" \
          node scripts/smoke-height-guide-v4.mjs | tee /tmp/height-guide-v4-live-report.txt
          grep -Fq '"state": "pass"' /tmp/height-guide-v4-live-report.txt

      - name: Upload live production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-height-guide-v4-${{ github.sha }}
          path: |
            /tmp/live-build-info.json
            /tmp/live-index.html
            /tmp/live-site-correction-v3.css
            /tmp/live-site-correction-v3-network.js
            /tmp/live-site-correction-v3-height.js
            /tmp/live-site-correction-v4.css
            /tmp/live-site-correction-v4.js
            /tmp/neo11-v3-live-report.txt
            /tmp/neo11-v3-mobile.png
            /tmp/neo11-v3-desktop.png
            /tmp/height-guide-v4-live-report.txt
            /tmp/height-guide-v4-mobile.png
            /tmp/height-guide-v4-desktop.png
          if-no-files-found: warn
          retention-days: 30
