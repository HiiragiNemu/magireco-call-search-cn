name: Verify production deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages to serve this release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          RELEASE='mobile-overhaul-20260816'
          ready=0

          for attempt in $(seq 1 90); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            echo "Deployment probe ${attempt}/90"

            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "${BASE}/build-info.json?verify=${nonce}" \
                -o /tmp/live-build-info.json \
              && grep -Fq '"release": "mobile-overhaul-20260816"' /tmp/live-build-info.json \
              && curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "${BASE}/?verify=${nonce}" \
                -o /tmp/live-index.html \
              && grep -Fq 'data-build="mobile-overhaul-20260816"' /tmp/live-index.html \
              && grep -Fq './myfile/site-overhaul.js' /tmp/live-index.html \
              && grep -Fq 'value="まどドラ">Magia Exedra' /tmp/live-index.html \
              && ! grep -Fq 'value="まどドラ">小圆前辈' /tmp/live-index.html; then
              ready=1
              echo "Cloudflare Pages is serving ${RELEASE}."
              break
            fi

            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Cloudflare Pages did not expose the expected release within the verification window.' >&2
            echo 'Last build-info response:' >&2
            cat /tmp/live-build-info.json 2>/dev/null || true
            echo 'Last index markers:' >&2
            grep -E 'data-build|site-overhaul|まどドラ' /tmp/live-index.html 2>/dev/null | head -20 || true
            exit 1
          fi

          nonce="${GITHUB_RUN_ID}-assets-$(date +%s%N)"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${BASE}/myfile/site-overhaul.js?verify=${nonce}" \
            -o /tmp/live-site-overhaul.js
          grep -Fq 'relationship-scroll-hint' /tmp/live-site-overhaul.js
          grep -Fq 'height-zoom-controls' /tmp/live-site-overhaul.js

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${BASE}/myfile/gradeOverrides.js?verify=${nonce}" \
            -o /tmp/live-grade-overrides.js
          grep -Fq "['瀬奈みこと', new Set(['中2', '中学生'])]" /tmp/live-grade-overrides.js
          grep -Fq "['行方晶', new Set(['中3', '中学生'])]" /tmp/live-grade-overrides.js

      - name: Run the mobile browser smoke test against the live site
        shell: bash
        env:
          LIVE_SITE: https://magireco-call-search-cn.pages.dev
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path

          source = Path('scripts/smoke-site.mjs').read_text(encoding='utf-8')
          live_url = os.environ['LIVE_SITE'].rstrip('/') + '/?verify=' + os.environ['GITHUB_SHA'] + '-' + os.environ['GITHUB_RUN_ID']
          old = "await send('Page.navigate', { url: 'http://127.0.0.1:8000/' });"
          new = f"await send('Page.navigate', {{ url: {live_url!r} }});"
          if source.count(old) != 1:
              raise SystemExit('The smoke-test navigation target could not be replaced safely.')
          Path('/tmp/smoke-live.mjs').write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node /tmp/smoke-live.mjs

      - name: Upload live mobile verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-verification-${{ github.sha }}
          path: |
            /tmp/mobile-relationship.png
            /tmp/mobile-height.png
            /tmp/live-build-info.json
            /tmp/live-index.html
          if-no-files-found: error
          retention-days: 14
