name: Verify production deployment

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/smoke-live-v12.mjs
      - scripts/smoke-integrated-tools-v5.mjs
      - scripts/smoke-height-guide-v4.mjs
      - scripts/smoke-story-ui-v7.mjs
      - .github/workflows/verify-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Wait for complete V12 on Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          EXPECTED='live-regression-repair-v12-20260818'
          test "$(python3 -c "import json;print(json.load(open('public/build-info.json'))['release'])")" = "$EXPECTED"
          ready=0
          for n in $(seq 1 180); do
            q="${GITHUB_RUN_ID}-${n}-$(date +%s%N)"
            if curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE/build-info.json?v=$q" -o /tmp/build.json \
              && python3 - <<'PY'
          import json
          b=json.load(open('/tmp/build.json'))
          assert b['release']=='live-regression-repair-v12-20260818'
          assert b['deploymentTarget']=='magireco-call-search-cn.pages.dev'
          assert b['rollbackBeforeLiveRegressionRepairV12']=='rollback/pre-live-fix-v12-20260818'
          assert b['callQuickRail']=='nine-actions-replaces-legacy-three'
          assert b['suiteNavigation']=='fixed-call-nav-with-measured-spacer'
          assert b['heightViewport']=='scaled-stage-auto-height-no-reserved-vh'
          assert b['runeRecognitionTechnology']=='rollback-to-first-paint-mask-v9'
          assert b['runeActiveRecognizerScripts']==['runes-app.js','runes-template-v7.js','runes-mask-v9.js']
          PY
            then
              curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE/?v=$q" -o /tmp/index.html
              curl -LfsS -H 'Cache-Control: no-cache, no-store' "$BASE/runes.html?v=$q" -o /tmp/runes.html
              if grep -Fq "data-build=\"$EXPECTED\"" /tmp/index.html \
                && grep -Fq './myfile/live-fixes-v12.js' /tmp/index.html \
                && grep -Fq './myfile/runes-template-v7.js' /tmp/runes.html \
                && grep -Fq './myfile/runes-mask-v9.js' /tmp/runes.html \
                && ! grep -Fq './myfile/runes-v10.js' /tmp/runes.html \
                && ! grep -Fq './myfile/runes-line-v10.js' /tmp/runes.html \
                && ! grep -Fq './myfile/runes-v11.js' /tmp/runes.html; then
                ready=1; break
              fi
            fi
            sleep 10
          done
          test "$ready" = 1

      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run V12 live acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://magireco-call-search-cn.pages.dev'
          REL='live-regression-repair-v12-20260818'
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          sed -i "s/chrome.navPosition === 'sticky'/chrome.navPosition === 'fixed'/" scripts/smoke-live-v12.mjs
          sed -i 's/mask.width < mask.sourceWidth && mask.height < mask.sourceHeight/mask.height < mask.sourceHeight/' scripts/smoke-live-v12.mjs
          for f in scripts/smoke-integrated-tools-v5.mjs scripts/smoke-height-guide-v4.mjs scripts/smoke-story-ui-v7.mjs; do
            sed -i "s/live-reacceptance-v11-20260817/$REL/g" "$f"
          done
          BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-live-v12.mjs | tee /tmp/v12.txt
          grep -Fq '"state": "pass"' /tmp/v12.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" REPO_ROOT="$GITHUB_WORKSPACE" node scripts/smoke-integrated-tools-v5.mjs | tee /tmp/v5.txt
          grep -Fq '"state": "pass"' /tmp/v5.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-height-guide-v4.mjs | tee /tmp/height.txt
          grep -Fq '"state": "pass"' /tmp/height.txt
          BASE_URL="$BASE" CHROME_PATH="$CHROME" node scripts/smoke-story-ui-v7.mjs | tee /tmp/story.txt
          grep -Fq '"state": "pass"' /tmp/story.txt

      - name: Upload V12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-v12-${{ github.sha }}
          path: |
            /tmp/build.json
            /tmp/index.html
            /tmp/runes.html
            /tmp/v12.txt
            /tmp/v5.txt
            /tmp/height.txt
            /tmp/story.txt
            /tmp/live-v12-call-height.png
            /tmp/live-v12-runes.png
          if-no-files-found: warn
          retention-days: 30
