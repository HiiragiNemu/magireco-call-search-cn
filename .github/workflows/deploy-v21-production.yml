                      h=h.replace('<li><a href="./story.html">è§’è‰²æ•…äº‹æœç´¢</a></li>','<li><a href="./story.html">è§’è‰²æ•…äº‹æœç´¢</a></li>\n\t\t\t\t'+editor,1)
