name: Deploy V21 production repair

on:
  push:
    branches:
      - main
    paths:
      - .deploy-v21-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v21-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record rollback point
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore reviewed source files
        shell: bash
        run: |
          set -euo pipefail
          source_branch='safe-v18-production-fix'
          git fetch origin "$source_branch"
          copy_from_source() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            git show "origin/$source_branch:$path" > "$path"
          }
          for path in \
            public/runes.html \
            public/story.html \
            public/story-title-editor.html \
            public/myfile/live-fixes-v12.js \
            public/myfile/runes-mask-glyph-v18.js \
            public/myfile/runes-v18.css \
            public/myfile/story-grouped-results-v18.js \
            public/myfile/story-title-editor-v2.css \
            public/myfile/story-title-editor-v2.js \
            public/myfile/story-title-password-v2.js \
            public/myfile/story-title-runtime-v2.js \
            scripts/build-story-title-groups-v1.py
          do
            copy_from_source "$path"
          done

      - name: Apply V21 production patches
        shell: bash
        run: |
          set -euo pipefail
          python .automation/v21-apply.py
          python -m pip install --quiet openpyxl
          python scripts/build-story-title-groups-v1.py
          python .automation/v21-verify.py
          for file in \
            public/myfile/call-ui-v10.js \
            public/myfile/layout-v8.js \
            public/myfile/live-fixes-v12.js \
            public/myfile/runes-mask-glyph-v18.js \
            public/myfile/story-grouped-results-v18.js \
            public/myfile/story-title-editor-v2.js \
            public/myfile/story-title-password-v2.js \
            public/myfile/story-title-runtime-v2.js
          do
            node --check "$file"
          done

      - name: Install browser dependency
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Local browser regression
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory public > /tmp/v21-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_URL=http://127.0.0.1:4173 \
          CHROME_PATH="$chrome" \
          node .automation/v21-smoke.mjs

      - name: Commit verified release to main
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "Deploy verified V21 production fixes"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          base='https://magireco-call-search-cn.pages.dev'
          for attempt in $(seq 1 90); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            index="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/?v21=$token" || true)"
            runes="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/runes.html?v21=$token" || true)"
            editor="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/story-title-editor.html?v21=$token" || true)"
            story="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/story.html?v21=$token" || true)"
            json_head="$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$base/downloads/story-title-groups.json?v21=$token" 2>/dev/null | head -c 1 || true)"
            if grep -Fq 'safe-call-layout-v21-20260819' <<< "$index" \
              && grep -Fq 'rune-glyph-color-chart-v21-20260819' <<< "$runes" \
              && grep -Fq 'story-title-dense-v21-20260819' <<< "$editor" \
              && grep -Fq 'story-parent-map-v21-20260819' <<< "$story" \
              && [[ "$json_head" == '{' ]]; then
              echo "Cloudflare Pages serves the V21 production build."
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for the V21 production build.' >&2
          exit 1

      - name: Production browser regression
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_URL=https://magireco-call-search-cn.pages.dev \
          CHROME_PATH="$chrome" \
          node .automation/v21-smoke.mjs

      - name: Write production proof
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/v21-proof
          cat > /tmp/v21-proof/result.json <<JSON
          {
            "state": "pass",
            "release_sha": "${{ steps.push.outputs.sha }}",
            "production": "https://magireco-call-search-cn.pages.dev",
            "run_id": "${GITHUB_RUN_ID}"
          }
          JSON

      - name: Upload production proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v21-production-proof-${{ github.run_id }}
          path: /tmp/v21-proof/result.json
          retention-days: 14

      - name: Roll back failed production deployment
        if: failure() && steps.push.outputs.pushed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ steps.base.outputs.sha }}'
          git fetch origin main
          git push --force-with-lease=refs/heads/main:$(git rev-parse origin/main) origin "$base_sha":refs/heads/main
