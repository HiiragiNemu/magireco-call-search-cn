name: Deploy verified V21 production repair

on:
  push:
    branches: [main]
    paths:
      - .deploy-v21-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magireco-call-search-v21-production
  cancel-in-progress: false

env:
  LIVE_BASE: https://magireco-call-search-cn.pages.dev

jobs:
  verify-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record rollback point
        id: base
        shell: bash
        run: |
          set -euo pipefail
          previous='${{ github.event.before }}'
          if [[ -z "$previous" || "$previous" =~ ^0+$ ]]; then previous="$(git rev-parse HEAD^)"; fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Restore reviewed V20 source and exact image fixtures
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin safe-v20-production-fix
          : >/tmp/v20-final.b64
          for part in 00 01 02 03 04 05 06 07 08; do
            git show "origin/safe-v20-production-fix:.automation/v20-final-bundle/part-${part}.b64" >>/tmp/v20-final.b64
          done
          tr -d '\n\r ' </tmp/v20-final.b64 | base64 -d >/tmp/v20-final.tar.gz
          tar -tzf /tmp/v20-final.tar.gz >/tmp/v20-final-members.txt
          python - <<'PY_BUNDLE'
          from pathlib import Path
          import tarfile
          root=Path.cwd().resolve()
          with tarfile.open('/tmp/v20-final.tar.gz','r:gz') as tf:
              for member in tf.getmembers():
                  target=(root/member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              tf.extractall(root)
          PY_BUNDLE
          test -f public/runes.html
          test -f public/story-title-editor.html
          test -f scripts/build-story-title-groups-v1.py
          test -f tests/fixtures/runes/charlotte.png
          test -f tests/fixtures/runes/alphabet.jpg

      - name: Apply exact production fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
