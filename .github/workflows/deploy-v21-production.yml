          import re
          root=Path('.')
          def read(p): return (root/p).read_text(encoding='utf-8')
          def write(p,s): (root/p).write_text(s,encoding='utf-8',newline='\n')

          p='public/myfile/callTable.js'; s=read(p)
          old='ç§ãƒãƒ£ãƒ³ (Watashi-chan / æˆ‘é…±ã€ç‹¬ç‰¹çš„è‡ªç§°ã€‘)'; new='ç§ãƒãƒ£ãƒ³ (Watashi-chan / æˆ‘é…±ã€ç›´è¯‘ã€‘/äººå®¶)'
          if old not in s and new not in s: raise SystemExit('Aika source string missing')
          write(p,s.replace(old,new))

          p='public/myfile/tools-suite.js'; write(p,read(p).replace("label: 'é­”å¥³æ–‡å­—è§£è¯»'","label: 'é­”å¥³æ–‡ç¿»è¯‘'"))
          p='public/myfile/layout-v8.js'; s=read(p)
          s=s.replace("['runes.html', 'é­”å¥³æ–‡å­—è§£è¯»']","['runes.html', 'é­”å¥³æ–‡ç¿»è¯‘']")
          s=s.replace("const search = createCallPanel('æœç´¢æ¡ä»¶', 'call-search-panel-v8', true);","const search = createCallPanel('æœç´¢æ¡ä»¶', 'call-search-panel-v8', false);")
