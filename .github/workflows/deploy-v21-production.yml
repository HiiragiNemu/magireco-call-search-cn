                  '\n\n/* V21 hamburger overlay isolation */\n'
                  '.header { z-index: 2147483000; isolation: isolate; }\n'
                  '.header .menu { z-index: 2147483001; }\n'
                  '.header .menu-icon { z-index: 2147483002; }\n'
                  'body:has(.menu-btn:checked) #pagetop,\n'
                  'body:has(.menu-btn:checked) #pagemdl,\n'
                  'body:has(.menu-btn:checked) #pagebtm,\n'
                  'body:has(.menu-btn:checked) .call-quick-rail-v10 {\n'
                  '  opacity: 0 !important;\n'
                  '  visibility: hidden !important;\n'
                  '  pointer-events: none !important;\n'
                  '}\n'
              )
          write(p,s)

          for name,marker in {'runes.html':'rune-glyph-color-chart-v21-20260819','story-title-editor.html':'story-title-dense-v21-20260819','story.html':'story-parent-map-v21-20260819'}.items():
              p=root/'public'/name; h=p.read_text(encoding='utf-8').replace('20260819-18','20260819-21')
              h=re.sub(r'data-build="[^"]*"',f'data-build="{marker}"',h,count=1)
              p.write_text(h,encoding='utf-8',newline='\n')
          PY

      - name: Build complete parent-story catalog
        run: |
          set -euo pipefail
          python -m pip install --quiet openpyxl
          python scripts/build-story-title-groups-v1.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-story-title-groups-v1.py
          for f in public/myfile/call-ui-v10.js public/myfile/layout-v8.js public/myfile/live-fixes-v12.js public/myfile/runes-mask-glyph-v18.js public/myfile/story-grouped-results-v18.js public/myfile/story-title-editor-v2.js public/myfile/story-title-password-v2.js public/myfile/story-title-runtime-v2.js; do node --check "$f"; done
          grep -Fq 'ç§ãƒãƒ£ãƒ³ (Watashi-chan / æˆ‘é…±ã€ç›´è¯‘ã€‘/äººå®¶)' public/myfile/callTable.js
          ! grep -Fq 'æˆ‘é…±ã€ç‹¬ç‰¹çš„è‡ªç§°ã€‘' public/myfile/callTable.js
          grep -Fq 'ç‚¹å‡»å³ä¾§çš„â€œæœâ€' public/index.html
          grep -Fq 'æˆ–æ­¤å¤„çš„â€œç§°å‘¼æœç´¢â€æŒ‰é’®' public/index.html
          grep -Fq 'æ¯æ•…äº‹æ ‡é¢˜ç¿»è¯æ¸…å•ï¼ˆç®¡ç†å‘˜ï¼‰' public/index.html
          grep -Fq 'V21 hamburger overlay isolation' public/myfile/hamburgerMenu.css
          ! grep -Fq "toggle.textContent = 'æ“ä½œè¯´æ˜'" public/myfile/call-ui-v10.js

