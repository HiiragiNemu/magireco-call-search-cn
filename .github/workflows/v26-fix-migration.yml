name: Fix V26 parent overlay and rerun migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v26-fix-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-v26-parent-overlay-fix
  cancel-in-progress: false

jobs:
  fix-and-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand V25 parent delta to the complete 2,166-parent authority map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-v26-repository.py')
          text = path.read_text(encoding='utf-8')
          old = '''    parents = payload["p"]
              suffixes = payload["s"]
              exact = payload["e"]
              parent_count = sum(len(value) for value in parents.values())
              if parent_count != 2166:
                  raise RuntimeError(f"unexpected parent count: {parent_count}")
          '''.replace('              ', '')
          new = '''    parent_delta = payload["p"]
              suffixes = payload["s"]
              exact = payload["e"]
              groups_data = json.loads((ROOT / "public/data/story-title-groups-v1.json").read_text(encoding="utf-8"))
              parents: dict[str, dict[str, str]] = {}
              for group in groups_data.get("groups") or []:
                  category = str(group.get("category") or "")
                  source_base = str(group.get("source_base") or "")
                  target = str(
                      (parent_delta.get(category) or {}).get(source_base)
                      or group.get("approved_translation")
                      or group.get("current_translation")
                      or source_base
                  ).strip()
                  if not category or not source_base or not target:
                      raise RuntimeError(f"invalid parent group: {group!r}")
                  parents.setdefault(category, {})[source_base] = target
              parent_count = sum(len(value) for value in parents.values())
              if parent_count != 2166:
                  raise RuntimeError(f"unexpected complete parent count: {parent_count}")
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('expected migration block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run corrected migration
        id: migrate
        shell: bash
        run: |
          set +e
          python scripts/migrate-v26-repository.py > /tmp/v26-migration.log 2>&1
          rc=$?
          cat /tmp/v26-migration.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate JavaScript
        id: js
        if: steps.migrate.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          {
            node --check public/myfile/story-title-runtime-v2.js
            node --check public/myfile/story-title-editor-v2.js
          } >> /tmp/v26-migration.log 2>&1
          rc=$?
          cat /tmp/v26-migration.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record corrected migration failure
        if: steps.migrate.outputs.rc != '0' || steps.js.outputs.rc != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p reports
          {
            echo 'Corrected V26 repository migration failed.'
            echo "migration_rc=${{ steps.migrate.outputs.rc }}"
            echo "js_rc=${{ steps.js.outputs.rc }}"
            echo "source_sha=$GITHUB_SHA"
            echo
            cat /tmp/v26-migration.log
          } > reports/v26-corrected-migration-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-corrected-migration-failure.txt
          git commit -m 'Record corrected V26 migration failure'
          git push origin HEAD:main
          exit 1

      - name: Commit the completed V26 convergence
        if: steps.migrate.outputs.rc == '0' && steps.js.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete V26 formal data and repository cleanup'
          git push origin HEAD:main
