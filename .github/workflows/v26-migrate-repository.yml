name: One-shot V26 formal data and repository cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-v26-repository.py
      - scripts/build-title-data.py
      - scripts/validate-production.py
      - .github/workflows/v26-migrate-repository.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-v26-formal-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run migration with captured diagnostics
        id: migrate
        shell: bash
        run: |
          set +e
          python scripts/migrate-v26-repository.py > /tmp/v26-migration.log 2>&1
          rc=$?
          cat /tmp/v26-migration.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated JavaScript
        id: js
        if: steps.migrate.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          {
            node --check public/myfile/story-title-runtime-v2.js
            node --check public/myfile/story-title-editor-v2.js
          } >> /tmp/v26-migration.log 2>&1
          rc=$?
          cat /tmp/v26-migration.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record migration failure
        if: steps.migrate.outputs.rc != '0' || steps.js.outputs.rc != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p reports
          {
            echo 'V26 repository migration failed.'
            echo "migration_rc=${{ steps.migrate.outputs.rc }}"
            echo "js_rc=${{ steps.js.outputs.rc }}"
            echo "source_sha=$GITHUB_SHA"
            echo
            cat /tmp/v26-migration.log
          } > reports/v26-repository-migration-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-repository-migration-failure.txt
          git commit -m 'Record V26 repository migration failure'
          git push origin HEAD:main
          exit 1

      - name: Commit fully converged repository to main
        if: steps.migrate.outputs.rc == '0' && steps.js.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete V26 formal data and repository cleanup'
          git push origin HEAD:main
