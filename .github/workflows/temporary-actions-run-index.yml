name: Temporary Actions run index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-actions-run-index.yml

permissions:
  actions: read
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            --jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,run_number,created_at,updated_at,html_url}]}' \
            > reports/temporary-actions-runs.json
      - name: Commit index and remove temporary workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p reports
          cp reports/temporary-actions-runs.json /tmp/temporary-actions-runs.json
          git reset --hard origin/main
          cp /tmp/temporary-actions-runs.json reports/temporary-actions-runs.json
          rm -f .github/workflows/temporary-actions-run-index.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record recent Actions runs for repair diagnostics'
          git push origin HEAD:main
