name: Temporary reviewed call-data sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/call-sync-audit-temporary.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed data-only patch locally
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/sync-call-data-20260928.py
          rm .github/workflows/call-sync-audit-temporary.yml
      - name: Existing production checks and focused multilingual tests
        run: |
          python scripts/cn_terminology.py
          python scripts/canonicalize-cn-artifacts.py --check
          python scripts/build-aio-edge-route-index.py --check
          python scripts/build-title-data.py --check
          python scripts/validate-production.py
          node scripts/validate-site.js
          python scripts/audit-translations-v5.py
          node --check public/myfile/callTable.js
          node --test tests/call-sync-20260928.test.mjs tests/call-relation-target.test.mjs tests/story-route-bridge-v1.test.mjs tests/aio-edge-function.test.mjs tests/ui-optics-local.test.mjs
          node tests/story-sprite-bridge-v1.test.mjs
      - name: Prepare an immutable commit for review; do not move any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root=pathlib.Path('.'); out=pathlib.Path('/tmp/call-sync-result'); out.mkdir()
          report=json.loads((root/'docs/call-sync-20260928.json').read_text())
          paths=['public/index.html','public/myfile/callTable.js','public/myfile/charaAt.js','public/myfile/charaBox_png.css','public/data/character-catalog.json','public/data/translation-audit-v5.json','docs/translation-audit-v5.md','docs/call-sync-20260928.json']+[p['outputPath'] for p in report['portraits']]
          for p in report['portraits']:
              existed=subprocess.run(['git','cat-file','-e','HEAD:'+p['outputPath']],capture_output=True).returncode==0
              if existed: raise SystemExit('Refusing to overwrite existing portrait '+p['outputPath'])
          actual=set(filter(None,subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')))
          actual.update(filter(None,subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')))
          actual.discard('.github/workflows/call-sync-audit-temporary.yml')
          if actual!=set(paths): raise SystemExit('Unexpected output paths: '+repr(actual.symmetric_difference(paths)))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--','.github/workflows/call-sync-audit-temporary.yml'],check=True)
          diff=subprocess.check_output(['git','diff','--cached','--binary']); (out/'patch.diff').write_bytes(diff)
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,body=None):
              req=urllib.request.Request(api+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          parent=os.environ['GITHUB_SHA']
          if request('/git/ref/heads/main')['object']['sha']!=parent: raise SystemExit('main moved; refusing stale-base preparation')
          base=request('/git/commits/'+parent)['tree']['sha']
          entries=[]
          for p in paths:
              data=(root/p).read_bytes()
              blob=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':p,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':'.github/workflows/call-sync-audit-temporary.yml','mode':'100644','type':'blob','sha':None})
          tree=request('/git/trees',{'base_tree':base,'tree':entries})
          commit=request('/git/commits',{'message':'fix(data): add seven upstream characters and portraits; sync eleven call entries','tree':tree['sha'],'parents':[parent]})
          result={'parent':parent,'preparedCommit':commit['sha'],'tree':tree['sha'],'productionFiles':paths,'existingPortraitsModified':0,'tests':'passed','branchUpdated':False}
          (out/'prepared-commit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(out/'production-patch.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(root/p,p)
          print('PREPARED_COMMIT='+commit['sha'])
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-sync-reviewed-result
          path: /tmp/call-sync-result/
          retention-days: 3
