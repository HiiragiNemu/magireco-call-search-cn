name: Temporary call-data sync audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/call-sync-audit-temporary.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public repository and upstream inputs without changing production
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request, urllib.parse, zipfile
          from html.parser import HTMLParser
          out = pathlib.Path('call-sync-audit'); out.mkdir()
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes = {'.js','.mjs','.cjs','.json','.html','.css','.py','.md','.yml','.yaml','.toml','.txt'}
          manifest = []
          with zipfile.ZipFile(out/'repository-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in filter(None, paths):
                  f = pathlib.Path(p)
                  manifest.append({'path':p,'size':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
                  if f.suffix.lower() in suffixes: z.write(f,p)
          (out/'repository-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          (out/'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          base = 'https://magireco-chara-search.vercel.app/call.html'
          log = []
          def get(url, dest):
              req=urllib.request.Request(url,headers={'User-Agent':'magireco-call-search-cn data sync audit','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  data=r.read(); status=r.status; mime=r.headers.get('Content-Type',''); final=r.url
              dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
              log.append({'url':url,'finalUrl':final,'file':str(dest.relative_to(out)),'status':status,'mime':mime,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              return data
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]; self.characters=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet': self.refs.append(a.get('href',''))
                  if tag=='script' and a.get('src'): self.refs.append(a['src'])
                  if tag=='input' and a.get('name')=='chara': self.characters.append(a)
          try:
              text=get(base,out/'upstream/call.html').decode('utf-8-sig'); parser=P(); parser.feed(text)
              (out/'upstream/characters.json').write_text(json.dumps(parser.characters,ensure_ascii=False,indent=2))
              for ref in parser.refs:
                  url=urllib.parse.urljoin(base,ref)
                  if urllib.parse.urlparse(url).netloc!='magireco-chara-search.vercel.app': continue
                  if not any(s in ref for s in ('charaBox','callTable','charaAt')): continue
                  try: get(url,out/'upstream'/pathlib.PurePosixPath(urllib.parse.urlparse(url).path).name)
                  except Exception as e: log.append({'url':url,'error':str(e)})
              names=['夜明すみれ','日暮ふうか','紫丁香','セルマ・テレーゼ','ワス','凪星そらな','リリー・キャンディー']
              for name in names:
                  for ext in ['png','webp']:
                      url=urllib.parse.urljoin(base,'img/'+ext+'/'+urllib.parse.quote(name)+'.'+ext)
                      try: get(url,out/'upstream/img'/ext/(name+'.'+ext))
                      except Exception as e: log.append({'url':url,'error':str(e)})
          finally:
              (out/'sources.json').write_text(json.dumps(log,ensure_ascii=False,indent=2))
          print(json.dumps(log,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-sync-audit-inputs
          path: call-sync-audit/
          retention-days: 3
