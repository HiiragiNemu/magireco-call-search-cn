name: Bridge rune mask V9 into OCR engines

on:
  push:
    branches:
      - fix/rune-mask-v9-20260816
    paths:
      - .github/workflows/patch-rune-mask-bridge-v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rune-mask-v9-20260816
          fetch-depth: 0

      - name: Route masked files through template and classic OCR
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('public/myfile/runes-template-v7.js')
          text = path.read_text(encoding='utf-8')
          old = "      const file = fileInput.files?.[0];"
          new = "      const file = global.__RUNE_INPUT_OVERRIDE_V9__ || fileInput.files?.[0];"
          if new not in text:
              if old not in text:
                  raise SystemExit('V7 file-input anchor missing.')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('public/myfile/runes-app.js')
          text = path.read_text(encoding='utf-8')
          old = "  async function recognize() {\n    if (!file) return;"
          new = "  async function recognize() {\n    const recognitionFile = global.__RUNE_INPUT_OVERRIDE_V9__ || file;\n    if (!recognitionFile) return;"
          if new not in text:
              if old not in text:
                  raise SystemExit('V6 recognize anchor missing.')
              text = text.replace(old, new, 1)
          old = "      const result = await runEnsemble(\n        file,"
          new = "      const result = await runEnsemble(\n        recognitionFile,"
          if new not in text:
              if old not in text:
                  raise SystemExit('V6 runEnsemble anchor missing.')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check public/myfile/runes-template-v7.js
          node --check public/myfile/runes-app.js
          node --check public/myfile/runes-mask-v9.js

      - name: Commit the OCR bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-template-v7.js public/myfile/runes-app.js
          if git diff --cached --quiet; then
            echo 'V9 OCR bridge is already applied.'
          else
            git commit -m 'Route paint-mask images through both OCR engines'
            git push origin HEAD:fix/rune-mask-v9-20260816
          fi
