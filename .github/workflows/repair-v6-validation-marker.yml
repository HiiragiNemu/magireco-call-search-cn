name: Repair V6 local snapshot validation marker

on:
  push:
    branches:
      - fix/story-ocr-layout-v6-20260816
    paths:
      - .github/workflows/repair-v6-validation-marker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-ocr-layout-v6-20260816
          fetch-depth: 0

      - name: Validate the snapshot mode in the manifest, not as a JavaScript literal
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/integrate-story-ocr-layout-v6.py')
          text = path.read_text(encoding='utf-8')
          old = "for (const marker of ['MANIFEST_URL', 'manual-static-snapshot', 'loadCategory', 'rowMatches'])"
          new = "for (const marker of ['MANIFEST_URL', './data/story-v6/', 'loadCategory', 'rowMatches'])"
          if old not in text:
              raise SystemExit('V6 story marker list not found.')
          text = text.replace(old, new, 1)
          anchor = "  if (manifest.totalRows < 14000 || manifest.categories.length !== 19) fail('V6 story snapshot is incomplete.');"
          addition = anchor + "\n  if (manifest.source?.mode !== 'manual-static-snapshot') fail('V6 story snapshot mode is not manual-static-snapshot.');"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Manifest validation anchor not found.')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/integrate-story-ocr-layout-v6.py

      - name: Commit repair and trigger the gated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/integrate-story-ocr-layout-v6.py
          git commit -m 'Validate V6 static snapshot mode in its manifest'
          git push origin HEAD:fix/story-ocr-layout-v6-20260816
