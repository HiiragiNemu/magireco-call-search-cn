name: Repair V5 rune OCR acceptance V2

on:
  push:
    branches:
      - fix/integrated-tools-v5-20260816
    paths:
      - .github/workflows/repair-rune-ocr-v5-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integrated-tools-v5-20260816
          fetch-depth: 0
      - name: Patch OCR implementation and acceptance sample
        shell: bash
        run: |
          set -euo pipefail
          echo ' ' | tr -d ' ' | base64 -d > /tmp/patch-rune-ocr-v5.py
          python3 /tmp/patch-rune-ocr-v5.py
          node --check public/myfile/runes-app.js
          node --check scripts/smoke-integrated-tools-v5.mjs
      - name: Commit OCR correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-app.js scripts/smoke-integrated-tools-v5.mjs
          git commit -m 'Use adaptive segmentation for witch-rune OCR'
          git push origin HEAD:fix/integrated-tools-v5-20260816
