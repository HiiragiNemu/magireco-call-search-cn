name: Final V26 repository convergence

on:
  push:
    branches: [main]
    paths:
      - scripts/v26-final-converge.py
      - .github/workflows/v26-final-convergence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-v26-repository-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run convergence with captured diagnostics
        id: run
        shell: bash
        run: |
          set +e
          python scripts/v26-final-converge.py > /tmp/v26-final-convergence.log 2>&1
          rc=$?
          cat /tmp/v26-final-convergence.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated JavaScript syntax
        id: js
        if: steps.run.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          {
            node --check public/myfile/story-title-runtime-v2.js
            node --check public/myfile/story-title-editor-v2.js
          } >> /tmp/v26-final-convergence.log 2>&1
          rc=$?
          cat /tmp/v26-final-convergence.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit failure diagnostics
        if: steps.run.outputs.rc != '0' || steps.js.outputs.rc != '0'
        shell: bash
        run: |
          set -euo pipefail
          run_rc='${{ steps.run.outputs.rc }}'
          js_rc='${{ steps.js.outputs.rc }}'
          git reset --hard HEAD
          mkdir -p reports
          {
            echo 'V26 final convergence failed.'
            echo "run_rc=$run_rc"
            echo "js_rc=${js_rc:-not-run}"
            echo "source_sha=$GITHUB_SHA"
            echo
            cat /tmp/v26-final-convergence.log
          } > reports/v26-final-convergence-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v26-final-convergence-failure.txt
          git commit -m 'Record final V26 convergence failure diagnostics'
          git push origin HEAD:main
          exit 1

      - name: Commit converged repository directly to main
        if: steps.run.outputs.rc == '0' && steps.js.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Convergence generated no changes.' >&2
            exit 1
          fi
          git commit -m 'Complete V26 repository convergence'
          git push origin HEAD:main
