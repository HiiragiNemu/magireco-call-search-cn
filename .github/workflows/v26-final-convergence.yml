name: Final V26 repository convergence

on:
  push:
    branches: [main]
    paths:
      - scripts/v26-final-converge.py
      - .github/workflows/v26-final-convergence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-v26-repository-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build formal title data, fix local override isolation, and clean repository
        run: python scripts/v26-final-converge.py

      - name: Validate JavaScript syntax
        run: |
          node --check public/myfile/story-title-runtime-v2.js
          node --check public/myfile/story-title-editor-v2.js

      - name: Commit converged repository directly to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Convergence generated no changes.' >&2
            exit 1
          fi
          git commit -m 'Complete V26 repository convergence'
          git push origin HEAD:main
