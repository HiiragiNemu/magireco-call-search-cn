name: Repair V5 rune OCR acceptance

on:
  push:
    branches:
      - fix/integrated-tools-v5-20260816
    paths:
      - .github/workflows/repair-rune-ocr-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integrated-tools-v5-20260816
          fetch-depth: 0

      - name: Adapt page segmentation to the selected rune crop
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('public/myfile/runes-app.js')
          app = app_path.read_text(encoding='utf-8')
          old_worker = """    try {
      await worker.setParameters({
        tessedit_pageseg_mode: global.Tesseract.PSM?.SINGLE_LINE ?? '7',
        preserve_interword_spaces: '1'
      });
    } catch (error) {
      console.warn('OCR 参数设置失败，将使用模型默认值。', error);
    }
    return worker;"""
          new_worker = """    try {
      await worker.setParameters({ preserve_interword_spaces: '1' });
    } catch (error) {
      console.warn('OCR 参数设置失败，将使用模型默认值。', error);
    }
    return worker;"""
          if old_worker not in app:
              raise SystemExit('OCR worker parameter block not found.')
          app = app.replace(old_worker, new_worker, 1)

          old_recognize = """      const current = await getWorker(nodes.runesModel.value);
      if (serial !== recognizeSerial) return;
      const result = await current.recognize(canvas);"""
          new_recognize = """      const current = await getWorker(nodes.runesModel.value);
      if (serial !== recognizeSerial) return;
      const aspect = canvas.width / Math.max(1, canvas.height);
      const psm = aspect < 1.5
        ? (global.Tesseract.PSM?.SINGLE_CHAR ?? '10')
        : aspect < 14
          ? (global.Tesseract.PSM?.SINGLE_LINE ?? '7')
          : (global.Tesseract.PSM?.SPARSE_TEXT ?? '11');
      try {
        await current.setParameters({
          tessedit_pageseg_mode: psm,
          preserve_interword_spaces: '1'
        });
      } catch (error) {
        console.warn('无法切换 OCR 分页模式，将使用模型默认值。', error);
      }
      const result = await current.recognize(canvas);"""
          if old_recognize not in app:
              raise SystemExit('OCR recognition block not found.')
          app = app.replace(old_recognize, new_recognize, 1)
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('scripts/smoke-integrated-tools-v5.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_upload = """  const input = await page.$('#runesFile');
  await input.uploadFile(path.join(REPO_ROOT, 'public', 'mdkOCR', 'madokarunes.jpg'));
  await page.waitForFunction(() => !document.getElementById('runesRecognize').disabled, { timeout: 10000 });"""
          new_upload = """  await page.evaluate(async () => {
    const source = new Image();
    source.src = `./mdkOCR/madokarunes.jpg?sample=${Date.now()}`;
    await source.decode();
    const crop = document.createElement('canvas');
    crop.width = 512;
    crop.height = 400;
    const context = crop.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, crop.width, crop.height);
    context.imageSmoothingEnabled = false;
    context.drawImage(source, 7, 6, 64, 50, 0, 0, crop.width, crop.height);
    const blob = await new Promise((resolve) => crop.toBlob(resolve, 'image/png'));
    const file = new File([blob], 'known-rune-A.png', { type: 'image/png' });
    const transfer = new DataTransfer();
    transfer.items.add(file);
    const input = document.getElementById('runesFile');
    input.files = transfer.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
  });
  await page.waitForFunction(() => !document.getElementById('runesRecognize').disabled, { timeout: 10000 });"""
          if old_upload not in test:
              raise SystemExit('OCR acceptance upload block not found.')
          test = test.replace(old_upload, new_upload, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          node --check public/myfile/runes-app.js
          node --check scripts/smoke-integrated-tools-v5.mjs

      - name: Commit OCR correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/myfile/runes-app.js scripts/smoke-integrated-tools-v5.mjs
          git commit -m 'Use adaptive segmentation for witch-rune OCR'
          git push origin HEAD:fix/integrated-tools-v5-20260816
