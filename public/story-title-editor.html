<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在一张密集表格中校对母故事标题，并自动映射到全部子剧情。">
  <title>母故事标题翻译清单</title>
  <link rel="stylesheet" href="./myfile/tools-suite.css?v=20260819-19">
  <link rel="stylesheet" href="./myfile/layout-v6.css">
  <link rel="stylesheet" href="./myfile/suite-v7.css">
  <link rel="stylesheet" href="./myfile/live-fixes-v11.css">
  <link rel="stylesheet" href="./myfile/story-title-editor-v2.css?v=20260819-19">
</head>
<body data-build="v25-emergency-restored-20260822" class="suite-page" data-suite-tool="story">
  <nav class="suite-nav" data-suite-nav aria-label="工具模式切换"></nav>
  <main class="suite-shell story-title-editor-v2" data-suite-nav-anchor>
    <section class="suite-panel">
      <h1>母故事标题翻译清单</h1>
      <p class="story-title-intro-v2">一行一个母故事。左边是原始日文母标题，右边是网站当前显示文本；同一母故事的全部话数、DAY、序章和分支会自动继承这一处修改。</p>
      <div class="story-title-summary-v2">
        <span>母故事：<strong id="titleTotalGroups">—</strong></span>
        <span>完整子剧情：<strong id="titleTotalChildren">—</strong></span>
        <span>已修改：<strong id="titleEditedGroups">0</strong></span>
        <span>当前显示：<strong id="titleVisibleGroups">—</strong></span>
      </div>

      <div class="story-title-toolbar-v2">
        <label class="suite-field" for="titleGroupSearch"><span>搜索</span>
          <input id="titleGroupSearch" class="suite-input" type="search" spellcheck="false" placeholder="日文母标题或网站显示文本">
        </label>
        <label class="suite-field" for="titleCategoryFilter"><span>分类</span>
          <select id="titleCategoryFilter" class="suite-select"><option value="">全部分类</option></select>
        </label>
        <label class="story-title-changed-toggle-v2"><input id="titleOnlyChanged" type="checkbox">只看已修改</label>
      </div>

      <div class="story-title-password-v2" id="storyTitlePasswordGate">
        <input id="storyTitlePasswordInput" class="suite-input" type="password" autocomplete="current-password" spellcheck="false" placeholder="管理员密码">
        <button id="storyTitlePasswordUnlock" type="button" class="suite-button primary">解锁</button>
        <button id="storyTitlePasswordLock" type="button" class="suite-button secondary">锁定</button>
        <div id="storyTitlePasswordState" class="suite-status" role="status" aria-live="polite"></div>
      </div>

      <div class="story-title-actions-v2">
        <button id="titleSaveLocal" type="button" class="suite-button primary">保存并应用</button>
        <button id="titleClearLocal" type="button" class="suite-button secondary">清除本地修改</button>
        <label class="suite-button secondary story-title-file-v2">导入 JSON／CSV／XLSX
          <input id="titleImportFile" type="file" accept=".json,.csv,.xlsx,.xls,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </label>
        <button id="titleExportOverridesJson" type="button" class="suite-button secondary">导出变更 JSON</button>
        <button id="titleExportExactJson" type="button" class="suite-button secondary">导出网站映射 JSON</button>
        <button id="titleExportCsv" type="button" class="suite-button secondary">导出完整 CSV</button>
        <button id="titleExportXlsx" type="button" class="suite-button secondary">导出完整 XLSX</button>
        <a class="suite-button secondary" href="./downloads/story-title-groups.csv" download>下载仓库基准 CSV</a>
        <a class="suite-button secondary" href="./downloads/story-title-groups.json" download>下载仓库基准 JSON</a>
        <a class="suite-button secondary" href="./story.html">打开故事搜索</a>
      </div>
      <div id="titleEditorStatus" class="suite-status" role="status" aria-live="polite">正在加载母故事清单…</div>
    </section>

    <section class="suite-panel">
      <div class="story-title-table-wrap-v2">
        <table class="story-title-table-v2">
          <colgroup><col><col></colgroup>
          <thead><tr><th>原始日文母故事名</th><th>网站显示文本</th></tr></thead>
          <tbody id="titleEditorList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./myfile/tools-suite.js?v=20260819-19"></script>
  <script src="./myfile/suite-v7.js"></script>
  <script src="./myfile/story-title-runtime-v2.js?v=20260822-emergency1"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="./myfile/story-title-password-v2.js?v=20260819-19"></script>
  <script src="./myfile/story-title-editor-v2.js?v=20260819-19"></script>
</body>
</html>
