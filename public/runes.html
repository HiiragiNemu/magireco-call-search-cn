<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在浏览器内识别魔法少女小圆与魔法纪录中的魔女文字。">
  <title>魔女文翻译</title>
  <link rel="stylesheet" href="./myfile/tools-suite.css?v=20260819-19">
  <link rel="stylesheet" href="./myfile/layout-v6.css">
  <link rel="stylesheet" href="./myfile/suite-v7.css">
  <link rel="stylesheet" href="./myfile/layout-v8.css?v=20260819-19">
  <link rel="stylesheet" href="./myfile/runes-mask-v9.css">
  <link rel="stylesheet" href="./myfile/runes-v10.css">
  <link rel="stylesheet" href="./myfile/live-fixes-v11.css">
  <link rel="stylesheet" href="./myfile/live-fixes-v12.css">
  <link rel="stylesheet" href="./myfile/runes-v18.css?v=20260819-19">
</head>
<body data-build="rune-glyph-color-chart-v21-20260819" class="suite-page" data-build="rune-safe-v19-20260819" data-rune-release="rune-glyph-color-chart-v19-20260819" data-suite-tool="runes">
  <nav class="suite-nav" data-suite-nav aria-label="工具模式切换"></nav>
  <main class="suite-shell" data-suite-nav-anchor>
    <header class="suite-hero"><h1>魔女文翻译</h1></header>

    <section class="suite-panel runes-layout" aria-labelledby="runes-input-title">
      <div>
        <h2 id="runes-input-title">识别图片</h2>
        <div id="runesDrop" class="runes-drop">
          <div>
            <p><strong>点击选择图片，或把图片拖到这里</strong></p>
            <p>支持黑底白字、白底黑字、上下边框、复杂彩色场景和带普通拉丁标注的标准字母表。</p>
            <input id="runesFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" class="suite-input">
          </div>
        </div>
        <div class="suite-grid" style="margin-top:12px">
          <label class="suite-field" for="runesModel">
            <span>文字体系</span>
            <select id="runesModel" class="suite-select">
              <option value="mdk">标准魔女文字（MadokaRunes）</option>
              <option value="mdm">音乐体魔女文字（MadokaMusical）</option>
            </select>
          </label>
          <label class="suite-field" for="runesPreprocess">
            <span>图像预处理</span>
            <select id="runesPreprocess" class="suite-select">
              <option value="auto">智能多方案（推荐）</option>
              <option value="border">强制自动去边框／去背景</option>
              <option value="decorated">复杂背景（彩色／黑底白字自动取文字行）</option>
              <option value="contrast">灰度高对比</option>
              <option value="invert">反色高对比</option>
              <option value="original">保持原图</option>
            </select>
          </label>
          <label class="suite-field" for="runesLayout">
            <span>文字布局</span>
            <select id="runesLayout" class="suite-select">
              <option value="auto">自动判断</option>
              <option value="line">单行文字</option>
              <option value="block">多行／段落</option>
              <option value="chart">字母表／规则网格（忽略普通拉丁标注）</option>
              <option value="character">单个字符</option>
            </select>
          </label>
        </div>
        <div class="suite-actions">
          <button id="runesRecognize" type="button" class="suite-button primary" disabled>开始识别</button>
          <button id="runesClear" type="button" class="suite-button secondary">清除</button>
        </div>
        <div id="runesStatus" class="suite-status" role="status" aria-live="polite">请选择一张图片。</div>
        <progress id="runesProgress" class="runes-progress" max="1" value="0" hidden></progress>
      </div>
      <div>
        <h2>图像预览</h2>
        <div class="suite-notice" id="runesPreviewEmpty">尚未选择图片。</div>
        <img id="runesPreview" class="runes-preview" alt="待识别图片预览" hidden>
        <div class="runes-processed-wrap-v6">
          <h3>处理后图像</h3>
          <canvas id="runesCanvas" class="runes-preview" aria-label="文字分离和二值化后的识别图像" hidden></canvas>
        </div>
      </div>
    </section>

    <section class="suite-panel" aria-labelledby="runes-result-title">
      <h2 id="runes-result-title">识别结果</h2>
      <textarea id="runesOutput" class="suite-textarea" spellcheck="false" placeholder="识别出的拉丁字母会显示在这里"></textarea>
      <div class="suite-actions">
        <button id="runesCopy" type="button" class="suite-button secondary">复制结果</button>
      </div>
      <pre id="runesDiagnostics" class="runes-diagnostics-v6" aria-label="OCR 候选方案诊断"></pre>
      <p class="suite-notice">复杂背景先分离文字行，再用登记字形模板逐字分类；标准字母表模式会忽略每个魔女文字下方的普通拉丁字母。置信度不足时才回退本地 Madoka OCR 模型。</p>
    </section>

    <section class="suite-panel" aria-labelledby="runes-reference-title">
      <h2 id="runes-reference-title">已登记魔女文字对照表</h2>
      <img class="runes-reference" src="./mdkOCR/madokarunes.jpg" alt="MadokaRunes 魔女文字与拉丁字母对照表">
      <p class="suite-notice">本地模型：<a href="./mdkOCR/mdk.traineddata">MadokaRunes</a>、<a href="./mdkOCR/mdm.traineddata">MadokaMusical</a>。</p>
    </section>
  </main>

  <script src="./myfile/tools-suite.js?v=20260819-19"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous"></script>
  <script src="./myfile/runes-app.js"></script>
  <script src="./myfile/runes-template-v7.js"></script>
  <script src="./myfile/layout-v8.js?v=20260819-19"></script>
  <script src="./myfile/runes-mask-v9.js"></script>
  <script src="./myfile/live-fixes-v11.js"></script>
  <script src="./myfile/live-fixes-v12.js?v=20260819-19"></script>
  <script src="./myfile/runes-glyph-v16.js?v=20260819-19"></script>
  <script src="./myfile/runes-fix-v14.js?v=20260819-19"></script>
  <script src="./myfile/runes-mask-glyph-v18.js?v=20260819-19"></script>
  <script src="./myfile/runes-fix-v13.js?v=20260819-19"></script>
  <script src="./myfile/runes-chart-v15.js?v=20260819-19"></script>
</body>
</html>
