<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="按话数统计魔法纪录角色之间共同出场次数。">
  <title>魔法纪录共同出场次数排行</title>
  <link rel="stylesheet" href="./myfile/tools-suite.css">
  <link rel="stylesheet" href="./myfile/layout-v6.css">
  <link rel="stylesheet" href="./myfile/suite-v7.css">
  <link rel="stylesheet" href="./myfile/layout-v8.css">
</head>
<body class="suite-page" data-build="rune-mask-v9-20260816" data-suite-tool="attendance">
  <nav class="suite-nav" data-suite-nav aria-label="工具模式切换"></nav>
  <main class="suite-shell" data-suite-nav-anchor>
    <header class="suite-hero"><h1>共同出场次数排行</h1></header>

    <section class="suite-panel" aria-labelledby="attendance-character-title">
      <h2 id="attendance-character-title">选择基准角色</h2>
      <div class="suite-grid two">
        <label class="suite-field" for="attendanceFilter">
          <span>角色名筛选</span>
          <input class="suite-input" id="attendanceFilter" type="search" spellcheck="false" placeholder="中文、日文、假名或罗马音；空格表示 OR">
        </label>
        <div class="suite-field">
          <span>当前选择</span>
          <div id="attendanceSelected" class="suite-selected-summary">尚未选择角色</div>
          <button type="button" id="attendanceClear" class="suite-button secondary">清除选择和排行</button>
        </div>
      </div>
      <p id="attendanceCharacterCount" class="suite-status">正在加载角色目录…</p>
      <div id="attendanceGrid" class="suite-character-grid" aria-label="角色列表"></div>
      <div id="attendanceStatus" class="suite-status" role="status" aria-live="polite">点击任意角色即可生成排行。</div>
    </section>

    <section id="attendanceResults" class="suite-panel suite-results" aria-labelledby="attendance-results-title">
      <h2 id="attendance-results-title">排行结果</h2>
      <div id="attendanceResultsBody" class="suite-notice">尚未选择角色。</div>
    </section>
  </main>
  <script src="./myfile/tools-suite.js"></script>
  <script src="./myfile/charaAt.js"></script>
  <script src="./myfile/suite-v7.js"></script>
  <script src="./myfile/attendance-app-v7.js"></script>
  <script src="./myfile/layout-v8.js"></script>
</body>
</html>
